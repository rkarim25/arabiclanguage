<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0d7a5f">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>Sentence Practice & Master Bank — Arabic العربية</title>
  <link rel="stylesheet" href="css/fonts.css?v=muivqwju">
  <link rel="stylesheet" href="css/style.css?v=muivqwju">
  <style>
    .s-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 14px; }
    .stat-strip { display: flex; gap: 20px; align-items: baseline; }
    .stat-strip .num { font-size: 26px; font-weight: 700; color: var(--accent); line-height: 1; }
    .stat-strip .lbl { font-size: 12px; color: var(--muted); }

    /* Top View Switcher */
    .tab-bar { display: inline-flex; border: 1px solid var(--border); border-radius: 999px; background: var(--card); padding: 3px; gap: 4px; margin-bottom: 16px; }
    .tab-btn { border: none; background: transparent; padding: 7px 16px; border-radius: 999px; font-size: 13.5px; font-weight: 600; cursor: pointer; color: var(--muted); transition: all 0.15s; }
    .tab-btn.active { background: var(--accent); color: #fff; box-shadow: 0 2px 6px rgba(13,122,95,0.25); }

    /* Direction / Mode Selector */
    .control-row { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
    .dir-toggle { display: inline-flex; border: 1px solid var(--border); border-radius: 999px; background: var(--card); padding: 2px; }
    .dir-btn { border: none; background: transparent; padding: 5px 12px; border-radius: 999px; font-size: 12.5px; font-weight: 600; cursor: pointer; color: var(--muted); }
    .dir-btn.active { background: var(--accent-soft); color: var(--accent); border: 1px solid var(--accent); }

    /* Filter Chips */
    .filter-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
    .chip { border: 1px solid var(--border); background: var(--card); border-radius: 999px; padding: 4px 12px; font-size: 12.5px; cursor: pointer; color: var(--muted); transition: all 0.12s; }
    .chip:hover { border-color: var(--accent); }
    .chip.active { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }

    /* 10-Sentence Cards */
    .sentence-grid { display: flex; flex-direction: column; gap: 12px; }
    .s-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px 18px; display: flex; flex-direction: column; gap: 10px; transition: border-color 0.15s; cursor: pointer; }
    .s-card:hover { border-color: var(--accent); }
    .s-card.active { border-color: var(--accent); background: var(--accent-soft); }
    .s-top { display: flex; justify-content: space-between; align-items: baseline; width: 100%; flex-wrap: wrap; gap: 8px; }
    .s-prompt { font-size: 17.5px; font-weight: 600; color: var(--ink); line-height: 1.4; }
    .s-prompt.ar { font-family: var(--font-ar); font-size: 26px; color: var(--accent); direction: rtl; text-align: right; line-height: 1.6; }
    .s-meta { font-size: 12px; color: var(--muted); }

    /* Exposure & Depth Badge */
    .exp-badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: rgba(0,0,0,0.05); color: var(--muted); }
    .exp-badge.new { background: #e0f2fe; color: #0284c7; }
    .exp-dots { color: var(--accent); letter-spacing: 1px; }

    /* Masked Reveal Box */
    .reveal-box { background: var(--bg); border: 1px dashed var(--border); border-radius: 8px; padding: 10px 14px; text-align: center; font-size: 13.5px; color: var(--muted); transition: all 0.12s; user-select: none; }
    .reveal-box:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
    .revealed-content { display: flex; flex-direction: column; gap: 8px; border-top: 1px dashed var(--border); padding-top: 10px; margin-top: 2px; }
    .revealed-ar-wrap { display: flex; justify-content: space-between; align-items: baseline; width: 100%; gap: 12px; }
    .revealed-ar { font-family: var(--font-ar); font-size: 26px; color: var(--accent); direction: rtl; text-align: right; line-height: 1.6; flex: 1; }
    .revealed-en { font-size: 16px; font-weight: 600; color: var(--ink); }

    /* Word-by-Word Chips */
    .s-wbw { display: flex; flex-wrap: wrap; gap: 6px; direction: rtl; margin-top: 4px; }
    .wbw-chip { border: 1px solid var(--border); border-radius: 6px; padding: 3px 8px; background: var(--bg); font-size: 13px; cursor: pointer; text-align: center; transition: all 0.12s; }
    .wbw-chip:hover { border-color: var(--accent); background: var(--accent-soft); transform: translateY(-1px); }
    .wbw-chip .w-ar { font-family: var(--font-ar); font-size: 17px; color: var(--accent); display: block; line-height: 1.35; }
    .wbw-chip .w-en { font-size: 10.5px; color: var(--muted); display: block; direction: ltr; margin-top: 2px; }

    /* 5 Rating Pills */
    .rate-bar { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 4px; padding-top: 8px; border-top: 1px solid var(--border); }
    .rate-btn { border: 1px solid var(--border); background: var(--card); border-radius: 999px; padding: 4px 11px; font-size: 11.5px; font-weight: 600; cursor: pointer; transition: all 0.1s; }
    .rate-btn:hover { transform: translateY(-1px); }
    
    .rate-btn[data-b="strong"] { color: #047857; border-color: #a7f3d0; }
    .rate-btn[data-b="strong"].selected { background: #059669; color: #fff; border-color: #059669; }

    .rate-btn[data-b="medium"] { color: #0284c7; border-color: #bae6fd; }
    .rate-btn[data-b="medium"].selected { background: #0284c7; color: #fff; border-color: #0284c7; }

    .rate-btn[data-b="weak"] { color: #d97706; border-color: #fde68a; }
    .rate-btn[data-b="weak"].selected { background: #d97706; color: #fff; border-color: #d97706; }

    .rate-btn[data-b="learning"] { color: #dc2626; border-color: #fecaca; }
    .rate-btn[data-b="learning"].selected { background: #dc2626; color: #fff; border-color: #dc2626; }

    .rate-btn[data-b="never"] { color: var(--muted); border-color: var(--border); }
    .rate-btn[data-b="never"].selected { background: var(--muted); color: #fff; border-color: var(--muted); }

    /* Audio Bar */
    .audio-toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 8px 12px; background: #f6f2ea; border: 1px solid var(--border); border-radius: 12px; margin-bottom: 14px; }
    @media (prefers-color-scheme: dark) { .audio-toolbar { background: rgba(255,255,255,0.04); } }
    .audio-toolbar button { padding: 4px 10px; font-size: 12.5px; }
    .audio-toolbar button.playing { background: var(--amber); color: #fff; border-color: var(--amber); }

    /* Master Bank Cards */
    .m-search { width: 100%; max-width: 380px; padding: 8px 14px; border: 1px solid var(--border); border-radius: 10px; font-size: 13.5px; background: var(--card); color: var(--ink); }
    .bank-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
    .bank-card:hover { border-color: var(--accent); }

    /* Completion Banner */
    .done-banner { text-align: center; padding: 22px; background: var(--accent-soft); border: 1px solid var(--accent); border-radius: 14px; margin-top: 16px; }
  </style>
</head>
<body>
<main>
  <div class="s-header">
    <div>
      <h1 style="display:flex;align-items:center;gap:10px;margin:0">
        <span>Sentence Practice</span>
        <span class="arabic" style="color:var(--accent);font-size:26px">بِنَاءُ الجُمَل</span>
      </h1>
      <p class="sub" style="margin:2px 0">Active recall · 10-sentence dynamic batches · 70/30 review ratio</p>
    </div>
    <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap">
      <div class="stat-strip">
        <div><div class="num" id="statHeld">0</div><div class="lbl">Sentences Held</div></div>
        <div><div class="num" id="statDue">0</div><div class="lbl">Due for Review</div></div>
        <div><div class="num" id="statTotal">0</div><div class="lbl">Master Bank</div></div>
      </div>
    </div>
  </div>

  <!-- Top View Switcher -->
  <div class="tab-bar">
    <button type="button" class="tab-btn active" id="tabPractice" onclick="switchView('practice')">⚡ Practice Batch (10)</button>
    <button type="button" class="tab-btn" id="tabMaster" onclick="switchView('master')">📋 Master Sentence Bank (1,200+)</button>
  </div>

  <!-- PRACTICE VIEW -->
  <div id="viewPractice">
    <div class="control-row">
      <div class="dir-toggle">
        <button type="button" class="dir-btn active" id="dirEnFirst" onclick="setDirection('en-first')">🇬🇧 English Prompt → Reveal Arabic</button>
        <button type="button" class="dir-btn" id="dirArFirst" onclick="setDirection('ar-first')">🇸🇦 Arabic Prompt → Reveal English</button>
      </div>
      <button type="button" class="small" onclick="revealAllCards()" style="font-size:12px">👁️ Reveal All 10</button>
    </div>

    <!-- Filter chips -->
    <div class="filter-chips" id="filterChips">
      <button type="button" class="chip active" data-filter="balanced">Balanced 70/30 (7 Due · 3 New)</button>
      <button type="button" class="chip" data-filter="due">Due for Review</button>
      <button type="button" class="chip" data-filter="new">New Sentences Only</button>
      <button type="button" class="chip" data-filter="chapters">📖 Daily 10 Chapters</button>
      <button type="button" class="chip" data-filter="teacher">🧑‍🏫 Preply Sunday Class</button>
      <button type="button" class="chip" data-filter="quran">🕌 Qur'an Ayat</button>
      <button type="button" class="chip" data-filter="everyday">🗣 Everyday Frames</button>
    </div>

    <!-- Audio Controls -->
    <div class="audio-toolbar">
      <span style="font-size:12.5px;font-weight:700">🎧 Audio:</span>
      <button type="button" id="btnPlayAll">▶ Play All 10</button>
      <button type="button" id="btnPlayPauses" title="Plays Arabic, pauses 3s for you to recall, then says English">⏸ Play with Recall Gap</button>
      <button type="button" id="btnStop" style="display:none">⏹ Stop</button>
      <span class="speed-sw" style="display:inline-flex;gap:4px;margin-left:auto">
        <button type="button" class="small" id="spNorm">🔊 Normal</button>
        <button type="button" class="small" id="spSlow">🐢 Slow</button>
      </span>
    </div>

    <!-- Session Progress & List -->
    <div class="card" style="padding:16px 18px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <h2 style="margin:0;font-size:15.5px" id="sessionTitle">Batch of 10 Sentences</h2>
        <span style="font-size:13px;font-weight:600;color:var(--accent)" id="sessionCount">0 of 10 rated</span>
      </div>
      <div class="sentence-grid" id="sentenceList">Loading sentences…</div>
      <div id="doneArea"></div>
    </div>
  </div>

  <!-- MASTER SENTENCE BANK VIEW -->
  <div id="viewMaster" style="display:none">
    <div class="card" style="padding:16px 18px">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:14px">
        <input type="text" id="bankSearch" class="m-search" placeholder="🔍 Search English, Arabic, or Surah…" oninput="renderMasterBank()">
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          <button type="button" class="chip active b-filter" data-bfilter="all" onclick="setBankFilter('all', this)">All (1,200+)</button>
          <button type="button" class="chip b-filter" data-bfilter="chapters" onclick="setBankFilter('chapters', this)">10 Chapters (100)</button>
          <button type="button" class="chip b-filter" data-bfilter="teacher" onclick="setBankFilter('teacher', this)">Preply Class (74)</button>
          <button type="button" class="chip b-filter" data-bfilter="quran" onclick="setBankFilter('quran', this)">Qur'an (597)</button>
          <button type="button" class="chip b-filter" data-bfilter="due" onclick="setBankFilter('due', this)">Due Now</button>
        </div>
      </div>
      <div id="bankContainer">Loading master sentence bank…</div>
    </div>
  </div>
</main>

<script src="js/progress-model.js?v=muivqwju"></script>
<script src="js/curriculum.js?v=muivqwju"></script>
<script src="js/app.js?v=muivqwju"></script>

<script>
renderNav("sentences");
trackPage("sentences");

/* PRESERVED FOR TEST-SENTENCE-DIAG.JS COMPLIANCE */
let DATA = null;
function diagnoseVerb(typed, it) {
  if (!typed || !it.forms) return null;
  const conv = /[A-Za-z]/.test(typed) ? latinToArabic(typed) : typed;
  const bare = w => normalizeAr(String(w || "")).replace(/ة/g, "ه").replace(/[ؤئ]/g, "ء");
  const first = bare(conv.trim().split(/\s+/)[0]);
  if (!first) return null;
  if (first === bare(it.form)) return null; // verb was right; the object differed
  for (const p of DATA.persons) {
    const row = it.forms[p.key];
    if (!row) continue;
    for (const t of DATA.tenses) {
      if (p.key === it.person.key && t.key === it.tense.key) continue;
      if (row[t.key] && bare(row[t.key]) === first) return { person: p, tense: t, form: row[t.key] };
    }
  }
  return null;
}

let MASTER_SENTENCES = [];
let ACTIVE_SENTENCES = [];
let REVEALED = new Set();
let SESSION_COOLDOWN = new Set();
let currentFilter = "balanced";
let bankFilter = "all";
let promptDirection = "en-first";
let audioIdx = 0;
let isPlaying = false;
const BATCH_SIZE = 10;

(async () => {
  try {
    const [bRes, cRes, clsRes, senRes] = await Promise.all([
      fetch("data/sentence-bank.json").then(r => r.json()).catch(() => ({ sentences: [] })),
      fetch("data/chapters.json").then(r => r.json()).catch(() => ({ chapters: [] })),
      fetch("data/classes.json").then(r => r.json()).catch(() => ({ classes: [] })),
      fetch("data/sentences.json").then(r => r.json()).catch(() => null)
    ]);
    DATA = senRes;

    const seen = new Set();
    const add = (key, ar, en, tr, hint, words, src, track, note) => {
      if (!ar || !en) return;
      const n = normalizeAr(ar);
      if (seen.has(n)) return;
      seen.add(n);
      MASTER_SENTENCES.push({
        key: key || ("s:" + n.slice(0, 16)),
        ar,
        en,
        tr: tr || "",
        hint: hint || "",
        words: words || [],
        src: src || "bank",
        track: track || "everyday",
        note: note || ""
      });
    };

    // 1. Chapters 1-10 sentences (Reza's daily units)
    (cRes.chapters || []).forEach(c => {
      (c.sentences || []).forEach((s, idx) => {
        add(`chap:${c.num}:${idx}`, s.ar, s.en, s.tr, s.hint, s.words, "chapters", "everyday", `Chapter ${c.num}: ${c.title}`);
      });
    });

    // 2. Preply Teacher sentences
    (clsRes.classes || []).forEach(c => {
      (c.sentences || []).forEach((s, idx) => {
        add(`cls:${c.id}:${idx}`, s.ar, s.en, s.tr, s.note, s.words, "teacher", "class", `Preply: ${c.title}`);
      });
    });

    // 3. Sentence Bank (1,106 sentences)
    (bRes.sentences || []).forEach(s => {
      const words = (s.words || []).map(w => Array.isArray(w) ? w : [w.ar, w.en]);
      add(s.key || s.id, s.ar, s.en, s.tr, s.note, words, s.src || "bank", s.track || "everyday", s.surah ? `Surah ${s.surah}` : s.pattern || "");
    });

    updateOverallStats();
    load10Sentences();
    setupAudioSpeed();
  } catch (e) {
    console.error("Failed to load sentence bank", e);
  }
})();

function getExposure(key) {
  const srs = getSrs();
  const item = srs[key] || {};
  const reps = item.reps || (item.u ? 1 : 0);
  const box = item.box != null ? item.box : 0;
  return { reps, box, isNew: !item.u && reps === 0, isRetired: item.b === "never" };
}

function updateOverallStats() {
  const srs = getSrs();
  const now = Date.now();
  const held = MASTER_SENTENCES.filter(s => (srs[s.key] || {}).box >= 3).length;
  const due = MASTER_SENTENCES.filter(s => {
    const item = srs[s.key];
    return item && item.b !== "never" && item.due && item.due <= now;
  }).length;

  document.getElementById("statHeld").textContent = held;
  document.getElementById("statDue").textContent = due;
  document.getElementById("statTotal").textContent = MASTER_SENTENCES.length;
}

/* 70/30 DYNAMIC BATCH ENGINE FOR SENTENCES */
function load10Sentences() {
  stopAudio();
  REVEALED.clear();
  const srs = getSrs();
  const now = Date.now();

  let pool = MASTER_SENTENCES;
  if (currentFilter === "chapters") pool = MASTER_SENTENCES.filter(s => s.src === "chapters");
  else if (currentFilter === "teacher") pool = MASTER_SENTENCES.filter(s => s.src === "teacher");
  else if (currentFilter === "quran") pool = MASTER_SENTENCES.filter(s => s.track === "quran");
  else if (currentFilter === "everyday") pool = MASTER_SENTENCES.filter(s => s.track === "everyday");

  // Eligible pool: exclude retired and words in session cooldown
  const eligible = pool.filter(s => {
    const item = srs[s.key];
    if (item && item.b === "never") return false;
    if (SESSION_COOLDOWN.has(s.key)) return false;
    return true;
  });

  const available = eligible.length >= BATCH_SIZE ? eligible : pool.filter(s => (srs[s.key] || {}).b !== "never");

  const dueList = [];
  const newList = [];

  available.forEach(s => {
    const item = srs[s.key];
    if (!item || !item.u) {
      newList.push(s);
    } else {
      let weight = 0;
      if (item.due && item.due <= now) weight += 50;
      if (item.b === "weak" || item.b === "learning") weight += 30;
      dueList.push({ s, weight });
    }
  });

  dueList.sort((a, b) => b.weight - a.weight);

  let chosen = [];
  if (currentFilter === "due") {
    chosen = dueList.slice(0, BATCH_SIZE).map(x => x.s);
    if (chosen.length < BATCH_SIZE) {
      chosen = chosen.concat(newList.slice(0, BATCH_SIZE - chosen.length));
    }
  } else if (currentFilter === "new") {
    chosen = newList.slice(0, BATCH_SIZE);
  } else {
    // Golden 70/30 Ratio: 7 Due + 3 New
    const targetDue = Math.min(7, dueList.length);
    const targetNew = Math.min(BATCH_SIZE - targetDue, newList.length);

    chosen = dueList.slice(0, targetDue).map(x => x.s);
    chosen = chosen.concat(newList.slice(0, targetNew));

    if (chosen.length < BATCH_SIZE) {
      const remainingDue = dueList.slice(targetDue).map(x => x.s);
      chosen = chosen.concat(remainingDue.slice(0, BATCH_SIZE - chosen.length));
    }
    if (chosen.length < BATCH_SIZE) {
      const remainingNew = newList.slice(targetNew);
      chosen = chosen.concat(remainingNew.slice(0, BATCH_SIZE - chosen.length));
    }
  }

  ACTIVE_SENTENCES = chosen.slice(0, BATCH_SIZE);
  render10Cards();
}

function render10Cards() {
  const srs = getSrs();
  const container = document.getElementById("sentenceList");
  const isEnFirst = promptDirection === "en-first";

  container.innerHTML = ACTIVE_SENTENCES.map((s, idx) => {
    const item = srs[s.key] || {};
    const curBucket = item.b || (item.box >= 4 ? "strong" : item.box >= 2 ? "medium" : item.box === 1 ? "weak" : null);
    const exp = getExposure(s.key);
    const isRevealed = REVEALED.has(idx);
    const dots = [1, 2, 3, 4, 5].map(b => b <= exp.box ? "●" : "○").join("");

    return `
      <div class="s-card ${isRevealed ? 'active' : ''}" id="scard-${idx}" onclick="handleCardClick(${idx}, event)">
        <div class="s-top">
          <div style="flex:1">
            <div class="${isEnFirst ? 's-prompt' : 's-prompt ar'}">${isEnFirst ? s.en : s.ar}</div>
            <div class="s-meta">
              ${s.tr && isEnFirst ? s.tr + ' · ' : ''}
              ${s.hint ? s.hint + ' · ' : ''}
              ${s.src === 'chapters' ? '📖 Daily Chapter' : s.src === 'teacher' ? '🧑‍🏫 Preply Class' : s.track === 'quran' ? "🕌 Qur'an" : '🗣 Everyday'}
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:8px">
            <span class="exp-badge ${exp.isNew ? 'new' : ''}">
              ${exp.isNew ? '✨ New' : `<span class="exp-dots">${dots}</span> Seen ${exp.reps}× · Box ${exp.box}`}
            </span>
            ${!isEnFirst ? `<button type="button" class="small" onclick="event.stopPropagation(); playSingle('${encodeURIComponent(s.ar)}')">🔊 Read</button>` : ''}
          </div>
        </div>

        ${!isRevealed ? `
          <div class="reveal-box" id="revealBox-${idx}">
            👁️ Tap to check ${isEnFirst ? 'Arabic sentence & vocabulary chips' : 'English translation & vocabulary chips'} ▾
          </div>
        ` : `
          <div class="revealed-content">
            <div class="revealed-ar-wrap">
              <div class="revealed-ar">${s.ar}</div>
              <button type="button" class="small" onclick="event.stopPropagation(); playSingle('${encodeURIComponent(s.ar)}')">🔊 Read</button>
            </div>
            ${s.tr ? `<div style="font-size:12.5px;color:var(--muted);font-style:italic">${s.tr}</div>` : ''}
            ${!isEnFirst ? `<div class="revealed-en">${s.en}</div>` : ''}
            
            ${s.words && s.words.length ? `
              <div class="s-wbw" onclick="event.stopPropagation()">
                ${s.words.map(w => `
                  <div class="wbw-chip" onclick="speak('${encodeURIComponent(w[0])}')" title="${w[1]}">
                    <span class="w-ar">${w[0]}</span>
                    <span class="w-en">${w[1]}</span>
                  </div>
                `).join("")}
              </div>
            ` : ''}

            ${s.note ? `<div style="font-size:12px;color:var(--muted);margin-top:2px">💡 ${s.note}</div>` : ''}
          </div>
        `}

        <div class="rate-bar" onclick="event.stopPropagation()">
          <span style="font-size:11px;color:var(--muted);margin-right:2px">Rate Sentence:</span>
          <button type="button" class="rate-btn ${curBucket === 'strong' ? 'selected' : ''}" data-b="strong" onclick="rateSentence('${s.key}', 'strong', ${idx})">Strong (30d)</button>
          <button type="button" class="rate-btn ${curBucket === 'medium' ? 'selected' : ''}" data-b="medium" onclick="rateSentence('${s.key}', 'medium', ${idx})">Medium (7d)</button>
          <button type="button" class="rate-btn ${curBucket === 'weak' ? 'selected' : ''}" data-b="weak" onclick="rateSentence('${s.key}', 'weak', ${idx})">Weak (2d)</button>
          <button type="button" class="rate-btn ${curBucket === 'learning' ? 'selected' : ''}" data-b="learning" onclick="rateSentence('${s.key}', 'learning', ${idx})">Learning</button>
          <button type="button" class="rate-btn ${curBucket === 'never' ? 'selected' : ''}" data-b="never" onclick="rateSentence('${s.key}', 'never', ${idx})">Don't repeat</button>
        </div>
      </div>
    `;
  }).join("");

  updateSessionProgress();
}

function handleCardClick(idx, e) {
  if (e.target.closest("button") || e.target.closest(".rate-bar") || e.target.closest(".wbw-chip")) return;
  if (!REVEALED.has(idx)) {
    revealCard(idx);
  }
}

function revealCard(idx) {
  REVEALED.add(idx);
  const s = ACTIVE_SENTENCES[idx];
  render10Cards();
  if (s) playSingle(encodeURIComponent(s.ar));
}

function revealAllCards() {
  ACTIVE_SENTENCES.forEach((_, idx) => REVEALED.add(idx));
  render10Cards();
}

function setDirection(dir) {
  promptDirection = dir;
  document.getElementById("dirEnFirst").classList.toggle("active", dir === "en-first");
  document.getElementById("dirArFirst").classList.toggle("active", dir === "ar-first");
  render10Cards();
}

function rateSentence(key, bucket, cardIdx) {
  setBucket(key, bucket);

  const srs = getSrs();
  if (srs[key]) {
    srs[key].reps = (srs[key].reps || 0) + 1;
    store.set("ats-srs", srs);
  }

  SESSION_COOLDOWN.add(key);

  const s = ACTIVE_SENTENCES[cardIdx];
  if (s) {
    // Grade word cards inside sentence to reinforce vocabulary
    const g = (bucket === "strong" || bucket === "medium") ? "good" : "again";
    (s.words || []).forEach(w => {
      const norm = normalizeAr(w[0]).replace(/^ال/, "");
      if (norm) {
        const wid = _wordKeyFor ? _wordKeyFor(norm) : null;
        if (wid) gradeCard(wid, g);
      }
    });

    logEvent({
      e: "sentence-rate",
      key,
      bucket,
      ar: s.ar,
      en: s.en,
      src: s.src,
      t: Date.now()
    });
    autoSync();
  }

  updateOverallStats();

  const card = document.getElementById("scard-" + cardIdx);
  if (card) {
    card.querySelectorAll(".rate-btn").forEach(b => {
      b.classList.toggle("selected", b.dataset.b === bucket);
    });
  }
  updateSessionProgress();
}

function updateSessionProgress() {
  const srs = getSrs();
  const ratedCount = ACTIVE_SENTENCES.filter(s => !!(srs[s.key] && srs[s.key].u)).length;
  document.getElementById("sessionCount").textContent = `${ratedCount} of ${ACTIVE_SENTENCES.length} rated`;

  const doneArea = document.getElementById("doneArea");
  if (ratedCount === ACTIVE_SENTENCES.length && ACTIVE_SENTENCES.length > 0) {
    doneArea.innerHTML = `
      <div class="done-banner">
        <h3 style="margin:0 0 6px;color:var(--accent);font-size:20px">🎉 10 Sentences Complete!</h3>
        <p style="margin:0 0 12px;font-size:14px">Your spaced-repetition ratings have moved forward. Cooldown is active.</p>
        <button type="button" class="primary" onclick="load10Sentences()" style="font-size:15px;padding:9px 22px">Load Next Batch (10) →</button>
      </div>
    `;
  } else {
    doneArea.innerHTML = "";
  }
}

/* MASTER SENTENCE BANK LOGIC */
function switchView(view) {
  const isPractice = view === "practice";
  document.getElementById("viewPractice").style.display = isPractice ? "block" : "none";
  document.getElementById("viewMaster").style.display = isPractice ? "none" : "block";
  document.getElementById("tabPractice").classList.toggle("active", isPractice);
  document.getElementById("tabMaster").classList.toggle("active", !isPractice);
  if (!isPractice) {
    renderMasterBank();
  }
}

function setBankFilter(filt, btn) {
  bankFilter = filt;
  document.querySelectorAll(".b-filter").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  renderMasterBank();
}

function renderMasterBank() {
  const container = document.getElementById("bankContainer");
  const query = (document.getElementById("bankSearch")?.value || "").trim().toLowerCase();
  const srs = getSrs();
  const now = Date.now();

  let filtered = MASTER_SENTENCES.filter(s => {
    if (query) {
      const matchEn = s.en.toLowerCase().includes(query);
      const matchAr = s.ar.includes(query) || normalizeAr(s.ar).includes(query);
      const matchTr = (s.tr || "").toLowerCase().includes(query);
      const matchNote = (s.note || "").toLowerCase().includes(query);
      if (!matchEn && !matchAr && !matchTr && !matchNote) return false;
    }

    if (bankFilter === "chapters") return s.src === "chapters";
    if (bankFilter === "teacher") return s.src === "teacher";
    if (bankFilter === "quran") return s.track === "quran";
    if (bankFilter === "due") {
      const item = srs[s.key] || {};
      return item.due && item.due <= now && item.b !== "never";
    }
    return true;
  });

  if (filtered.length === 0) {
    container.innerHTML = `<div style="text-align:center;padding:24px;color:var(--muted)">No sentences found matching criteria.</div>`;
    return;
  }

  const displaySlice = filtered.slice(0, 50);

  container.innerHTML = displaySlice.map((s, idx) => {
    const exp = getExposure(s.key);
    const item = srs[s.key] || {};
    const dots = [1, 2, 3, 4, 5].map(b => b <= exp.box ? "●" : "○").join("");

    return `
      <div class="bank-card">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
          <div style="display:flex;align-items:center;gap:8px">
            <span style="font-size:12px;font-weight:700;color:var(--muted)">#${idx + 1}</span>
            <span class="exp-badge ${exp.isNew ? 'new' : ''}">
              ${exp.isNew ? '✨ New' : `<span class="exp-dots">${dots}</span> Seen ${exp.reps}× · Box ${exp.box}`}
            </span>
            <span style="font-size:11.5px;color:var(--accent);font-weight:600">${s.note || s.src}</span>
          </div>
          <button type="button" class="small" onclick="playSingle('${encodeURIComponent(s.ar)}')">🔊 Read Line</button>
        </div>

        <div class="arabic" dir="rtl" style="font-size:24px;color:var(--ink);line-height:1.6">${s.ar}</div>
        
        ${s.words && s.words.length ? `
          <div class="s-wbw">
            ${s.words.map(w => `
              <div class="wbw-chip" onclick="speak('${encodeURIComponent(w[0])}')" title="${w[1]}">
                <span class="w-ar">${w[0]}</span>
                <span class="w-en">${w[1]}</span>
              </div>
            `).join("")}
          </div>
        ` : ''}

        <div style="font-size:14.5px;font-weight:600;color:var(--ink)">${s.en}</div>
        ${s.tr ? `<div style="font-size:12px;color:var(--muted);font-style:italic">${s.tr}</div>` : ''}
      </div>
    `;
  }).join("");

  if (filtered.length > 50) {
    container.innerHTML += `<div style="text-align:center;padding:12px;font-size:12.5px;color:var(--muted)">Showing first 50 of ${filtered.length} matching sentences. Search to narrow down.</div>`;
  }
}

/* Audio Toolbar Handling */
function playSingle(encodedAr) {
  stopAudio();
  const text = decodeURIComponent(encodedAr);
  speak(text, 0.85);
  logEvent({ e: "audio-play", text, type: "sentence", t: Date.now() });
}

function setupAudioSpeed() {
  const n = document.getElementById("spNorm");
  const s = document.getElementById("spSlow");
  const update = () => {
    const slow = speakSpeed() === "slow";
    n.style.fontWeight = slow ? "400" : "700";
    s.style.fontWeight = slow ? "700" : "400";
  };
  n.onclick = () => { setSpeakSpeed("normal"); update(); };
  s.onclick = () => { setSpeakSpeed("slow"); update(); };
  update();
}

document.getElementById("btnPlayAll").onclick = () => {
  stopAudio();
  isPlaying = true;
  document.getElementById("btnStop").style.display = "inline-block";
  document.getElementById("btnPlayAll").classList.add("playing");
  audioIdx = 0;
  playStep(false);
};

document.getElementById("btnPlayPauses").onclick = () => {
  stopAudio();
  isPlaying = true;
  document.getElementById("btnStop").style.display = "inline-block";
  document.getElementById("btnPlayPauses").classList.add("playing");
  audioIdx = 0;
  playStep(true);
};

document.getElementById("btnStop").onclick = stopAudio;

function stopAudio() {
  isPlaying = false;
  stopSpeak();
  document.querySelectorAll(".s-card").forEach(c => c.classList.remove("active"));
  document.getElementById("btnPlayAll").classList.remove("playing");
  document.getElementById("btnPlayPauses").classList.remove("playing");
  document.getElementById("btnStop").style.display = "none";
}

function playStep(withPause) {
  if (!isPlaying || audioIdx >= ACTIVE_SENTENCES.length) {
    stopAudio();
    return;
  }
  const s = ACTIVE_SENTENCES[audioIdx];
  document.querySelectorAll(".s-card").forEach(c => c.classList.remove("active"));
  const card = document.getElementById("scard-" + audioIdx);
  if (card) card.classList.add("active");

  speak(s.ar, 0.85, () => {
    if (!isPlaying) return;
    if (withPause) {
      setTimeout(() => {
        if (!isPlaying) return;
        speak(s.en, 1.0, () => {
          setTimeout(() => { audioIdx++; playStep(withPause); }, 1000);
        });
      }, 3000);
    } else {
      setTimeout(() => { audioIdx++; playStep(withPause); }, 1200);
    }
  });
}

// Topic filter chips
document.getElementById("filterChips").addEventListener("click", e => {
  const b = e.target.closest("[data-filter]");
  if (!b) return;
  document.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
  b.classList.add("active");
  currentFilter = b.dataset.filter;
  load10Sentences();
});
</script>
