<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0d7a5f">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>Learn — Arabic</title>
  <link rel="stylesheet" href="css/fonts.css?v=mteu26rd">
  <link rel="stylesheet" href="css/style.css?v=mteu26rd">
  <style>
    .crumb { font-size: 13px; color: var(--muted); margin-bottom: 4px; }
    .q-ar { font-size: 30px; line-height: 1.8; text-align: center; margin: 16px 0 10px; }
    .q-en { font-size: 19px; text-align: center; margin: 14px 0; }
    .q-tr { text-align: center; color: var(--muted); font-size: 14px; }
    .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 16px; }
    .prog { height: 6px; background: var(--border); border-radius: 99px; overflow: hidden; margin: 10px 0 0; }
    .prog > i { display: block; height: 100%; background: var(--accent); }
    .tbl { width: 100%; border-collapse: collapse; font-size: 15px; }
    .tbl td { padding: 9px 8px; border-bottom: 1px solid var(--border); }
    .tbl .ar { font-size: 22px; text-align: right; width: 42%; }
    .veil { color: transparent; background: var(--border); border-radius: 6px; cursor: pointer; }
    .veil.on { color: inherit; background: none; }
    .big { font-size: 46px; font-weight: 700; color: var(--accent); line-height: 1; }
    .pill { display:inline-block; font-size:12px; padding:2px 9px; border-radius:99px; background:var(--accent-soft); color:var(--accent); font-weight:600; }
    .lrow { display:flex; justify-content:space-between; gap:10px; padding:8px 0; border-bottom:1px solid var(--border); font-size:14.5px; }
  </style>
</head>
<body>
<main>
  <div id="app"><p>Loading…</p></div>
</main>

<script src="js/progress-model.js?v=mteu26rd"></script>
<script src="js/curriculum.js?v=mteu26rd"></script>
<script src="js/app.js?v=mteu26rd"></script>
<script src="js/tracker.js?v=mteu26rd"></script>
<script src="js/plan.js?v=mteu26rd"></script>
<script>
renderNav("learn");
trackPage("learn");

const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const app = document.getElementById("app");
const P = new URLSearchParams(location.search);

(async () => {
  const ctx = await curCtx();
  if (!ctx) { app.innerHTML = "<p>Couldn't load the curriculum.</p>"; return; }
  const state = Curriculum.milestoneState(ctx);
  if (!state.current) { app.innerHTML = "<h1>Everything achieved</h1><p>Nothing left on the ladder — ask your coach for more.</p>"; return; }

  const msId = P.get("m") || state.current.id;
  const ms = state.milestones.find(m => m.id === msId) || state.current;

  if (P.get("test")) return runTest(ms, ctx, state);

  // a specific chunk, or whatever Continue decided
  const want = P.get("chunk");
  const src = ctx.curriculum.milestones.find(m => m.id === ms.id);
  let target = null;
  if (want) {
    for (const l of src.lessons) {
      const c = Curriculum.lessonChunks(l).find(x => x.id === want);
      if (c) { target = { milestone: ms, lesson: ms.lessons.find(x => x.id === l.id), chunk: c }; break; }
    }
  }
  if (!target) target = Curriculum.nextChunk(ctx, state);
  if (!target) { location.href = "index.html"; return; }
  if (target.testNext || !target.chunk) return runTest(ms, ctx, state, target.skipToTest ? [target.lesson.id] : null);
  runChunk(target, ctx);
})();

/* ============================ A CHUNK ============================
   ~5 minutes, one pass over up to 8 items, with due reviews folded in at the
   front so review is never a separate chore. */
async function runChunk(t, ctx) {
  const { milestone: ms, lesson, chunk } = t;
  const reviewKeys = Curriculum.reviewsFor(chunk, ctx);
  const allKeys = reviewKeys.concat(chunk.keys);
  const resolved = await resolveCards(allKeys);
  const items = resolved.map((r, i) => ({ key: r.key, v: r.v, review: i < reviewKeys.length })).filter(x => x.v && x.v.ar);
  if (!items.length) { app.innerHTML = "<p>Nothing to study here.</p>"; return; }

  primeSpeak();
  const head = () => `
    <div class="crumb">${esc(ms.name)} · ${esc(lesson.title)}</div>
    <h1 style="margin-top:0">${esc(chunk.label)}</h1>
    <p class="sub">${esc(chunk.sub)}${reviewKeys.length ? ` <span class="pill">+${reviewKeys.length} due for review</span>` : ""}</p>`;

  if (chunk.mode === "meet") return meetMode();
  return stepMode();

  /* MEET — a table, recall before you reveal, then mark only the misses.
     (his standing preference: tables over flashcards, minimal clicking) */
  function meetMode() {
    app.innerHTML = head() + `
      <div class="card">
        <table class="tbl"><tbody>${items.map((it, i) => `
          <tr>
            <td class="ar arabic">${esc(it.v.ar)} <button class="small spk" data-i="${i}">🔊</button></td>
            <td><span class="veil en" data-i="${i}">${esc(it.v.en)}</span>
                ${it.v.tr ? `<div style="font-size:12.5px;color:var(--muted)">${esc(it.v.tr)}</div>` : ""}</td>
            <td style="width:80px;text-align:right"><button class="small miss" data-i="${i}">✗ missed</button></td>
          </tr>`).join("")}</tbody></table>
        <div class="row" style="justify-content:flex-start">
          <button id="revealAll">Reveal all</button>
          <button class="primary" id="done">Done — that's the chunk</button>
        </div>
      </div>`;
    const missed = new Set();
    app.querySelectorAll(".spk").forEach(b => b.onclick = () => speak(items[+b.dataset.i].v.ar, 0.8));
    app.querySelectorAll(".en").forEach(el => el.onclick = () => el.classList.add("on"));
    app.querySelectorAll(".miss").forEach(b => b.onclick = () => {
      const i = +b.dataset.i;
      if (missed.has(i)) { missed.delete(i); b.classList.remove("on"); }
      else { missed.add(i); b.classList.add("on"); }
      app.querySelector(`.en[data-i="${i}"]`).classList.add("on");
    });
    document.getElementById("revealAll").onclick = () => app.querySelectorAll(".en").forEach(e => e.classList.add("on"));
    document.getElementById("done").onclick = () => {
      items.forEach((it, i) => gradeCard(it.key, missed.has(i) ? "again" : "good"));
      finish(items.length - missed.size, items.length);
    };
  }

  /* DRILL / SAY / EAR — one item at a time. */
  function stepMode() {
    let i = 0, right = 0;
    const step = () => {
      if (i >= items.length) return finish(right, items.length);
      const it = items[i];
      const n = `<div class="crumb">${i + 1} of ${items.length}${it.review ? " · review" : ""}</div>`;

      if (chunk.mode === "ear") {
        app.innerHTML = head() + `<div class="card">${n}
          <p style="text-align:center;font-size:15px">Listen. What does it mean?</p>
          <div class="row"><button class="primary" id="play" style="font-size:17px">🔊 play</button></div>
          <div class="row"><button id="rev">show the answer</button></div></div>`;
        document.getElementById("play").onclick = () => speak(it.v.ar, 0.85);
        speak(it.v.ar, 0.85);
        document.getElementById("rev").onclick = reveal;

      } else if (chunk.mode === "say") {
        app.innerHTML = head() + `<div class="card">${n}
          <div class="q-en">${esc(it.v.en)}</div>
          <div class="q-ar arabic">${esc(it.v.ar)}</div>
          ${it.v.tr ? `<p class="q-tr">${esc(it.v.tr)}</p>` : ""}
          <p style="text-align:center;font-size:14.5px;color:var(--muted)">Listen, then say it out loud.</p>
          <div class="row"><button class="primary" id="play" style="font-size:17px">🔊 hear it</button></div>
          <div class="row">
            <button id="no" style="min-width:130px">✗ stumbled</button>
            <button class="primary" id="yes" style="min-width:130px">✓ said it</button>
          </div></div>`;
        document.getElementById("play").onclick = () => speak(it.v.ar, 0.8);
        speak(it.v.ar, 0.8);
        document.getElementById("yes").onclick = () => score(true);
        document.getElementById("no").onclick = () => score(false);

      } else { // drill
        app.innerHTML = head() + `<div class="card">${n}
          <div class="q-en">${esc(it.v.en)}</div>
          <p style="text-align:center;font-size:13.5px;color:var(--muted)">Write it in Arabic — typing in English letters works too</p>
          <input id="ans" dir="rtl" style="width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:10px;font-size:22px;text-align:center">
          <div class="row"><button class="primary" id="chk">Check</button><button id="skip">show me</button></div></div>`;
        const inp = document.getElementById("ans");
        inp.focus();
        inp.onkeydown = e => { if (e.key === "Enter") document.getElementById("chk").click(); };
        document.getElementById("chk").onclick = () => {
          const m = writeMatchAr(inp.value, it.v.ar);
          const got = m.ok || arMatch(inp.value, it.v.ar);
          feedback(got);
        };
        document.getElementById("skip").onclick = () => feedback(false);
      }

      function reveal() {
        app.innerHTML = head() + `<div class="card">${n}
          <div class="q-ar arabic">${esc(it.v.ar)}</div>
          <div class="q-en">${esc(it.v.en)}</div>
          ${it.v.tr ? `<p class="q-tr">${esc(it.v.tr)}</p>` : ""}
          <p style="text-align:center;font-size:14px;color:var(--muted)">Did you have it?</p>
          <div class="row">
            <button id="no" style="min-width:130px">✗ no</button>
            <button class="primary" id="yes" style="min-width:130px">✓ yes</button>
          </div></div>`;
        document.getElementById("yes").onclick = () => score(true);
        document.getElementById("no").onclick = () => score(false);
      }
      function feedback(got) {
        app.innerHTML = head() + `<div class="card">${n}
          <p style="text-align:center;font-size:16px">${got ? "✓ right" : "✗ not quite"}</p>
          <div class="q-ar arabic">${esc(it.v.ar)}</div>
          ${it.v.tr ? `<p class="q-tr">${esc(it.v.tr)}</p>` : ""}
          <div class="row"><button class="primary" id="next">Next</button></div></div>`;
        document.getElementById("next").onclick = () => score(got, true);
      }
      function score(got, already) {
        if (!already) { /* fallthrough */ }
        gradeCard(it.key, got ? "good" : "again");
        if (chunk.mode === "ear") logEvent({ e: "alisten-grade", key: it.key, ok: !!got, src: "chunk" });
        if (chunk.mode === "say") logEvent({ e: "speak", key: it.key, ok: !!got, src: "chunk" });
        if (got) right++;
        i++;
        step();
      }
    };
    step();
  }

  function finish(right, total) {
    logEvent({ e: "chunk-done", chunk: chunk.id, lesson: lesson.id, milestone: ms.id, mode: chunk.mode, right, total });
    try { if (typeof syncSoon === "function") syncSoon(); } catch (e) {}
    curCtx().then(fresh => {
      const st = Curriculum.milestoneState(fresh);
      const nx = Curriculum.nextChunk(fresh, st);
      const l = st.milestones.find(m => m.id === ms.id).lessons.find(x => x.id === lesson.id);
      const allWalked = Curriculum.lessonChunks(fresh.curriculum.milestones.find(m => m.id === ms.id).lessons.find(x => x.id === lesson.id))
        .every(c => Curriculum.chunkDone(c.id, fresh.log));
      app.innerHTML = `
        <h1>Chunk done</h1>
        <div class="card">
          <p style="font-size:16px;margin-top:0">${right} of ${total} without help.</p>
          <p style="font-size:14.5px;color:var(--muted)">${esc(ms.name)} · ${esc(lesson.title)} — ${l.solid} of ${l.total} words holding.</p>
          ${allWalked ? `<p style="font-size:15px"><strong>You've walked every part of this lesson.</strong> The test is what marks it mastered.</p>` : ""}
          <div class="row" style="justify-content:flex-start">
            ${allWalked
              ? `<a href="learn.html?test=1&m=${encodeURIComponent(ms.id)}"><button class="primary">Take the test</button></a>`
              : `<a href="learn.html"><button class="primary">Next chunk</button></a>`}
            <a href="index.html"><button>Stop here</button></a>
          </div>
        </div>`;
    });
  }
}

/* ============================ THE TEST ============================
   Sectioned by lesson: a section at 80+ marks that lesson mastered. Always open,
   unlimited retakes, reshuffled each time. Lessons already proved are skipped
   entirely unless their re-verification has come due. */
async function runTest(ms, ctx, state, onlyLessons) {
  const attempts = (ctx.log || []).filter(e => e && e.e === "exam-done" && e.milestone === ms.id).length;
  const ex = Curriculum.milestoneExam(ms, ctx, { attempt: attempts + 1, lessonIds: onlyLessons });
  if (!ex.items.length) {
    app.innerHTML = `<h1>Nothing left to prove here</h1><p>Every lesson in “${esc(ms.name)}” is already proved and still fresh.</p>
      <div class="row" style="justify-content:flex-start"><a href="index.html"><button class="primary">Back</button></a></div>`;
    return;
  }
  const resolved = await resolveCards(ex.items.map(i => i.key));
  const qs = ex.items.map((it, i) => Object.assign({}, it, { v: resolved[i] && resolved[i].v })).filter(q => q.v && q.v.ar);

  primeSpeak();
  logEvent({ e: "exam-start", milestone: ms.id, total: qs.length, attempt: attempts + 1 });
  const answers = [];
  let i = 0;

  const head = `<div class="crumb">${esc(ms.name)}</div><h1 style="margin-top:0">The test</h1>
    <p class="sub">Pass mark ${Curriculum.PASS}. Each lesson is scored on its own — clear a lesson and it's done.</p>`;

  ask();
  function ask() {
    if (i >= qs.length) return done();
    const q = qs[i];
    const n = `<div class="crumb">${i + 1} of ${qs.length} · ${esc(q.lessonTitle)}${q.form === "ear" ? " · by ear" : ""}</div>
      <div class="prog"><i style="width:${Math.round(100 * i / qs.length)}%"></i></div>`;
    if (q.form === "ear") {
      app.innerHTML = head + `<div class="card">${n}
        <p style="text-align:center;font-size:15px;margin-top:14px">Listen. What does it mean?</p>
        <div class="row"><button class="primary" id="play" style="font-size:17px">🔊 play</button></div>
        <div class="row"><button id="rev">show the answer</button></div></div>`;
      document.getElementById("play").onclick = () => speak(q.v.ar, 0.85);
      speak(q.v.ar, 0.85);
      document.getElementById("rev").onclick = reveal;
    } else if (q.form === "mean") {
      app.innerHTML = head + `<div class="card">${n}
        <div class="q-ar arabic">${esc(q.v.ar)}</div>
        <p style="text-align:center;font-size:15px;color:var(--muted)">What does it mean?</p>
        <div class="row"><button id="rev">show the answer</button></div></div>`;
      document.getElementById("rev").onclick = reveal;
    } else {
      app.innerHTML = head + `<div class="card">${n}
        <div class="q-en">${esc(q.v.en)}</div>
        <input id="ans" dir="rtl" style="width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:10px;font-size:22px;text-align:center">
        <div class="row"><button class="primary" id="chk">Check</button><button id="skip">skip</button></div></div>`;
      const inp = document.getElementById("ans"); inp.focus();
      inp.onkeydown = e => { if (e.key === "Enter") document.getElementById("chk").click(); };
      document.getElementById("chk").onclick = () => {
        const m = writeMatchAr(inp.value, q.v.ar);
        score(m.ok || arMatch(inp.value, q.v.ar), true);
      };
      document.getElementById("skip").onclick = () => score(false, true);
    }
    function reveal() {
      app.innerHTML = head + `<div class="card">${n}
        <div class="q-ar arabic">${esc(q.v.ar)}</div>
        <div class="q-en">${esc(q.v.en)}</div>
        ${q.v.tr ? `<p class="q-tr">${esc(q.v.tr)}</p>` : ""}
        <p style="text-align:center;font-size:14px;color:var(--muted)">Did you have it?</p>
        <div class="row">
          <button id="no" style="min-width:130px">✗ no</button>
          <button class="primary" id="yes" style="min-width:130px">✓ yes</button>
        </div></div>`;
      document.getElementById("yes").onclick = () => score(true);
      document.getElementById("no").onclick = () => score(false);
    }
    function score(ok, showAnswer) {
      answers.push({ key: q.key, lessonId: q.lessonId, lessonTitle: q.lessonTitle, form: q.form, ok: !!ok });
      gradeCard(q.key, ok ? "good" : "again");           // the test is also revision
      if (q.form === "ear") logEvent({ e: "alisten-grade", key: q.key, ok: !!ok, src: "test" });
      i++;
      if (showAnswer && !ok) {
        app.innerHTML = head + `<div class="card">${n}
          <p style="text-align:center;font-size:16px">✗ not quite</p>
          <div class="q-ar arabic">${esc(q.v.ar)}</div>
          <div class="q-en">${esc(q.v.en)}</div>
          <div class="row"><button class="primary" id="next">Next</button></div></div>`;
        document.getElementById("next").onclick = ask;
      } else ask();
    }
  }

  function done() {
    const r = Curriculum.milestoneScoreOf(answers);
    logEvent({ e: "exam-done", milestone: ms.id, attempt: attempts + 1, score: r.score,
               correct: r.correct, total: r.total, lessons: r.lessons, sections: r.sections });
    try { if (typeof syncSoon === "function") syncSoon(); } catch (e) {}

    curCtx().then(fresh => {
      const st = Curriculum.milestoneState(fresh);
      const m2 = st.milestones.find(x => x.id === ms.id);
      const cleared = r.cleared.map(id => r.lessonTitles[id]);
      const open = Object.keys(r.lessons).filter(id => r.lessons[id] < Curriculum.PASS);
      const band = Curriculum.examBand(r.score);
      app.innerHTML = `
        <h1 style="margin-bottom:4px">${esc(ms.name)}</h1>
        <div class="card" style="border-color:var(--accent)">
          <div style="text-align:center">
            <div class="big">${r.score}</div>
            <div style="font-size:15px;font-weight:600;text-transform:capitalize">${esc(band.band)}</div>
            ${r.sections.ear !== null ? `<div style="font-size:13px;color:var(--muted)">by ear: ${r.sections.ear}%</div>` : ""}
          </div>
          <div style="margin-top:16px">
            ${Object.keys(r.lessons).map(id => `
              <div class="lrow">
                <span>${r.lessons[id] >= Curriculum.PASS ? "✓ " : ""}${esc(r.lessonTitles[id])}</span>
                <strong style="color:${r.lessons[id] >= Curriculum.PASS ? "var(--accent)" : "var(--muted)"}">${r.lessons[id]}</strong>
              </div>`).join("")}
          </div>
          <p style="font-size:14.5px;margin-top:14px">
            ${cleared.length ? `<strong>Mastered:</strong> ${esc(cleared.join(", "))}. ` : ""}
            ${open.length ? `Still open: ${esc(open.map(id => r.lessonTitles[id]).join(", "))} — those come back, the rest won't.`
                          : `<strong>Milestone complete — you can ${esc(ms.can)}.</strong>`}
          </p>
          <div class="row" style="justify-content:flex-start">
            ${open.length ? `<a href="learn.html"><button class="primary">Work on what's left</button></a>` : `<a href="learn.html"><button class="primary">Start the next milestone</button></a>`}
            <a href="learn.html?test=1&m=${encodeURIComponent(ms.id)}"><button>Take it again</button></a>
            <a href="index.html"><button>Home</button></a>
          </div>
        </div>`;
    });
  }
}
</script>
</body>
</html>
