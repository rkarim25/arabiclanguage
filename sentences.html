    .sp-model { direction: rtl; text-align: right; font-family: var(--font-ar); font-size: 32px; line-height: 1.9; color: var(--accent); margin: 6px 0; }
    .sp-model .verb { background: #fdf3d0; border-radius: 6px; padding: 0 4px; }
    .sp-gloss { font-size: 13.5px; color: var(--muted); text-align: right; direction: rtl; }
    @media (prefers-color-scheme: dark) {

      border-radius: 0 8px 8px 0; padding: 8px 10px; }

    }

             font-size: 13px; padding: 2px 8px; cursor: pointer; line-height: 1.5; }

                 flex: 1; direction: rtl; }

    .lrow .len { font-size: 13px; color: var(--muted); }

<body>
<main>
  <div id="content">Loading…</div>
  <div id="kbDock"></div>
</main>

<script src="js/progress-model.js?v=mtgahnsh"></script>
<script src="js/curriculum.js?v=mtgahnsh"></script>
<script src="js/app.js?v=mtgahnsh"></script>

<script src="js/plan.js?v=mtgahnsh"></script>
<script>
renderNav("sentences");
trackPage("sentences");

const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const content = document.getElementById("content");
const SESSION = 8;
let DATA = null, TENSE_FILTER = "all";

let BANK = { sentences: [] }, MODE = new URLSearchParams(location.search).get("view") === "list" ? "list" : "practise";
/* friendly names for the sources the bank draws on, for the list's groupings */
let LIST_CTX = null;    // the curriculum, for the "this week" box; the list works without it
const SRC_NAMES = { prompts: "Things to say", sentences: "Verb frames you can bend", grammar: "Grammar in a sentence", phrases: "The phrase deck", quran: "Qur'an" };
Promise.all([
  fetch("data/sentences.json").then(r => r.json()),
  fetch("data/sentence-bank.json").then(r => r.json()).catch(() => ({ sentences: [] })),
]).then(async ([d, b]) => {
  DATA = d; BANK = b;
  // the week box needs the curriculum; the list works without it
  try { LIST_CTX = await curCtx(); } catch (e) {}
  start();
});

/* Build every verb × person × tense item, then take a frequency-weighted session.
   Verbs are pre-ordered most-frequent first, so a light weighting toward the top
   of the list keeps practice on the words Reza actually meets most. */
function buildPool() {
  const items = [];
  DATA.verbs.forEach((v, vi) => {
    DATA.persons.forEach(p => {
      DATA.tenses.forEach(t => {
        if (TENSE_FILTER !== "all" && t.key !== TENSE_FILTER) return;
        const form = v.forms[p.key][t.key];
        const enVerb = t.key === "past" ? v.past : v.base;
        const en = t.key === "fut"
          ? `${p.en} will ${v.base} ${v.obj.en}`
          : `${p.en} ${enVerb} ${v.obj.en}`;
        items.push({
          en, form, ar: `${form} ${v.obj.ar}`,
          objAr: v.obj.ar, root: v.root, weight: DATA.verbs.length - vi,
          person: p, tense: t, verb: v.base, forms: v.forms,
        });
      });
    });
  });
  return items;
}
/* When the sentence is wrong it is almost always the VERB, and almost always
   the right verb in the WRONG CELL — he writes يَقُولُونَ (they, present) for
   "we said". The grid is only ana/nahnu/hum x past/pres/fut, so we can name the
   cell he actually produced instead of silently showing the model answer.
   Returns {person, tense} of the matched cell, or null if it is not a form of
   this verb at all. */
function diagnoseVerb(typed, it) {
  if (!typed || !it.forms) return null;
  const conv = /[A-Za-z]/.test(typed) ? latinToArabic(typed) : typed;
  const bare = w => normalizeAr(String(w || "")).replace(/ة/g, "ه").replace(/[ؤئ]/g, "ء");
  const first = bare(conv.trim().split(/\s+/)[0]);
  if (!first) return null;
  if (first === bare(it.form)) return null; // verb was right; the object differed
  for (const p of DATA.persons) {
    const row = it.forms[p.key];
    if (!row) continue;
    for (const t of DATA.tenses) {
      if (p.key === it.person.key && t.key === it.tense.key) continue;
      if (row[t.key] && bare(row[t.key]) === first) return { person: p, tense: t, form: row[t.key] };
    }
  }
  return null;
}

function pickSession() {
  const pool = buildPool();
  // weighted shuffle: sort by weight*random so frequent verbs surface more, with variety
  return pool.map(it => ({ it, k: Math.random() * it.weight }))
             .sort((a, b) => b.k - a.k).slice(0, SESSION).map(x => x.it);
}

let queue = [], done = 0, got = 0, exactCount = 0;

/* ---------- Sentence Practice feeds the SRS too ----------
   His rule, 2026-08-30: "For the entire website i hope words, sentences or
   anything else has the spaced repitition engine built in."

   It didn't here. This page logged a `spract` event and stopped — so twenty
   minutes of conjugation drill moved nothing: the sentence never came back, the
   words in it were never scheduled, and none of it counted toward anything. It
   was the one practice surface in the site writing to the record but not to the
   scheduler.

   The verb frames are in the sentence bank already, so the answer is a lookup:
   the drilled Arabic is either a frame's base sentence or one of its verified
   variants, and either way it resolves to that frame's card and to the word
   cards underneath it — exactly what a lesson would grade. */
let _drillIdx = null;
function drillIndex() {
  if (_drillIdx) return _drillIdx;
  _drillIdx = new Map();
  (BANK.sentences || []).forEach(s => {
    const put = ar => { const k = normalizeAr(ar); if (k && !_drillIdx.has(k)) _drillIdx.set(k, s); };
    put(s.ar);
    (s.vary || []).forEach(v => put(v.ar));
  });
  return _drillIdx;
}
function gradeDrilled(ar, ok) {
  const s = drillIndex().get(normalizeAr(ar));
  if (!s) return;
  const g = ok ? "good" : "again";
  if (s.key) gradeCard(s.key, g);
  (s.words || []).forEach(w => {
    const cards = w.keys && w.keys.length ? w.keys : (w.key ? [w.key] : []);
    cards.forEach(k => gradeCard(k, g));
  });
}

function start() {
  if (MODE === "list") return renderList();
  queue = pickSession(); done = 0; got = 0; exactCount = 0;
  content.innerHTML = `
    <h1 style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px">
      <span>Sentence Practice</span>
      <span class="arabic" style="color:var(--accent)" dir="rtl">بِناءُ الجُمَل</span>
    </h1>
    <p class="sub">Build the whole sentence yourself from a verb you already know — the point is the <b>conjugation</b>: I / we / they across past, present and future. Write it, then reveal. High-frequency verbs only, a short set at a time — no endless drilling.</p>
    <div class="seg-row"><div class="seg" id="spMode">
      <button class="sel" data-m="practise">✍️ Practise</button>
      <button data-m="list">📋 The list</button>
    </div></div>
    <div class="sp-chips" id="spChips">
      ${[["all","Mixed"],["past","Past"],["pres","Present"],["fut","Future"]]
        .map(([k,l]) => `<span class="sp-chip ${TENSE_FILTER===k?"on":""}" data-k="${k}">${l}</span>`).join("")}
    </div>
    <div class="card"><div id="stage"></div></div>
  `;
  document.querySelectorAll("#spChips .sp-chip").forEach(c => c.onclick = () => {
    TENSE_FILTER = c.dataset.k; start();
  });
  document.querySelectorAll("#spMode button").forEach(b => b.onclick = () => {
    if (b.dataset.m === "list") { MODE = "list"; renderList(); }
  });
  ask();
}

function ask() {
  const stage = document.getElementById("stage");
  if (done >= queue.length) return finish();
  const it = queue[done];
  stage.innerHTML = `
    <div class="sp-meta">${done + 1} / ${queue.length}</div>
    <div class="sp-en">${it.en}</div>
    <div class="sp-hints">
      <span class="sp-hint">who: <span class="ar" dir="rtl">${it.person.ar}</span> — ${it.person.en.toLowerCase()}</span>
      <span class="sp-hint">${it.tense.en} · <span style="font-style:italic">${it.tense.hint}</span></span>
      <span class="sp-hint">root: <span class="ar" dir="rtl">${it.root}</span></span>
    </div>
    <input class="fill-input" id="spIn" placeholder="just type in English letters…" style="width:340px;max-width:100%;font-size:20px">
    <div class="sp-meta" style="margin-top:4px">Type in <b>English letters</b> — Arabic appears as you type. <a href="#" id="spHelpToggle" style="color:var(--accent)">how do I type it?</a></div>
    <div id="spHelp" style="display:none;font-size:13px;color:var(--muted);background:#f6f2ea;border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-top:8px;line-height:1.7">
      <b>You can ignore the little vowel marks</b> — grading only checks the letters, so just type the consonants and long vowels.<br>
      • <b>Long vowels:</b> <code>aa</code>/<code>A</code>=ا · <code>ee</code>/<code>ii</code>=ي · <code>oo</code>/<code>uu</code>=و<br>
      • <b>Tricky letters:</b> <code>H</code>=ح · <code>kh</code>=خ · <code>th</code>=ث · <code>dh</code>=ذ · <code>sh</code>=ش · <code>gh</code>=غ · <code>3</code>=ع · <code>S</code>=ص · <code>T</code>=ط<br>
      • <b>Shadda</b> (doubled letter): type it doubled, the natural way — <code>sayyara</code> → <span dir="rtl">سيّارة</span>, <code>rabb</code> → <span dir="rtl">ربّ</span> (or add <code>*</code>). <b>Sukun</b> (no vowel): just don't type a vowel (<code>^</code> if you want the mark). <b>Short vowels</b> (optional): <code>a</code>=fatha, <code>i</code>/<code>e</code>=kasra, <code>u</code>/<code>o</code>=damma.<br>
      • <b>"The" (<span dir="rtl">ال</span>):</b> type <code>al-</code> and it attaches — <code>al-kitab</code> → <span dir="rtl">الكتاب</span>, <code>bi al-sayyara</code> → <span dir="rtl">بالسيّارة</span>. For sun letters you can spell it as it sounds too: <code>as-sayyara</code>, <code>ash-shams</code> — both give the written <span dir="rtl">ال</span>. The little hyphen is just a helper; it disappears.
    </div>
    <div class="ex-row" style="margin-top:12px">
      <button class="primary" id="spShow">Show answer</button>
      <button class="small" id="spKb">⌨ keys</button>
    </div>
    <div id="spReveal"></div>
  `;
  const input = document.getElementById("spIn");
  // Autocorrect chips for the object words only — never the verb, because the
  // verb IS the question. The sentence starts with the verb, so the whole first
  // word gets no chips, which reads as broken (he reported exactly that on
  // 2026-08-30). heldBackNote fills that space with the reason instead.
  const lexicon = DATA.verbs.flatMap(v => v.obj.ar.split(" ")).filter(w => normalizeAr(w) !== normalizeAr(it.form));
  attachInlineTranslit(input, { lexicon, heldBackNote: "no chips for the verb — that's the bit you're proving. ⌨ keys if you're stuck." });
  input.focus();
  input.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); reveal(); } });
  const spTarget = () => document.getElementById("spIn");
  document.getElementById("spKb").onclick = () => mountTranslitDock(spTarget);
  const help = document.getElementById("spHelp");
  document.getElementById("spHelpToggle").onclick = e => { e.preventDefault(); help.style.display = help.style.display === "none" ? "block" : "none"; };
  document.getElementById("spShow").onclick = reveal;

  function reveal() {
    const typed = input.value.trim();
    const m = sentenceMatchAr(typed, it.ar, it.form);
    const exact = m.ok;
    const diag = exact ? null : diagnoseVerb(typed, it);
    const rev = document.getElementById("spReveal");
    rev.innerHTML = `
      <div class="gx" style="margin-top:14px">
        <div class="sp-model"><span class="verb">${it.form}</span> ${it.objAr} <span class="sent-play" style="cursor:pointer">🔊</span></div>
        <div class="sp-gloss">${it.en}</div>
        ${exact ? `<div style="color:var(--accent);font-weight:600;font-size:13.5px;margin-top:6px">✓ ${m.fuzzy ? "close enough — the model is" : m.rom ? "got it — that's" : "exact match —"} <span class="arabic" dir="rtl">${it.form} ${it.objAr}</span>. ${m.fuzzy ? "The conjugation was right, and that's the point." : "Spot on!"}</div>` : ""}
        ${typed && (!exact || m.fuzzy) ? `<div class="sp-meta" style="margin-top:6px">you wrote: <span class="arabic" dir="rtl">${typed}</span></div>` : ""}
        ${diag ? `<div class="sp-diag">Right verb, wrong slot: <span class="arabic" dir="rtl">${diag.form}</span> is the <b>${diag.person.en} — ${diag.tense.en}</b> form. This one wants <b>${it.person.en} — ${it.tense.en}</b>: <span class="arabic" dir="rtl">${it.form}</span>.</div>`
          : (!exact && typed) ? `<div class="sp-diag">The verb to build was <b>${it.person.en} — ${it.tense.en}</b>: <span class="arabic" dir="rtl">${it.form}</span>.</div>` : ""}
      </div>
      <div class="ex-row" style="margin-top:12px">
        <button class="primary" id="spGot">✓ Got it</button>
        <button class="small" id="spAgain">↺ Practise again</button>
      </div>
    `;
    rev.querySelector(".sent-play").onclick = () => speak(it.ar, 0.85);
    speak(it.ar, 0.85);
    document.getElementById("spShow").disabled = true;
    input.disabled = true;
    document.getElementById("spGot").onclick = () => mark(true, typed, exact, m, diag);
    document.getElementById("spAgain").onclick = () => mark(false, typed, exact, m, diag);
  }

  function mark(ok, typed, exact, m, diag) {
    logEvent({ e: "spract", verb: it.verb, person: it.person.key, tense: it.tense.key, typed, exact, got: ok,
      ...(m.rom ? { rom: true } : {}), ...(m.fuzzy ? { fuzzy: true } : {}),
      ...(diag ? { wrongCell: diag.person.key + ":" + diag.tense.key } : {}) });
    gradeDrilled(it.ar, ok);
    if (exact) exactCount++;
    if (ok) got++;
    else queue.push(it); // drill-the-misses: requeue at the end of the set
    done++;
    ask();
  }
}

/* ---------- THE LIST — ordered queues you work through ----------
   His instructions, 2026-08-30, over three messages while looking at this page:

     "where is the option for me to listen to the whole sentence? where is the
      option for me to mark if i already know some of these sentences and if to
      repeat or not. i want to see a list by frequency of use and it should be
      quranic or MSA, i.e. the list will be working through in order"
     "you can create tags for sentences which allows to be in folders as well,
      can be good to see stuff by topic"
     "similarly for vocabulary as well, create tags of themes/topics for me to go
      through stuff if needed but it should be frequency based"

   The first version was 66 collapsible sets in arbitrary order. It answered
   "what exists" and never "what do I do next", and it had neither audio nor any
   way to mark a row. So:

     · TWO QUEUES — 🎧 ayat and 🗣 everyday sentences — each ordered by frequency
       of use, commonest first. That order IS the plan: work down it. (Words got
       their own page, words.html, when he set out the site's shape: "sentences,
       words, others, progress".)
     · TOPICS ARE A FILTER, NOT A STRUCTURE. Tags let him open "the flat" or
       "Al-Falaq" when he wants to, and the order inside a topic is still
       frequency. Ordering by topic would put him back where he started.
     · AUDIO on every row — Alafasy's real recitation for an ayah, the generated
       clip for everything else.
     · THE FOUR BUCKETS on every row, so he can clear what he already knows
       without sitting through a lesson for it.

   `use` (scripts/gen-sentences.js) is the MEAN commonness of a sentence's words,
   never the sum: a sum rewards length, and a long rare ayah is not more useful
   than مَا هَذَا؟. Words rank on their own measured share (data/frequency.json).

   Rendered a page at a time — 985 sentences and 800-odd words, each row carrying
   an audio button and four bucket buttons, is far too much DOM to lay out at once. */
let LIST_TRACK = "quran", LIST_TAG = "", LIST_SHOWN = 0;
const LIST_PAGE = 60;

function renderList() {
  trackPage("sentences:list");
  const held = k => (getSrs()[k] || {}).box >= 3;
  const all = BANK.sentences || [];
  const quran = all.filter(s => s.track === "quran");
  const conv = all.filter(s => s.track !== "quran");
  const variants = conv.reduce((a, s) => a + Math.max(1, (s.vary || []).length), 0);
  const qHeld = quran.filter(s => held(s.key)).length, cHeld = conv.filter(s => held(s.key)).length;

  content.innerHTML = `
    <h1 style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px">
      <span>Sentences</span>
      <span class="arabic" style="color:var(--accent)" dir="rtl">الجُمَل</span>
    </h1>
    <div class="seg-row"><div class="seg" id="spMode">
      <button data-m="practise">✍️ Practise</button>
      <button class="sel" data-m="list">📋 The list</button>
    </div></div>
    <div class="card" style="border-color:var(--accent)">
      <p style="margin:0 0 8px;font-size:15px"><b>Everything there is to master, commonest first.</b>
      Work down it — the top of each list is what you are most likely to hear or need to say.</p>
      <div class="inv2">
        <div><div class="n">${quran.length}</div><div class="l">🎧 ayat — Al-Fatiha and all of juz' 'Amma<br><b>${qHeld}</b> held</div></div>
        <div><div class="n">${conv.length}</div><div class="l">🗣 everyday sentences, ${variants} with their variants<br><b>${cHeld}</b> held</div></div>
      </div>
      <p class="sp-meta" style="margin:10px 0 0">🔊 plays the whole thing — for an ayah that is Mishary Alafasy's
      recitation, not a synthetic voice. The four buttons are yours: ✓ got it · ↻ repeat · ⏳ much later · ⊘ don't repeat.</p>
    </div>
    <div id="weekBox"></div>
    <div class="seg-row"><div class="seg" id="listTrack">
      <button class="${LIST_TRACK === "quran" ? "sel" : ""}" data-t="quran">🎧 Qur'an</button>
      <button class="${LIST_TRACK === "conv" ? "sel" : ""}" data-t="conv">🗣 Everyday</button>
    </div></div>
    <div class="sp-chips" id="listTags"></div>
    <p class="sp-meta" id="listHead" style="margin:0 0 10px"></p>
    <div id="listBody"></div>
    <div class="ex-row" style="margin-top:14px"><button id="listMore">Show more</button></div>
  `;

  document.querySelectorAll("#spMode button").forEach(b => b.onclick = () => {
    if (b.dataset.m === "practise") { MODE = "practise"; start(); }
  });
  document.querySelectorAll("#listTrack button").forEach(b => b.onclick = () => {
    if (b.dataset.t === LIST_TRACK) return;
    LIST_TRACK = b.dataset.t; LIST_TAG = "";
    renderList();
  });
  document.getElementById("listMore").onclick = () => page();
  primeSpeak();
  weekBox();
  refresh();

  async function rowsFor() {
    return (BANK.sentences || []).filter(s => (LIST_TRACK === "quran") === (s.track === "quran"));
  }
  /* a sentence's topic: its surah for the Qur'an, its theme otherwise */
  const tagOf = r => LIST_TRACK === "quran" ? (r.surah || "Qur'an")
    : String(r.theme || SRC_NAMES[r.src] || "Everyday").split(/\s+[—–-]\s+/)[0].trim();

  async function refresh() {
    const rows = await rowsFor();
    // topics in the order their FIRST row appears, so the chip row is itself
    // frequency-ordered rather than alphabetical
    const tags = [];
    const seen = new Set();
    rows.forEach(r => { const t = tagOf(r); if (t && !seen.has(t)) { seen.add(t); tags.push(t); } });
    document.getElementById("listTags").innerHTML =
      `<span class="sp-chip ${LIST_TAG ? "" : "on"}" data-t="">All</span>` +
      tags.map(t => `<span class="sp-chip ${LIST_TAG === t ? "on" : ""}" data-t="${esc(t)}">${esc(t)}</span>`).join("");
    document.querySelectorAll("#listTags .sp-chip").forEach(c => c.onclick = () => {
      LIST_TAG = c.dataset.t; LIST_SHOWN = 0; refresh();
    });
    LIST_SHOWN = 0;
    document.getElementById("listBody").innerHTML = "";
    page(rows);
  }

  async function page(rows) {
    rows = rows || await rowsFor();
    const shown = LIST_TAG ? rows.filter(r => tagOf(r) === LIST_TAG) : rows;
    const body = document.getElementById("listBody");
    const slice = shown.slice(LIST_SHOWN, LIST_SHOWN + LIST_PAGE);
    fill(body, slice, LIST_SHOWN, LIST_SHOWN > 0);
    LIST_SHOWN += slice.length;
    const noun = LIST_TRACK === "quran" ? "ayat" : "everyday sentences";
    const heldN = shown.filter(r => held(r.key)).length;
    document.getElementById("listHead").innerHTML =
      `${shown.length} ${esc(noun)}${LIST_TAG ? ` in <b>${esc(LIST_TAG)}</b>` : ""}, commonest first · <b>${heldN}</b> held · showing ${LIST_SHOWN}.`;
    const more = document.getElementById("listMore");
    more.style.display = LIST_SHOWN >= shown.length ? "none" : "";
    more.textContent = `Show ${Math.min(LIST_PAGE, shown.length - LIST_SHOWN)} more`;
  }

  /* This week's sentences stay at the top: they are the answer to "every week I
     am trying to master certain sentences, right?" */
  function weekBox() {
    if (typeof Curriculum === "undefined" || !LIST_CTX) return;
    let sents = [];
    try {
      const state = Curriculum.milestoneState(LIST_CTX);
      const weeks = Curriculum.weekPlan(LIST_CTX, state);
      const wk = weeks[Curriculum.currentWeek(weeks) - 1];
      if (!wk) return;
      const seen = new Set();
      wk.lessons.forEach(x => Curriculum.sentencesFor(x.lesson.keys || [], LIST_CTX,
        { track: x.milestone.track === "quran" ? "quran" : "conv", limit: 4 })
        .forEach(s => { if (!seen.has(s.key)) { seen.add(s.key); sents.push(s); } }));
    } catch (e) { return; }
    if (!sents.length) return;
    const h = sents.filter(s => held(s.key)).length;
    document.getElementById("weekBox").innerHTML = `
      <h2 style="margin:22px 0 4px;font-size:17px">📌 This week</h2>
      <p class="sp-meta" style="margin-bottom:10px">Seven lessons, and between them these
        <b>${sents.length} sentences</b> — that is what mastering this week actually means. ${h} held so far.</p>
      <div class="card" id="weekRows" style="padding:8px 10px"></div>`;
    fill(document.getElementById("weekRows"), sents, null);
  }

  /* one row: its place in the queue, the Arabic, 🔊, the meaning, the buckets */
  function fill(host, rows, offset, append) {
    const html = rows.map((s, i) => `
      <div class="lrow${held(s.key) ? " on" : ""}" data-k="${esc(s.key)}">
        <div class="lhead">
          ${offset === null ? "" : `<span class="lnum">${offset + i + 1}</span>`}
          <button class="lplay" data-ar="${esc(s.ar)}" title="hear it">🔊</button>
          <div class="lar arabic" dir="rtl">${esc(s.ar)}${(s.vary || []).length ? ` <span class="vtag">⟳ ${s.vary.length}</span>` : ""}</div>
        </div>
        <div class="len">${esc(s.en)}${s.tr ? ` <span class="ltr">${esc(s.tr)}</span>` : ""}${s.ref ? ` <span class="lref">${esc(s.ref)}</span>` : ""}</div>
        <div class="bucket-slot"></div>
      </div>`).join("");
    if (append) host.insertAdjacentHTML("beforeend", html); else host.innerHTML = html;
    host.querySelectorAll(".lplay").forEach(b => {
      if (b.dataset.wired) return;
      b.dataset.wired = "1";
      b.onclick = () => speak(b.dataset.ar, 0.85);
    });
    host.querySelectorAll(".lrow").forEach(r => {
      const slot = r.querySelector(".bucket-slot");
      if (!slot || slot.dataset.wired) return;
      slot.dataset.wired = "1";
      mountBucketBar(slot, r.dataset.k, b => {
        // ✓ / ⏳ / ⊘ all mean "I have this" — reflect it immediately
        r.classList.toggle("on", b !== "repeat");
      });
    });
  }
}

function finish() {
  logEvent({ e: "spract-done", n: done, got, exact: exactCount, tense: TENSE_FILTER });
  autoSync();
  const stage = document.getElementById("stage");
  // `got` is HIS self-mark; exactCount is what he actually wrote correctly. Showing
  // only the self-mark read as a score and flattered him (8/8 while 3 were exact).
  const shaky = done - exactCount;
  stage.innerHTML = `
    <div style="text-align:center;padding:16px 0">
      <div style="font-size:22px;font-weight:700">${exactCount} / ${done} written correctly ${exactCount === done ? "— ممتاز! 🎉" : ""}</div>
      ${shaky ? `<p class="sub" style="margin-top:6px">${shaky === 1 ? "One conjugation" : shaky + " conjugations"} needed the answer — that is the useful half. ${got > exactCount ? `You marked ${got} as “got it”; the count above is what came out of your own head.` : ""}</p>` : ""}
      <p class="sub" style="margin-top:8px">Every "practise again" came back around until you had it. Come back after your next lesson and the newest verbs will be here.</p>
      <div class="ex-row" style="justify-content:center;margin-top:10px">
        <button class="primary" id="spNew">New set</button>
        <a href="speaking.html" style="color:var(--accent);font-weight:600;text-decoration:none;align-self:center">Now say them out loud →</a>
      </div>
    </div>
  `;
  document.getElementById("spNew").onclick = start;
}

/* shared phonetic keyboard dock (same pattern as Vocab Lab / Grammar) */
let _kbMounted = false;
function mountKbDock(getTarget) {
  const dock = document.getElementById("kbDock");
  if (_kbMounted) { dock.firstChild.style.display = dock.firstChild.style.display === "none" ? "block" : "none"; return; }
  _kbMounted = true;
  const kbWrap = document.createElement("div");
  kbWrap.className = "card";
  kbWrap.style.padding = "10px";
  KB_LAYOUT.forEach(r => {
    const rowDiv = document.createElement("div");
    rowDiv.className = "kb-row";
    r.forEach(k => {
      const b = document.createElement("button");
      b.type = "button";
      b.innerHTML = `<span class="k-ar">${LATIN_TO_AR[k]}</span><span class="k-lat">${k}</span>`;
      b.onmousedown = (e) => e.preventDefault();
      b.onclick = () => { const t = getTarget(); if (t) { t.value += LATIN_TO_AR[k]; t.focus(); } };
      rowDiv.appendChild(b);
    });
    kbWrap.appendChild(rowDiv);
  });
  const extra = document.createElement("div");
  extra.className = "kb-row";
  const sp = document.createElement("button"); sp.innerHTML = `<span class="k-lat">space</span>`; sp.style.minWidth = "140px";
  sp.onmousedown = e => e.preventDefault(); sp.onclick = () => { const t = getTarget(); if (t) { t.value += " "; t.focus(); } };
  const del = document.createElement("button"); del.innerHTML = `<span class="k-lat">⌫</span>`;
  del.onmousedown = e => e.preventDefault(); del.onclick = () => { const t = getTarget(); if (t) { t.value = t.value.slice(0, -1); t.focus(); } };
  extra.appendChild(sp); extra.appendChild(del);
  kbWrap.appendChild(extra);
  dock.appendChild(kbWrap);
}
</script>
