<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>Quran — Arabic</title>
  <link rel="stylesheet" href="css/fonts.css?v=mwidwev5">
  <link rel="stylesheet" href="css/style.css?v=mwidwev5">
  <style>
    .verse-block { border-bottom: 1px dashed var(--border); padding: 18px 0; }
    .verse-block:last-child { border-bottom: none; }
    .verse-ar { direction: rtl; text-align: right; font-family: var(--font-ar); font-size: 32px; line-height: 2.1; }
    .vw { cursor: pointer; position: relative; border-radius: 6px; padding: 0 2px; }
    .vw:hover { background: var(--accent-soft); }
    .vw[data-tip]:hover::after {
      content: attr(data-tip); position: absolute; bottom: calc(100% + 4px); right: 50%; transform: translateX(50%);
      background: var(--ink); color: var(--bg, #fdfaf4); font-family: var(--font-ui); font-size: 13px; font-weight: 500;
      padding: 6px 11px; border-radius: 9px; width: max-content; max-width: 230px; white-space: normal;
      text-align: center; line-height: 1.45; direction: ltr; z-index: 60; pointer-events: none;
    }
    .verse-ref { color: var(--amber); font-weight: 600; font-size: 12px; }
    .verse-en { color: var(--muted); font-size: 14px; margin: 6px 0 10px; }
    .wbw { width: 100%; border-collapse: collapse; font-size: 14px; direction: rtl; }
    .wbw td { padding: 6px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
    .wbw .w-ar { font-family: var(--font-ar); font-size: 24px; white-space: nowrap; cursor: pointer; }
    .wbw .w-tr { color: var(--muted); font-style: italic; direction: ltr; text-align: left; }
    .wbw .w-en { direction: ltr; text-align: left; min-width: 130px; }
    .wbw .w-ai { color: var(--muted); font-size: 13px; margin-top: 3px; line-height: 1.45; border-left: 2px solid var(--amber); padding-left: 8px; }
    .wbw input { width: 100%; min-width: 110px; border: 1px solid var(--border); border-radius: 8px; padding: 4px 8px; font-size: 14px; }
    .wbw input.ok { border-color: var(--accent); background: var(--accent-soft); }
    .wbw input.no { border-color: var(--red); background: var(--red-soft); }
    .wbw .true-en { display: block; color: var(--ink); font-weight: 600; font-size: 13px; }
    .wbw .true-en::before { content: "✗ "; color: var(--red); font-weight: 700; }
    .wbw .g-btn { cursor: pointer; color: var(--amber); font-size: 13px; user-select: none; }
    .wbw .g-row td { background: var(--amber-soft); font-size: 13px; direction: ltr; text-align: left; color: var(--ink); line-height: 1.5; }
    .wbw .g-row .g-root { color: var(--amber); font-weight: 600; display: block; margin-top: 4px; }
    .q-engine-strip { display: flex; flex-wrap: wrap; gap: 4px 18px; margin: 10px 0 16px; border-bottom: 1px solid var(--border-strong); padding-bottom: 0; }
    .q-pillar { background: transparent; border: 0; border-bottom: 2px solid transparent; border-radius: 0; padding: 7px 2px 9px; cursor: pointer; text-align: left; transition: color 0.12s, border-color 0.12s; color: var(--muted); }
    .q-pillar:hover { color: var(--ink); border-bottom-color: var(--border-strong); }
    .q-pillar.active { border-bottom-color: var(--accent); color: var(--ink); }
    .q-pillar-top { display: flex; align-items: baseline; gap: 6px; font-size: 13.5px; font-weight: 500; }
    .q-pillar.active .q-pillar-top { color: var(--ink); font-weight: 600; }
    .q-pillar-num { font-size: 11.5px; font-weight: 500; color: var(--muted); margin: 1px 0 0; line-height: 1.3; }
    .q-pillar-sub { display: none; }
    .q-tabs { display: none; }
    .q-toolbar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px 12px; margin-bottom: 12px; padding: 6px 0 10px; background: transparent; border: 0; border-bottom: 1px solid var(--border); border-radius: 0; }
    .q-chips { display: inline-flex; gap: 5px; flex-wrap: wrap; align-items: center; }
    .q-chip { border: 1px solid var(--border); background: var(--paper-elevated); border-radius: var(--radius); padding: 3px 10px; font-size: 12px; font-weight: 500; cursor: pointer; color: var(--ink); }
    .q-chip.active { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); font-weight: 600; }
    .q-glue-tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
    .q-glue-tbl th, .q-glue-tbl td { padding: 8px 9px; border-bottom: 1px solid var(--border); text-align: center; }
    .q-glue-tbl th { font-size: 12px; color: var(--muted); background: var(--surface-2); border-bottom: 1px solid var(--border-strong); font-weight: 600; }
    .q-glue-tbl td:first-child, .q-glue-tbl th:first-child { text-align: left; }
    .q-glue-btn { background: transparent; border: 1px solid transparent; border-radius: var(--radius); padding: 3px 6px; cursor: pointer; font-family: var(--font-ar); font-size: 20px; color: var(--ink); line-height: 1.35; transition: all 0.1s; }
    .q-glue-btn:hover { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
    .q-glue-tr { display: block; font-family: var(--font-ui); font-size: 11px; color: var(--muted); }
    .q-core-tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
    .q-core-tbl th { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--border-strong); font-size: 12px; color: var(--muted); background: var(--surface-2); font-weight: 600; }
    .q-core-tbl td { padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    .q-freq-pill { font-size: 11px; font-weight: 500; padding: 0; border-radius: 0; background: transparent; color: var(--muted); white-space: nowrap; }
    .q-pillar-tag { font-size: 11px; font-weight: 500; padding: 0; border-radius: 0; background: transparent; color: var(--muted); white-space: nowrap; }
    .q-reveal-btn { border: 0; border-bottom: 1px dotted var(--accent); background: transparent; color: var(--accent); border-radius: 0; padding: 2px 2px; font-family: var(--font-ui); font-size: 13.5px; font-weight: 500; cursor: pointer; }
    .q-reveal-btn:hover { border-bottom-color: var(--ink); color: var(--ink); background: transparent; }
    .q-ayah-card { background: transparent; border: 0; border-bottom: 1px solid var(--border); border-radius: 0; padding: 10px 2px; margin-bottom: 0; }
    .q-ayah-grid { display: grid; grid-template-columns: minmax(240px, 1fr) minmax(260px, 1.15fr) auto; column-gap: 18px; row-gap: 4px; align-items: baseline; }
    .q-ayah-en-col { min-width: 0; }
    .q-ayah-ar-col { min-width: 0; text-align: right; }
    .q-ayah-dock { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; justify-self: end; }
    .q-ayah-sub { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
    .q-ayah-toks { grid-column: 1 / -1; margin-top: 4px; display: flex; flex-wrap: wrap; gap: 4px; }
    @media (max-width: 768px) {
      .q-ayah-grid { grid-template-columns: 1fr; row-gap: 6px; }
      .q-ayah-ar-col { text-align: right; }
      .q-ayah-dock { justify-self: end; }
    }
    .q-tok-chip { display: inline-flex; flex-direction: column; align-items: center; padding: 2px 7px; border-radius: 4px; border: 0; border-bottom: 1px solid var(--border); background: transparent; margin: 2px; font-size: 12px; }
    .q-tok-chip.known { border-bottom-color: rgba(13,122,95,0.45); background: rgba(13,122,95,0.04); }
    .q-tok-chip.new-tok { border-bottom-color: #d97706; background: rgba(161,106,18,0.06); }
    @media (max-width: 600px) { .verse-ar { font-size: 25px; } .wbw .w-ar { font-size: 20px; } .q-glue-tbl, .q-core-tbl { min-width: 580px; } }
  </style>
</head>
<body>
<main>
  <div id="content">Loading…</div>
</main>

<script src="js/srs.js?v=mwidwev5"></script>
<script src="js/practice.js?v=mwidwev5"></script>
<script src="js/lesson-cards.js?v=mwidwev5"></script>
<script src="js/app.js?v=mwidwev5"></script>
<script src="js/tracker.js?v=mwidwev5"></script>
<script src="js/plan.js?v=mwidwev5"></script>
<script>
renderNav("quran");
trackPage("quran");

const content = document.getElementById("content");
let DATA = null;
let QCORE = [];
let QCARDS = [];
let MCARDS = [];
let MOSQUE_ITEMS = [];
let QGRAMMAR = [];
let QSENTS = [];
let QC_LOOKUP = new Map();
let QC_QWBW_POS = new Map();
let FAM_BY_ROOT = {};

const QURAN_GRAMMAR_IDS = ["inna", "alladhina", "idafa", "pronouns", "negation", "past-present", "imperative"];
const GLUE_MATRIX = [
  { base: "فِي", en: "in", cells: [
    ["فِيَّ", "fiyya"], ["فِيكَ", "fī-ka"], ["فِيهِ", "fī-hi"], ["فِيهَا", "fī-hā"], ["فِينَا", "fī-nā"], ["فِيكُمْ", "fī-kum"], ["فِيهِمْ", "fī-him"]
  ]},
  { base: "عَلَى", en: "upon", cells: [
    ["عَلَيَّ", "ʿalay-ya"], ["عَلَيْكَ", "ʿalay-ka"], ["عَلَيْهِ", "ʿalay-hi"], ["عَلَيْهَا", "ʿalay-hā"], ["عَلَيْنَا", "ʿalay-nā"], ["عَلَيْكُمْ", "ʿalay-kum"], ["عَلَيْهِمْ", "ʿalay-him"]
  ]},
  { base: "لِ", en: "for / to", cells: [
    ["لِي", "lī"], ["لَكَ", "la-ka"], ["لَهُ", "la-hu"], ["لَهَا", "la-hā"], ["لَنَا", "la-nā"], ["لَكُمْ", "la-kum"], ["لَهُمْ", "la-hum"]
  ]},
  { base: "مِنْ", en: "from", cells: [
    ["مِنِّي", "min-nī"], ["مِنْكَ", "min-ka"], ["مِنْهُ", "min-hu"], ["مِنْهَا", "min-hā"], ["مِنَّا", "min-nā"], ["مِنْكُمْ", "min-kum"], ["مِنْهُمْ", "min-hum"]
  ]},
  { base: "بِ", en: "with / by", cells: [
    ["بِي", "bī"], ["بِكَ", "bi-ka"], ["بِهِ", "bi-hi"], ["بِهَا", "bi-hā"], ["بِنَا", "bi-nā"], ["بِكُمْ", "bi-kum"], ["بِهِمْ", "bi-him"]
  ]},
  { base: "إِنَّ", en: "indeed", cells: [
    ["إِنِّي", "in-nī"], ["إِنَّكَ", "inna-ka"], ["إِنَّهُ", "inna-hu"], ["إِنَّهَا", "inna-hā"], ["إِنَّا", "in-nā"], ["إِنَّكُمْ", "inna-kum"], ["إِنَّهُمْ", "inna-hum"]
  ]},
  { base: "رَبّ", en: "Lord", cells: [
    ["رَبِّي", "rabb-ī"], ["رَبُّكَ", "rabbu-ka"], ["رَبُّهُ", "rabbu-hu"], ["رَبُّهَا", "rabbu-hā"], ["رَبُّنَا", "rabbu-nā"], ["رَبُّكُمْ", "rabbu-kum"], ["رَبُّهُمْ", "rabbu-hum"]
  ]}
];

let currentQuranTab = "structures";
let corePillarFilter = "all";
let coreDotFilter = "all";
let coreSearch = "";
let coreReviewMode = "all";
let coreSortWeakest = false;
let coreFrozenRanks = null;
let coreShowTr = true;
const CORE_REVEALED = new Set();

let unlockedFilter = "ready";
let unlockedReviewMode = "all";
const UNLOCKED_REVEALED = new Set();

let mosqueSubFilter = "all";
let mosqueDotFilter = "all";
let mosqueReviewMode = "all";
let mosqueSortWeakest = false;
let mosqueFrozenKeys = null;
let mosqueSearch = "";
const MOSQUE_REVEALED = new Set();

// word roots arrive as rich strings ("ق-و-ل (q-w-l) — to say…"); reduce to the bare Arabic letters
const rootKey = s => ((s || "").split("(")[0]).replace(/[^ء-ي]/g, "").replace(/ـ/g, "").replace(/[أإآٱ]/g, "ا");

if (window.LessonCards) LessonCards.ensureStyles();
Promise.all([
  fetch("data/verses.json").then(r => r.json()).catch(() => ({ surahs: [] })),
  fetch("data/quran-core.json").then(r => r.json()).catch(() => ({ words: [] })),
  fetch("data/lesson-cards.json").then(r => r.json()).catch(() => ({ cards: [] })),
  fetch("data/grammar.json").then(r => r.json()).catch(() => ({ patterns: [] })),
  fetch("data/quran-sentences.json").then(r => r.json()).catch(() => ({ sentences: [] })),
  fetch("data/families.json").then(r => r.json()).catch(() => ({ families: [] })),
  fetch("data/everyday.json").then(r => r.json()).catch(() => ({ groups: [] }))
]).then(([vRes, qcRes, lcRes, grRes, qsRes, famRes, evRes]) => {
  DATA = vRes.surahs || [];
  QCORE = (qcRes.words || []).map((w, i) => ({
    rank: i,
    key: `qc:${i}`,
    ar: w.ar,
    tr: w.tr || "",
    en: w.en || "",
    n: w.n || 0,
    famId: w.fam || "",
    pillar: (window.Practice && Practice.classifyQuranWord) ? Practice.classifyQuranWord(w.ar, w.en, i) : "noun"
  }));
  QCARDS = (lcRes.cards || []).filter(c => c && c.category === "quran");
  MCARDS = (lcRes.cards || []).filter(c => c && c.category === "mosque");
  const EV_MOSQUE_ORDER = [
    { id: "khutba", sub: "khutba", subLabel: "🕌 Friday Khutbah" },
    { id: "duas", sub: "duas", subLabel: "🤲 Common Du'ā" },
    { id: "masjid", sub: "imam", subLabel: "📢 What the Imam Says" }
  ];
  MOSQUE_ITEMS = [];
  let mOrd = 0;
  EV_MOSQUE_ORDER.forEach(cfg => {
    const g = (evRes.groups || []).find(x => x.id === cfg.id);
    if (!g) return;
    (g.members || []).forEach((m, i) => {
      MOSQUE_ITEMS.push({
        order: mOrd++,
        group: cfg.id,
        key: `ev-${cfg.id}:${i}`,
        sub: cfg.sub,
        subLabel: cfg.subLabel,
        ar: m.ar,
        tr: m.tr || "",
        en: m.en || "",
        note: m.note || "",
        ayahRef: m.ayahRef || ""
      });
    });
  });
  QGRAMMAR = (grRes.patterns || []).filter(p => QURAN_GRAMMAR_IDS.includes(p.id));
  QSENTS = qsRes.sentences || [];
  (famRes.families || []).forEach(f => { FAM_BY_ROOT[rootKey(f.root)] = f; });

  const wkMap = {};
  QCORE.forEach(w => {
    const n = normalizeAr(w.ar).replace(/^ال/, "");
    if (n && !wkMap[n]) wkMap[n] = w.key;
  });
  MOSQUE_ITEMS.forEach(it => {
    if (String(it.ar || "").trim().split(/\s+/).length === 1) {
      const n = normalizeAr(it.ar).replace(/^ال/, "");
      if (n && !wkMap[n]) wkMap[n] = it.key;
    }
  });
  if (typeof registerWordKeys === "function" && Object.keys(wkMap).length) registerWordKeys(wkMap);

  if (window.Practice && Practice.buildKnownNormLookup) {
    QC_LOOKUP = Practice.buildKnownNormLookup(QCORE);
  }
  DATA.forEach(s => {
    (s.verses || []).forEach((v, vi) => {
      (v.words || []).forEach((w, wi) => {
        const bare = normalizeAr(w[0]).replace(/^ال/, "");
        if (bare && !QC_QWBW_POS.has(bare)) QC_QWBW_POS.set(bare, { surahId: s.id, vi, wi });
      });
    });
  });
  loadQuranWordAudio();

  const params = new URLSearchParams(location.search);
  const s = DATA.find(x => x.id === params.get("s"));
  const urlTab = params.get("tab");
  const urlSub = params.get("sub");
  if (urlSub && ["all", "khutba", "duas", "imam"].includes(urlSub)) mosqueSubFilter = urlSub;
  if (urlTab && ["structures", "words", "surahs", "unlocked", "mosque"].includes(urlTab)) {
    currentQuranTab = urlTab;
  } else if (location.hash && location.hash.startsWith("#lc-")) {
    const hid = location.hash.slice(4);
    currentQuranTab = MCARDS.some(c => c.id === hid) ? "mosque" : "structures";
  }
  if (s) renderSurah(s, params.get("mode") || "study");
  else if (params.get("listen")) renderListenQueue();
  else {
    renderList();
    if (location.hash && location.hash.startsWith("#lc-")) {
      const target = document.getElementById(location.hash.slice(1));
      if (target && target.scrollIntoView) setTimeout(() => target.scrollIntoView({ behavior: "smooth", block: "start" }), 80);
    }
  }
});

function surahDone(id, step) { return !!stepsDone("q-" + id)[step]; }


function surahMasteryInfo(s) {
  const ayahKeys = (s.verses || []).map((v, i) => "s:q:" + s.id + ":" + (i + 1));
  const wordKeys = [];
  (s.verses || []).forEach((v, vi) => (v.words || []).forEach((_, wi) => wordKeys.push("qw:" + s.id + ":" + vi + ":" + wi)));
  const ac = SRS.summaryCounts(ayahKeys);
  const wc = SRS.summaryCounts(wordKeys);
  const listenPass = surahDone(s.id, "listen");
  const testPass = surahDone(s.id, "test");
  let level = "grey";
  if (listenPass || (ac.total > 0 && ac.green >= Math.ceil(ac.total * 0.8)) || (testPass && wc.total > 0 && wc.green >= Math.ceil(wc.total * 0.8))) {
    level = "green";
  } else if (ac.red > 0 || wc.red > 0) {
    level = "red";
  } else if (ac.green > 0 || ac.amber > 0 || wc.green > 0 || wc.amber > 0 || testPass || surahDone(s.id, "study")) {
    level = "amber";
  }
  const greenAyahs = listenPass ? ac.total : ac.green;
  return { level, ac, wc, greenAyahs, listenPass, testPass };
}

function rateSurahAyah(key, g, surahId, vi) {
  const nc = SRS.rate(key, g);
  const s = (DATA || []).find(x => x.id === surahId);
  const v = s && s.verses && s.verses[vi];
  if (v && Array.isArray(v.words) && g !== "retire") {
    const wg = g === "solid" || g === "yes" ? "yes" : g === "maybe" ? "maybe" : "no";
    v.words.forEach((_, wi) => {
      const wKey = `qw:${surahId}:${vi}:${wi}`;
      const wnc = SRS.rate(wKey, wg);
      const wr = document.getElementById(`wrow-${vi}-${wi}`);
      if (wr) SRS.paintBar(wr, wKey, wnc);
    });
  }
  logEvent({ e: "sentence-rate", key, g, box: nc.box, src: "quran-surah", t: Date.now() });
  autoSync();
  const blk = document.getElementById("vblock-" + vi);
  if (blk) SRS.paintBar(blk, key, nc);
}

function rateSurahWord(key, g, surahId, vi, wi) {
  const nc = SRS.rate(key, g);
  const s = (DATA || []).find(x => x.id === surahId);
  const v = s && s.verses && s.verses[vi];
  const w = v && v.words && v.words[wi];
  logEvent({
    e: "vocab-rate",
    key,
    bucket: g === "yes" || g === "solid" ? "medium" : g === "maybe" ? "weak" : "learning",
    g,
    box: nc.box,
    ar: w ? stripTashkeel(w[0]) : "",
    en: w ? w[2] : "",
    src: "quran-word",
    t: Date.now()
  });
  autoSync();
  const row = document.getElementById(`wrow-${vi}-${wi}`);
  if (row) SRS.paintBar(row, key, nc);
}

function switchQuranTab(tab) {
  currentQuranTab = tab;
  if (history && history.replaceState) {
    history.replaceState({}, "", "quran.html?tab=" + encodeURIComponent(tab));
  }
  renderList();
}
window.addEventListener("ats-mastery-updated", () => { if (DATA && !new URLSearchParams(location.search).get("s")) refreshEngineStrip(); });

function quranWordAltKeys(ar) {
  const n = normalizeAr(ar || "").replace(/^ال/, "");
  return n ? ["tw:" + n, n, ar].filter(Boolean) : (ar ? [ar] : []);
}

function computeEngineMetrics() {
  const srs = typeof getSrs === "function" ? getSrs() : {};
  const lcKeys = QCARDS.map(c => "lc:" + c.id);
  const lcCounts = window.SRS && SRS.summaryCounts ? SRS.summaryCounts(lcKeys) : { green: 0, total: QCARDS.length };

  const gramHeldCount = QGRAMMAR.filter(p => {
    const tKeys = (p.test || []).map((_, i) => `gt:${p.id}:${i}`);
    return tKeys.length > 0 && tKeys.every(k => {
      const st = window.SRS && SRS.masteryState ? SRS.masteryState(k, { srs }) : { level: "grey" };
      return st.level === "green";
    });
  }).length;

  const coreCounts = window.SRS && SRS.summaryCounts
    ? SRS.summaryCounts(QCORE.map(w => ({ key: w.key, altKeys: quranWordAltKeys(w.ar) })))
    : { green: 0, amber: 0, red: 0, grey: QCORE.length, total: QCORE.length };
  let coreHeldCount = 0;
  let heldTokens = 0;
  QCORE.forEach(w => {
    const keys = [w.key].concat(quranWordAltKeys(w.ar));
    const held = keys.some(k => { const c = srs[k]; return c && (c.b === "never" || (c.box || 0) >= 1); });
    if (held) {
      coreHeldCount++;
      heldTokens += (w.n || 0);
    }
  });
  const totalTokens = (window.Practice && Practice.MUSHAF_TOTAL_TOKENS) || 77430;
  const mushafPct = heldTokens ? ((heldTokens / totalTokens) * 100).toFixed(1) : "0.0";

  const salahTotalAyahs = (DATA || []).reduce((n, s) => n + (s.verses || []).length, 0);
  const salahGreenAyahs = (DATA || []).reduce((n, s) => n + surahMasteryInfo(s).greenAyahs, 0);

  const unlockedList = computeUnlockedAyahs(srs);
  const readyNowCount = unlockedList.filter(x => x.rd.unknownWords <= 1).length;

  const mosqueCounts = window.SRS && SRS.summaryCounts
    ? SRS.summaryCounts(MOSQUE_ITEMS.map(x => x.key))
    : { green: 0, amber: 0, red: 0, grey: MOSQUE_ITEMS.length, total: MOSQUE_ITEMS.length };
  const mosqueHeldCount = MOSQUE_ITEMS.filter(x => { const c = srs[x.key]; return c && (c.b === "never" || (c.box || 0) >= 1); }).length;
  const mosqueLcCounts = window.SRS && SRS.summaryCounts ? SRS.summaryCounts(MCARDS.map(c => "lc:" + c.id)) : { green: 0, total: MCARDS.length };

  return {
    lcCounts, gramHeldCount, gramTotal: QGRAMMAR.length,
    coreCounts, coreHeldCount, heldTokens, mushafPct,
    salahTotalAyahs, salahGreenAyahs,
    unlockedCount: unlockedList.length, readyNowCount,
    mosqueCounts, mosqueHeldCount, mosqueLcCounts
  };
}

function computeUnlockedAyahs(srsNow) {
  const srs = srsNow || (typeof getSrs === "function" ? getSrs() : {});
  const salahSurahNums = new Set((DATA || []).map(s => s.n));
  if (!window.Practice || !Practice.ayahReadiness) return [];
  const out = [];
  QSENTS.forEach(s => {
    if (salahSurahNums.has(s.surah)) return;
    const key = `s:qs:${s.surah}:${s.ayah}`;
    const item = Object.assign({}, s, { key });
    const rd = Practice.ayahReadiness(item, srs, QC_LOOKUP);
    const held = !!(srs[key] && (srs[key].b === "never" || (srs[key].box || 0) >= 1));
    if (rd.isComposable || held) {
      out.push({ key, sent: s, rd, held });
    }
  });
  out.sort((a, b) => a.rd.unknownWords - b.rd.unknownWords || b.rd.knownRatio - a.rd.knownRatio || a.sent.surah - b.sent.surah || a.sent.ayah - b.sent.ayah);
  return out;
}

function speakQuranCoreWord(encodedAr) {
  const ar = decodeURIComponent(encodedAr || "");
  if (!ar) return;
  const bare = normalizeAr(ar).replace(/^ال/, "");
  const pos = QC_QWBW_POS.get(bare);
  if (pos && typeof speakQuranWord === "function") {
    speakQuranWord(pos.surahId, pos.vi, pos.wi, ar, 0.8);
    return;
  }
  speak(ar, 0.82);
}

function rateCoreQuranWord(key, g, encodedAr) {
  const nc = SRS.rate(key, g);
  const ar = decodeURIComponent(encodedAr || "");
  const norm = normalizeAr(ar).replace(/^ال/, "");
  const srsNow = getSrs();
  ["tw:" + norm, norm, ar].forEach(tk => {
    if (tk && tk !== key && srsNow[tk] && !(srsNow[tk].b === "never" && g === "maybe")) {
      SRS.rate(tk, g);
    }
  });
  logEvent({ e: "vocab-rate", key, g, box: nc.box, ar: norm, src: "quran-core", t: Date.now() });
  autoSync();
  const tbody = document.getElementById("qCoreTbody");
  if (tbody) SRS.paintBar(tbody, key, nc);
  refreshEngineStrip();
}

      <p style="margin:0;font-size:13.5px;color:var(--muted)">▶ Real recitation streams a real qari (Mishary Rashid Alafasy) verse by verse. A verse's 🔊 plays him too, and tapping any word plays a real human voice for that word.</p>
    </div>
  `;
  const grid = document.getElementById("sGrid");
  (DATA || []).forEach(s => {
    const a = document.createElement("a");
    a.className = "story-card";
    a.href = `quran.html?s=${s.id}`;
    const words = s.verses.reduce((n, v) => n + v.words.length, 0);
    const mi = surahMasteryInfo(s);
    a.innerHTML = `
      <div class="num" style="display:flex;justify-content:space-between;align-items:center;gap:6px">
        <span style="display:inline-flex;align-items:center;gap:6px"><span class="m-dot m-${mi.level} lg" title="Surah mastery: ${mi.greenAyahs}/${s.verses.length} ayahs · ${mi.wc.green}/${words} words mastered"></span>${s.verses.length} verses · ${words} words</span>
        <span style="font-weight:700;color:${mi.greenAyahs > 0 || mi.wc.green > 0 ? 'var(--accent)' : 'var(--muted)'}">${mi.greenAyahs}/${s.verses.length} ayahs · ${mi.wc.green}/${words} words</span>
      </div>
      <div class="title-ar">${s.name}</div>
      <div class="title-en">${s.nameEn}</div>
      <div class="meta">${s.why}</div>
    `;
    grid.appendChild(a);
  });

  const updateOfflineOverview = async () => {
    if (typeof getQuranOfflineStatus !== "function") return;
    const st = await getQuranOfflineStatus();
    const lbl = document.getElementById("qAllOfflineStatus");
    const btn = document.getElementById("btnPackAllQuran");
    if (!lbl || !btn) return;
    if (st.isReady) {
      lbl.innerHTML = `<span style="color:var(--accent);font-weight:600">✓ All ${st.total} ayahs saved</span> · ready for flights &amp; commute`;
      btn.textContent = "✓ Saved (Re-verify)";
      btn.classList.remove("primary");
    } else {
      lbl.textContent = `${st.cached} of ${st.total} ayahs saved on this phone`;
    }
  };
  updateOfflineOverview();

  const btnPack = document.getElementById("btnPackAllQuran");
  if (btnPack) {
    btnPack.onclick = async () => {
      btnPack.disabled = true;
      btnPack.textContent = "Downloading 2.5MB…";
      const lbl = document.getElementById("qAllOfflineStatus");
      await offlinePackQuran(null, (n, total) => {
        if (lbl) lbl.textContent = `Downloading recitation: ${n} of ${total} ayahs…`;
      });
      btnPack.disabled = false;
      updateOfflineOverview();
    };
  }
}

function rateUnlockedAyah(key, g) {
  const nc = SRS.rate(key, g);
  logEvent({ e: "sentence-rate", key, g, box: nc.box, src: "quran-unlocked", t: Date.now() });
  autoSync();
  const card = document.getElementById("uq-" + key.replace(/[^a-zA-Z0-9_-]/g, "_"));
  if (card) SRS.paintBar(card, key, nc);
  refreshEngineStrip();
}

function setUnlockedFilter(f) { unlockedFilter = f; renderUnlockedTab(); }
function setUnlockedReviewMode(m) { unlockedReviewMode = m; UNLOCKED_REVEALED.clear(); renderUnlockedTab(); }
function revealUnlockedAyah(key) { UNLOCKED_REVEALED.add(key); renderUnlockedTab(); }

function renderUnlockedTab() {

  else if (unlockedFilter === "stretch") filtered = allUnlocked.filter(x => x.rd.unknownWords === 2);
  else if (unlockedFilter === "mastered") filtered = allUnlocked.filter(x => SRS.masteryState(x.key, { srs }).level === "green");

  const slice = filtered.slice(0, 60);
  body.innerHTML = `
    <div class="q-toolbar">
      <div style="font-size:13px">
        <b>Layer 4 · Unlocked Juz' 'Amma Ayahs (i+1)</b> — Practice gates unseen non-Salah ayahs until you already hold most of their words. Each Core 151 word you master unlocks more of the Qur'ān here.
      </div>
      <a href="index.html?qpillar=composable" class="q-chip" style="text-decoration:none;font-weight:500;color:var(--accent);border-color:var(--accent);padding:4px 10px;font-size:12.5px">⚡ Practise Unlocked Ayahs →</a>
    </div>
    <div class="calm-row" style="padding-bottom:10px;border-bottom:1px solid var(--border)">
      <div class="q-chips">
        <button type="button" class="q-chip ${unlockedFilter === 'ready' ? 'active' : ''}" onclick="setUnlockedFilter('ready')">🟢 Ready (≤1 new · ${allUnlocked.filter(x => x.rd.unknownWords <= 1).length})</button>
        <button type="button" class="q-chip ${unlockedFilter === 'stretch' ? 'active' : ''}" onclick="setUnlockedFilter('stretch')">🟡 Stretch (${allUnlocked.filter(x => x.rd.unknownWords === 2).length})</button>
        <button type="button" class="q-chip ${unlockedFilter === 'all' ? 'active' : ''}" onclick="setUnlockedFilter('all')">All (${allUnlocked.length})</button>
        <button type="button" class="q-chip ${unlockedFilter === 'mastered' ? 'active' : ''}" onclick="setUnlockedFilter('mastered')">Mastered 🟢</button>
      </div>
      <details class="more"><summary>Review Mode</summary><div class="more-body">
        <div class="q-chips">
          <button type="button" class="q-chip ${unlockedReviewMode === 'all' ? 'active' : ''}" onclick="setUnlockedReviewMode('all')">All</button>
          <button type="button" class="q-chip ${unlockedReviewMode === 'ar-only' ? 'active' : ''}" onclick="setUnlockedReviewMode('ar-only')">🇸🇦 By Ear (AR → EN)</button>
          <button type="button" class="q-chip ${unlockedReviewMode === 'en-only' ? 'active' : ''}" onclick="setUnlockedReviewMode('en-only')">🇬🇧 EN → AR</button>
        </div>
      </div></details>
    </div>
    ${slice.length ? slice.map(item => {
      const a = item.sent;

      const hideAr = unlockedReviewMode === "en-only" && !rev;
      const hideEn = unlockedReviewMode === "ar-only" && !rev;
      const domId = "uq-" + item.key.replace(/[^a-zA-Z0-9_-]/g, "_");
      const escAr = String(a.ar || "").replace(/'/g, "\\'");
      const tokens = String(a.ar || "").replace(/[\u06D6-\u06ED.،؟!«»]/g, "").trim().split(/\s+/).filter(Boolean);
      return `
        <div class="q-ayah-card q-ayah-grid" id="${domId}">
          <div class="q-ayah-en-col">

              ? `<button type="button" class="q-reveal-btn" onclick="revealUnlockedAyah('${item.key}')">Show meaning →</button>`
              : `<div style="font-family:var(--font-ui);font-size:16px;font-weight:400;color:var(--ink);line-height:1.5">${a.en}</div>`
            }
            <div class="q-ayah-sub">${a.surahName} (${a.ref}) · ${item.rd.knownWords}/${item.rd.totalWords} words held</div>
          </div>
          <div class="q-ayah-ar-col">
            ${hideAr
              ? `<button type="button" class="q-reveal-btn" onclick="revealUnlockedAyah('${item.key}'); reciteVerse(${a.surah}, ${a.ayah}, '${escAr}', 0.85)">Show Arabic &amp; Play Alafasy →</button>`
              : `<div class="arabic" style="font-size:24px;line-height:1.65;text-align:right;color:var(--ink)" dir="rtl">${a.ar}</div>`
            }
          </div>
          <div class="q-ayah-dock">
            <button type="button" class="lc-speak-btn" onclick="reciteVerse(${a.surah}, ${a.ayah}, '${escAr}', 0.85)" title="Listen to Mishary Rashid Alafasy recitation (${a.ref})">🔊 Alafasy</button>
            ${SRS.rateBarHtml(item.key, "rateUnlockedAyah", [], { compact: true, retire: false })}
          </div>
          ${!hideEn ? `
            <details style="grid-column:1 / -1;margin-top:2px">
              <summary style="cursor:pointer;font-size:11px;color:var(--muted);list-style:none">Word-by-word (${tokens.length}) ▾</summary>
              <div class="q-ayah-toks">
                ${tokens.map((tok, wi) => {
                  const known = item.rd.tokenKnown[wi];
                  const gl = (a.words && a.words[wi]) ? a.words[wi] : "";

      <div class="card" style="text-align:center;padding:24px">
        <p style="margin:0 0 10px">No non-Salah ayahs match this filter yet — keep practising your <strong>Top 151 Core Words</strong> and <strong>Structures</strong>, and ayahs unlock here automatically as your held vocabulary grows.</p>

function setMosqueSub(s) { mosqueSubFilter = s; mosqueFrozenKeys = null; renderMosqueTab(); }
function setMosqueDotFilter(d) { mosqueDotFilter = d; mosqueFrozenKeys = null; renderMosqueTab(); }
function setMosqueReviewMode(m) { mosqueReviewMode = m; MOSQUE_REVEALED.clear(); renderMosqueTab(); }
function toggleMosqueWeakest() { mosqueSortWeakest = !mosqueSortWeakest; mosqueFrozenKeys = null; renderMosqueTab(); }
function resortMosqueItems() { mosqueFrozenKeys = null; renderMosqueTab(); }
function revealMosqueItem(key, encodedAr) {
  MOSQUE_REVEALED.add(key);
  renderMosqueTab();
  if (encodedAr && mosqueReviewMode === "en-only") speak(decodeURIComponent(encodedAr), 0.82);
}
function reciteAyahRef(ref, encodedAr) {
  const p = String(ref || "").split(":").map(Number);
  const ar = decodeURIComponent(encodedAr || "");
  if (p[0] && p[1] && typeof reciteVerse === "function") {
    reciteVerse(p[0], p[1], ar, 0.85);
  } else if (ar) {
    speak(ar, 0.82);
  }
}
function rateMosqueItem(key, g) {
  const it = MOSQUE_ITEMS.find(x => x.key === key);
  const wasVeiled = mosqueReviewMode !== "all" && !MOSQUE_REVEALED.has(key);
  MOSQUE_REVEALED.add(key);
  let nc = null;
  if (it && window.Practice && typeof Practice.syncVerdict === "function") {
    const tokens = String(it.ar || "").trim().split(/\s+/).filter(Boolean);
    const res = Practice.syncVerdict({
      item: {
        key: it.key,
        kind: tokens.length >= 2 ? "sentence" : "word",
        ar: it.ar,
        en: it.en,
        tr: it.tr,
        src: "everyday",
        words: tokens.map(w => [w])
      },
      key,
      grade: g,
      srsApi: SRS,
      getSrs,
      store,
      logEvent,
      normalizeAr,
      wordKeyFor: ar => (typeof _wordKeyFor === "function" && ar) ? _wordKeyFor(normalizeAr(ar).replace(/^ال/, "")) : null,
      via: "quran-mosque"
    });
    nc = res ? res.nc : SRS.rate(key, g);
  } else {
    nc = SRS.rate(key, g);
    logEvent({ e: "sentence-rate", key, g, box: nc.box, src: "quran-mosque", t: Date.now() });
  }
  autoSync();
  const domId = "mosq-" + key.replace(/[^a-zA-Z0-9_-]/g, "_");
  const card = document.getElementById(domId);
  if (wasVeiled) renderMosqueTab();
  else if (card) SRS.paintBar(card, key, nc);
  refreshEngineStrip();
}

function renderMosqueTab() {
  const body = document.getElementById("qTabBody");
  if (!body) return;
  const srs = getSrs();
  const now = Date.now();
  const m = computeEngineMetrics();
  const dotMap = { red: 0, grey: 1, amber: 2, green: 3 };

  let rows = MOSQUE_ITEMS.slice();
  if (mosqueSubFilter !== "all") rows = rows.filter(x => x.sub === mosqueSubFilter);
  if (mosqueDotFilter !== "all") rows = rows.filter(x => SRS.masteryState(x.key, { srs, now }).level === mosqueDotFilter);
  const q = mosqueSearch.trim().toLowerCase();
  if (q) {
    const qNorm = normalizeAr(q);
    rows = rows.filter(x =>
      x.en.toLowerCase().includes(q) ||
      x.tr.toLowerCase().includes(q) ||
      (x.note && x.note.toLowerCase().includes(q)) ||
      (qNorm && normalizeAr(x.ar).includes(qNorm)) ||
      x.ar.includes(q)
    );
  }
  if (mosqueSortWeakest) {
    if (!mosqueFrozenKeys) {
      const sorted = rows.slice().sort((a, b) => {
        const sa = SRS.masteryState(a.key, { srs, now }).level;
        const sb = SRS.masteryState(b.key, { srs, now }).level;
        return (dotMap[sa] ?? 1) - (dotMap[sb] ?? 1) || a.order - b.order;
      });
      mosqueFrozenKeys = sorted.map(x => x.key);
    }
    const orderIdx = new Map(mosqueFrozenKeys.map((k, i) => [k, i]));
    rows.sort((a, b) => (orderIdx.has(a.key) ? orderIdx.get(a.key) : 9999) - (orderIdx.has(b.key) ? orderIdx.get(b.key) : 9999));
  }

  const practiceHref = `index.html?qpillar=mosque&sub=${encodeURIComponent(mosqueSubFilter)}${mosqueDotFilter !== "all" ? "&dot=" + encodeURIComponent(mosqueDotFilter) : ""}`;
  const cardsHtml = MCARDS.map(c => {
    const key = "lc:" + c.id;
    const cardBody = window.LessonCards ? LessonCards.renderBodyHtml(c, {}) : `<p>${c.summary || ""}</p>`;
    return `
      <div class="card" id="lc-${c.id}" style="padding:14px 16px;margin-bottom:14px">
        <div id="qstruct-${c.id}">
          <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:8px">
            <span style="display:inline-flex;align-items:center;gap:8px">
              ${SRS.dotHtml(key, { lg: true })}
              <strong style="font-size:15.5px">${c.icon || "🕌"} ${c.title}</strong>
            </span>
            <div style="display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap">
              ${SRS.rateBarHtml(key, "rateQuranStructure", [c.id], { compact: true, noDot: true, retire: false })}
              <a href="index.html?lc=${encodeURIComponent(c.id)}" class="q-chip active" style="text-decoration:none">⚡ Practise →</a>
            </div>
          </div>
          ${cardBody}
        </div>
      </div>
    `;
  }).join("");

  const khutbaCnt = MOSQUE_ITEMS.filter(x => x.sub === "khutba").length;
  const duasCnt = MOSQUE_ITEMS.filter(x => x.sub === "duas").length;
  const imamCnt = MOSQUE_ITEMS.filter(x => x.sub === "imam").length;

  body.innerHTML = `
    <div class="q-toolbar">
      <div style="font-size:13px">
        <b>Layer 5 · Friday Khutbah, Common Du'ās &amp; What the Imam Says</b> — <b>${m.mosqueHeldCount}/${MOSQUE_ITEMS.length}</b> cues held · Practice weaves these in daily (with an extra Jumu'ah boost on Thursdays &amp; Fridays).
        <div style="font-size:11.5px;color:var(--muted);margin-top:2px">Verdicts here sync live across Practice, Commute, Sets, Words &amp; Sentences.</div>
      </div>
      <a href="${practiceHref}" class="q-chip" style="text-decoration:none;font-weight:500;color:var(--accent);border-color:var(--accent);padding:4px 10px;font-size:12.5px">⚡ Practise Filtered in Practice →</a>
    </div>
    ${cardsHtml}
    <div class="calm-row" style="padding-bottom:10px;border-bottom:1px solid var(--border)">
      <input type="text" id="qMosqueSearch" value="${mosqueSearch.replace(/"/g, "&quot;")}" placeholder="🔍 Search khutbah, du'ā, or imam cue…" style="padding:6px 10px;border:1px solid var(--border);border-radius:var(--radius);font-size:13px;min-width:210px;background:var(--paper-elevated);color:var(--ink)">
      <div class="q-chips">
        <button type="button" class="q-chip ${mosqueReviewMode === 'all' ? 'active' : ''}" onclick="setMosqueReviewMode('all')">All</button>
        <button type="button" class="q-chip ${mosqueReviewMode === 'ar-only' ? 'active' : ''}" onclick="setMosqueReviewMode('ar-only')">🇸🇦 By Ear</button>
        <button type="button" class="q-chip ${mosqueReviewMode === 'en-only' ? 'active' : ''}" onclick="setMosqueReviewMode('en-only')">🇬🇧 EN → AR</button>
      </div>
      <details class="more"><summary>Filter &amp; Tools</summary><div class="more-body">
        <div class="q-chips" style="width:100%">
          <button type="button" class="q-chip ${mosqueSubFilter === 'all' ? 'active' : ''}" onclick="setMosqueSub('all')">All (${MOSQUE_ITEMS.length})</button>
          <button type="button" class="q-chip ${mosqueSubFilter === 'khutba' ? 'active' : ''}" onclick="setMosqueSub('khutba')">🕌 Friday Khutbah (${khutbaCnt})</button>
          <button type="button" class="q-chip ${mosqueSubFilter === 'duas' ? 'active' : ''}" onclick="setMosqueSub('duas')">🤲 Common Du'ās (${duasCnt})</button>
          <button type="button" class="q-chip ${mosqueSubFilter === 'imam' ? 'active' : ''}" onclick="setMosqueSub('imam')">📢 Imam Says (${imamCnt})</button>
        </div>
        <div class="q-chips">
          <button type="button" class="q-chip ${mosqueDotFilter === 'all' ? 'active' : ''}" onclick="setMosqueDotFilter('all')">All Dots</button>
          <button type="button" class="q-chip ${mosqueDotFilter === 'green' ? 'active' : ''}" onclick="setMosqueDotFilter('green')"><span class="m-dot m-green sm"></span> ${m.mosqueCounts.green}</button>
          <button type="button" class="q-chip ${mosqueDotFilter === 'amber' ? 'active' : ''}" onclick="setMosqueDotFilter('amber')"><span class="m-dot m-amber sm"></span> ${m.mosqueCounts.amber}</button>
          <button type="button" class="q-chip ${mosqueDotFilter === 'red' ? 'active' : ''}" onclick="setMosqueDotFilter('red')"><span class="m-dot m-red sm"></span> ${m.mosqueCounts.red}</button>
          <button type="button" class="q-chip ${mosqueDotFilter === 'grey' ? 'active' : ''}" onclick="setMosqueDotFilter('grey')"><span class="m-dot m-grey sm"></span> ${m.mosqueCounts.grey}</button>
        </div>
        <button type="button" class="q-chip ${mosqueSortWeakest ? 'active' : ''}" onclick="toggleMosqueWeakest()">📉 Weakest First</button>
        ${mosqueSortWeakest ? `<button type="button" class="q-chip" onclick="resortMosqueItems()">↻ Re-sort</button>` : ""}
        <span style="font-size:12px;color:var(--muted)">Showing ${rows.length}</span>
      </div></details>
    </div>
    ${rows.length ? rows.map(it => {
      const rev = mosqueReviewMode === "all" || MOSQUE_REVEALED.has(it.key);
      const hideAr = mosqueReviewMode === "en-only" && !rev;
      const hideEn = mosqueReviewMode === "ar-only" && !rev;
      const domId = "mosq-" + it.key.replace(/[^a-zA-Z0-9_-]/g, "_");
      const encAr = encodeURIComponent(it.ar);
      return `
        <div class="q-ayah-card q-ayah-grid" id="${domId}">
          <div class="q-ayah-en-col">
            ${hideEn
              ? `<button type="button" class="q-reveal-btn" onclick="revealMosqueItem('${it.key}')">Show meaning →</button>`
              : `<div style="font-family:var(--font-ui);font-size:16px;font-weight:400;color:var(--ink);line-height:1.5">${it.en}</div>
                 ${it.note ? `<div class="q-ayah-sub">💡 ${it.note}</div>` : ""}`
            }
            <div class="q-ayah-sub">${it.subLabel}${it.ayahRef ? ` · Q ${it.ayahRef}` : ""}</div>
          </div>
          <div class="q-ayah-ar-col">
            ${hideAr
              ? `<button type="button" class="q-reveal-btn" onclick="revealMosqueItem('${it.key}', '${encAr}')">Show Arabic &amp; Speak →</button>`
              : `<div class="arabic" style="font-size:24px;line-height:1.65;text-align:right;color:var(--ink)" dir="rtl">${it.ar}</div>
                 ${it.tr ? `<div style="font-size:12px;color:var(--muted);font-style:italic;text-align:right">${it.tr}</div>` : ""}`
            }
          </div>
          <div class="q-ayah-dock">
            <button type="button" class="lc-speak-btn" onclick="speak(decodeURIComponent('${encAr}'), 0.85)" title="Play exact phrase audio">🔊</button>
            ${it.ayahRef ? `<button type="button" class="lc-speak-btn" onclick="reciteAyahRef('${it.ayahRef}', '${encAr}')" title="Listen to Mishary Rashid Alafasy recite full ayah (${it.ayahRef})">🎧 ${it.ayahRef}</button>` : ""}
            ${SRS.rateBarHtml(it.key, "rateMosqueItem", [], { compact: true, retire: false })}
          </div>
        </div>
      `;
    }).join("") : `
      <div class="card" style="text-align:center;padding:24px">
        <p style="margin:0">No mosque, khutbah, or du'ā items match this filter.</p>
      </div>
    `}
  `;

  const inp = document.getElementById("qMosqueSearch");
  if (inp) {
    inp.oninput = () => {
      const pos = inp.selectionStart || 0;
      mosqueSearch = inp.value;
      renderMosqueTab();
      const restored = document.getElementById("qMosqueSearch");
      if (restored) { restored.focus(); try { restored.setSelectionRange(pos, pos); } catch (_) {} }
    };
  }
}

function renderListenQueue() {
  trackPage("quran:listen-queue");
  const studied = DATA.filter(s => { const d = stepsDone("q-" + s.id); return d.study || d.test; });
  // Beginner on-ramp: with zero surahs studied, seed the ones everyone knows by heart
  // from salah. Real recitation of KNOWN text is the by-ear entry point — no prerequisites.
  const STARTER_IDS = ["fatiha", "ikhlas"];
  const isStarter = !studied.length;
  const queue = studied.length ? studied : DATA.filter(s => STARTER_IDS.includes(s.id));
  if (queue.length && typeof offlinePackQuran === "function") {
    offlinePackQuran(queue.map(s => s.id));
  }
  content.innerHTML = `
    <p><a href="quran.html" style="color:var(--accent);text-decoration:none">← All surahs</a></p>
    <h1>Listen queue <span class="arabic" style="color:var(--accent)">اِسْتَمِعْ وَافْهَمْ</span></h1>
    <p class="sub">${isStarter
      ? `Al-Fatiha and Al-Ikhlas — the surahs you already know by heart from salah. Just listen and let the meanings surface. No reading, no test.`
      : `Real recitation (Mishary Alafasy) of the surahs you've studied, back to back. You already know these words — let your ears catch up with your eyes.`} Good while walking, commuting, or before sleep.</p>
    ${queue.length ? `
    <div class="card">
      <div class="listen-controls" style="margin-bottom:10px">
        <button class="primary" id="qPlay">▶ Play my queue (${queue.length} surah${queue.length > 1 ? "s" : ""})</button>
        <button id="qStop">■ Stop</button>
      </div>
      <div id="qList"></div>
    </div>` : `
    <div class="card">
      <p style="margin:0">Nothing in your queue yet — the queue holds surahs you've <strong>studied</strong>, so every word you hear is one you know.
      <a href="quran.html" style="color:var(--accent)">Study your first surah</a> (Al-Fatiha takes ~10 minutes) and it appears here.</p>
    </div>`}
  `;
  if (!queue.length) return;
  const list = document.getElementById("qList");
  queue.forEach((s, i) => {
    const row = document.createElement("div");
    row.id = "q-row-" + i;
    row.style.cssText = "display:flex;justify-content:space-between;gap:8px;padding:8px 10px;border-bottom:1px dashed var(--border);border-radius:8px";
    row.innerHTML = `<span>${s.nameEn.split("—")[0].trim()} <span style="color:var(--muted);font-size:12px">· ${s.verses.length} verses${stepsDone("q-" + s.id).test ? " · ✓ tested" : ""}</span></span>
      <span class="arabic" style="color:var(--accent)" dir="rtl">${s.name}</span>`;
    list.appendChild(row);
  });
  const items = [];
  queue.forEach((s, qi) => s.verses.forEach(v => items.push({ n: s.n, ayah: parseInt(v.ref.split(":")[1]), qi, sid: s.id })));
  let lastSurah = null;
  document.getElementById("qPlay").onclick = () => {
    logEvent({ e: "listen-click", title: "Listen queue" });
    playRecitation(items,
      it => {
        if (it.qi !== lastSurah) {
          if (lastSurah !== null) logEvent({ e: "rlisten", surah: items.find(x => x.qi === lastSurah).sid });
          lastSurah = it.qi;
        }
        queue.forEach((s, i) => { document.getElementById("q-row-" + i).style.background = i === it.qi ? "var(--accent-soft)" : ""; });
      },
      err => {
        queue.forEach((s, i) => { document.getElementById("q-row-" + i).style.background = ""; });
        if (!err && lastSurah !== null) logEvent({ e: "rlisten", surah: queue[lastSurah].id });
        lastSurah = null;
        if (err === "audio-failed") alert("Recitation audio didn't load — check your connection (it streams from everyayah.com).");
        autoSync();
      });
  };
  document.getElementById("qStop").onclick = () => {
    stopRecitation();
    queue.forEach((s, i) => { document.getElementById("q-row-" + i).style.background = ""; });
  };
}

/* Cold listen: the test that can't lie. Real recitation, NO text — pick the
   meaning of each verse. Passing this is what "understand as recited" means. */
function renderListenTest(s) {
  trackPage(`quran:${s.id}:listen`);
  window.scrollTo({ top: 0 });
  const allEn = DATA.flatMap(x => x.verses.map(v => v.en)).filter(Boolean);
  const order = s.verses.map((v, i) => i); // recitation order — it's a listening test, not a shuffle quiz
  let pos = 0, right = 0;
  content.innerHTML = `
    <p><a href="quran.html" style="color:var(--accent);text-decoration:none">← All surahs</a> ·
       <a href="#" id="backSurah" style="color:var(--accent);text-decoration:none">↩ ${s.nameEn.split("—")[0].trim()} lesson</a></p>
    <h1 style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px">
      <span>Cold listen 🎧</span>
      <span class="arabic" style="color:var(--ink)" dir="rtl">سُورَة ${s.name}</span>
    </h1>
    <p class="sub">No text. You hear each verse recited for real and pick its meaning. 85% certifies the surah as <strong>understood by ear</strong> — the actual goal, measured honestly.</p>
    <div class="card"><div class="drill-stage" id="clStage" style="text-align:center;padding:18px 0"></div></div>
  `;
  document.getElementById("backSurah").onclick = (e) => { e.preventDefault(); renderSurah(s, "study"); };
  const stage = document.getElementById("clStage");
  function ask() {
    if (pos >= order.length) return finish();
    const vi = order[pos];
    const v = s.verses[vi];
    const distractors = allEn.filter(e => e !== v.en).sort(() => 0.5 - Math.random()).slice(0, 3);
    const opts = [v.en, ...distractors].sort(() => 0.5 - Math.random());
    stage.innerHTML = `
      <div style="font-size:12px;color:var(--muted)">verse ${pos + 1} / ${order.length}</div>
      <button class="primary" id="clPlay" style="font-size:17px;margin:12px 0">🔊 Play the verse</button>
      <div id="clOpts" style="display:flex;flex-direction:column;gap:8px;max-width:560px;margin:0 auto">
        ${opts.map((o, i) => `<button data-i="${i}" style="text-align:left;padding:10px 14px;line-height:1.5">${o}</button>`).join("")}
      </div>
      <div class="drill-fb" id="clFb" style="min-height:52px;margin-top:12px;font-size:15px"></div>
    `;
    const playVerse = () => playRecitation([{ n: s.n, ayah: parseInt(v.ref.split(":")[1]) }], null, err => {
      if (err) document.getElementById("clFb").innerHTML = `<span style="color:var(--red);font-size:13px">Recitation needs a connection — it streams from everyayah.com.</span>`;
    });
    document.getElementById("clPlay").onclick = playVerse;
    playVerse();
    document.querySelectorAll("#clOpts button").forEach(b => b.onclick = () => {
      const ok = opts[+b.dataset.i] === v.en;
      if (ok) right++;
      logEvent({ e: "qlisten-q", surah: s.id, ref: v.ref, ok });
      if (window.SRS && SRS.rate) {
        SRS.rate(`s:q:${s.id}:${vi + 1}`, ok ? "yes" : "no");
        if (Array.isArray(v.words)) {
          const srsNow = typeof getSrs === "function" ? getSrs() : {};
          v.words.forEach((_, wi) => {
            const wk = `qw:${s.id}:${vi}:${wi}`;
            if (ok || (srsNow[wk] && srsNow[wk].u)) SRS.rate(wk, ok ? "yes" : "no");
          });
        }
      }
      document.querySelectorAll("#clOpts button").forEach(x => {
        x.disabled = true;
        if (opts[+x.dataset.i] === v.en) { x.style.borderColor = "var(--accent)"; x.style.background = "var(--accent-soft)"; }
      });
      if (!ok) { b.style.borderColor = "var(--red)"; b.style.background = "var(--red-soft)"; }
      document.getElementById("clFb").innerHTML = `${ok ? '<span style="color:var(--accent);font-weight:700">✓</span>' : '<span style="color:var(--red);font-weight:700">✗</span>'}
        <span class="arabic" style="font-size:22px" dir="rtl">${v.ar}</span>`;
      pos++;
      setTimeout(ask, ok ? 1400 : 3000);
    });
  }
  function finish() {
    stopRecitation();
    const total = order.length;
    const pass = right >= Math.ceil(total * 0.85);
    if (pass) setStepDone("q-" + s.id, "listen");
    logEvent({ e: "qlisten-test", surah: s.id, score: right, total, pass });
    autoSync();
    stage.innerHTML = `
      <div style="font-size:22px;font-weight:700">${right} / ${total} ${pass ? "— 🎧 certified by ear! ما شاء الله" : ""}</div>
      ${pass
        ? `<p style="font-size:14px;color:var(--muted)">You understood ${s.nameEn.split("—")[0].trim()} as it was recited — no text, no help. That's the real goal, measured.</p>`
        : `<p style="font-size:14px;color:var(--muted)">85% passes. Re-study the words, add it to your <a href="quran.html?listen=1" style="color:var(--accent)">Listen queue</a> for a few plays, and come back.</p>`}
      <div class="ex-row" style="justify-content:center;margin-top:10px">
        <button class="primary" id="clAgain">Try again</button>
        <button id="clBack">Back to the lesson</button>
      </div>
    `;
    document.getElementById("clAgain").onclick = () => renderListenTest(s);
    document.getElementById("clBack").onclick = () => renderSurah(s, "study");
  }
  ask();
}

function renderSurah(s, mode) {
  trackPage(`quran:${s.id}:${mode}`);
  window.scrollTo({ top: 0 });
  content.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:6px">
      <a href="quran.html" style="color:var(--accent);text-decoration:none">← All surahs</a>
      <a href="index.html?surah=${encodeURIComponent(s.id)}" style="background:var(--paper-elevated);color:var(--accent);border:1px solid var(--accent);text-decoration:none;font-weight:500;border-radius:var(--radius);padding:4px 10px;font-size:13px" title="Practise this Surah's Alafasy ayahs &amp; word-by-word meanings dynamically in Practice">⚡ Practise Surah in Practice →</a>
    </div>
    <h1 style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px">
      <span>${s.nameEn}</span>
      <span class="arabic" style="color:var(--ink)" dir="rtl">سُورَة ${s.name}</span>
    </h1>
    <p class="sub">${s.why}${s.n ? ` · <a href="https://rkarim25.github.io/Quran/#/${s.n}" target="_blank" style="color:var(--accent)">Read with tafsir on your Quran site ↗</a>` : ""}</p>
    <div class="steps" style="max-width:560px">
      <button id="mStudy" class="${mode === "study" ? "active" : ""}${surahDone(s.id, "study") ? " done" : ""}"><span class="ar">اُدْرُسْ</span><span>Study</span></button>
      <button id="mTest" class="${mode === "test" ? "active" : ""}${surahDone(s.id, "test") ? " done" : ""}"><span class="ar">اِخْتَبِرْ</span><span>Test meanings</span></button>
      <button id="mListen" class="${surahDone(s.id, "listen") ? "done" : ""}"><span class="ar">اِسْتَمِعْ</span><span>🎧 Cold listen</span></button>
    </div>
    <div class="card">
      <div class="listen-controls" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px">
        <button class="primary" id="playRec" style="padding:6px 14px;font-size:13.5px">▶ Real recitation</button>
        <button id="stopBtn" style="display:none;padding:6px 12px;font-size:13px">⏹ Stop</button>
        <button type="button" class="q-speed-pill" id="rateToggle" title="Toggle recitation speed">⚡ ${(store.get("ats-speed") === "slow") ? "0.75x" : "1.0x"}</button>
        <span class="q-offline-pill" id="qOfflineBadge" title="Offline audio status">📥 Checking offline…</span>
        <input type="hidden" id="rate" value="${(store.get('ats-speed') === 'slow') ? 0.75 : 1.0}">
      </div>
      <div id="verses"></div>
      ${mode === "test" ? `<div class="ex-row" style="margin-top:14px"><button class="primary" id="checkAll">✓ Check my answers</button></div><div class="quiz-score" id="score"></div>` : `<div class="ex-row" style="margin-top:14px"><button class="primary" id="toTest">I know these — test me →</button></div>`}
    </div>
  `;
  document.getElementById("mStudy").onclick = () => renderSurah(s, "study");
  document.getElementById("mTest").onclick = () => renderSurah(s, "test");
  document.getElementById("mListen").onclick = () => renderListenTest(s);
  const rate = () => ((store.get("ats-speed") === "slow") ? 0.75 : 1.0);
  const rateToggle = document.getElementById("rateToggle");
  const rateInput = document.getElementById("rate");
  if (rateToggle) {
    rateToggle.onclick = () => {
      const cur = store.get("ats-speed") || "normal";
      const nxt = cur === "slow" ? "normal" : "slow";
      store.set("ats-speed", nxt);
      if (_recAudio) _recAudio.playbackRate = _speedMul();
      const val = nxt === "slow" ? 0.75 : 1.0;
      if (rateInput) rateInput.value = val;
      rateToggle.textContent = `⚡ ${val}x`;
    };
  }

  // Preload this surah for offline listening
  if (typeof getQuranOfflineStatus === "function") {
    const badge = document.getElementById("qOfflineBadge");
    getQuranOfflineStatus(s.id).then(st => {
      if (!badge) return;
      if (st.isReady) {
        badge.className = "q-offline-pill ready";
        badge.textContent = "✓ Saved offline";
      } else {
        badge.textContent = `📥 ${st.cached}/${st.total} offline`;
        if (navigator.onLine && typeof offlinePackQuran === "function") {
          offlinePackQuran([s.id], (n, total) => {
            if (badge) badge.textContent = `📥 Saving ${n}/${total}…`;
          }).then(r => {
            if (badge && r.n === r.total) {
              badge.className = "q-offline-pill ready";
              badge.textContent = "✓ Saved offline";
            }
          });
        }
      }
    });
  }

  const versesEl = document.getElementById("verses");
  loadQuranWordAudio(); // real qari clips for word taps (idempotent)
  const esc = t => String(t).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
  s.verses.forEach((v, vi) => {
    const block = document.createElement("div");
    block.className = "verse-block";
    block.id = "vblock-" + vi;
    // each verse word is hoverable (meaning tooltip, study mode) and tappable
    // (speak + the universal meaning/Learn popover; data-qkey → proper SRS card)
    const arHtml = v.words.map((w, wi) =>
      `<span class="vw" data-qkey="qw:${s.id}:${vi}:${wi}"${mode === "study" ? ` data-tip="${esc(w[2])}"` : ""}>${w[0]}</span>`).join(" ");
    block.innerHTML = `
      <div class="verse-ref" style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
        <span style="display:inline-flex;align-items:center;gap:7px">${SRS.dotHtml(`s:q:${s.id}:${vi + 1}`, { lg: true })}<span>${v.ref}</span></span>
        ${mode === "study" ? SRS.rateBarHtml(`s:q:${s.id}:${vi + 1}`, "rateSurahAyah", [s.id, vi], { compact: true, noDot: true, retire: false }) : ""}
      </div>
      <div class="verse-ar"${mode === "test" ? " data-nopeek" : ""}>${arHtml} <span class="sent-play">🔊</span></div>
      <div class="verse-en" style="display:${mode === "study" ? "block" : "none"}">${v.en}</div>
      <table class="wbw"><tbody></tbody></table>
      ${mode === "test" ? `<div class="ex-row" style="margin-top:6px"><button class="vcheck" data-vi="${vi}" style="font-size:13px;padding:6px 14px">✓ Check this verse</button><span class="vscore" style="font-weight:600"></span></div>` : ""}
    `;
    block.querySelector(".sent-play").onclick = () => reciteVerse(s.n, parseInt(v.ref.split(":")[1]), v.ar, rate());
    block.querySelectorAll(".vw").forEach((el, wi) => el.onclick = () => {
      speakQuranWord(s.id, vi, wi, v.words[wi][0], 0.75);
      logEvent({ e: "qtap", surah: s.id, ref: v.ref, w: wi, src: "verse" });
      noteWordTap({ key: `qw:${s.id}:${vi}:${wi}` }); // 3 taps → joins the Review deck
    });
    const tbody = block.querySelector("tbody");
    v.words.forEach((word, wi) => {
      const [ar, tr, en, grammar, root, aiMeaning] = word;
      const row = document.createElement("tr");
      row.id = `wrow-${vi}-${wi}`;
      const gBtn = grammar ? `<span class="g-btn" title="grammar note">ⓘ نحو</span>` : "";
      if (mode === "study") {
        // aiMeaning = the concept-level AI translation from Reza's Quran site (scripts/import-ai-wbw.js)
        const ai = aiMeaning ? `<div class="w-ai">${aiMeaning}</div>` : "";
        const wBar = SRS.rateBarHtml(`qw:${s.id}:${vi}:${wi}`, "rateSurahWord", [s.id, vi, wi], { compact: true, noDot: true, retire: false });
        row.innerHTML = `<td class="w-ar" data-qkey="qw:${s.id}:${vi}:${wi}"><span style="display:inline-flex;align-items:center;gap:7px">${SRS.dotHtml(`qw:${s.id}:${vi}:${wi}`)}<span>${ar}</span></span></td><td class="w-tr">${tr}</td><td class="w-en"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap"><span>${en} ${gBtn}</span>${wBar}</div>${ai}</td>`;
      } else {
        row.innerHTML = `<td class="w-ar" data-qkey="qw:${s.id}:${vi}:${wi}"><span style="display:inline-flex;align-items:center;gap:7px">${SRS.dotHtml(`qw:${s.id}:${vi}:${wi}`)}<span>${ar}</span></span></td><td class="w-tr">${tr}</td><td class="w-en"><input placeholder="meaning..." data-v="${vi}" data-w="${wi}" autocomplete="off"><span class="true-en" style="display:none"></span></td>`;
      }
      row.querySelector(".w-ar").onclick = () => {
        speakQuranWord(s.id, vi, wi, ar, 0.75);
        logEvent({ e: "qtap", surah: s.id, ref: v.ref, w: wi });
        noteWordTap({ key: `qw:${s.id}:${vi}:${wi}` }); // 3 taps → joins the Review deck
      };
      tbody.appendChild(row);
      if (grammar && mode === "study") {
        const gRow = document.createElement("tr");
        gRow.className = "g-row";
        gRow.style.display = "none";
        gRow.innerHTML = `<td colspan="3">${grammar}${root ? `<span class="g-root">root: ${root}</span>` : ""}<span class="g-fam" style="display:block;margin-top:8px;font-size:13px"></span></td>`;
        tbody.appendChild(gRow);
        row.querySelector(".g-btn").onclick = (e) => {
          e.stopPropagation();
          const opening = gRow.style.display === "none";
          gRow.style.display = opening ? "table-row" : "none";
          if (opening) {
            const fam = root && FAM_BY_ROOT[rootKey(root)];
            const famEl = gRow.querySelector(".g-fam");
            if (fam && famEl && !famEl.innerHTML) {
              famEl.innerHTML = `<span style="color:var(--amber);font-weight:600">Same root (${fam.root}) — words you can build:</span> `
                + fam.members.map(m => `<span style="white-space:nowrap"><span class="arabic" style="font-size:17px">${m.ar}</span> <span style="color:var(--muted);font-size:12px">${m.en}</span></span>`).join(" &nbsp;·&nbsp; ")
                + ` &nbsp;<a href="vocab.html" style="color:var(--accent)">practise this family →</a>`;
            }
            logEvent({ e: "gview", surah: s.id, ref: v.ref, w: wi });
          }
        };
      }
    });
    versesEl.appendChild(block);
  });

  document.getElementById("playRec").onclick = () => {
    const stopBtn = document.getElementById("stopBtn");
    if (stopBtn) stopBtn.style.display = "inline-flex";
    const blocks = versesEl.querySelectorAll(".verse-block");
    const items = s.verses.map(v => ({ n: s.n, ayah: parseInt(v.ref.split(":")[1]) }));
    playRecitation(items,
      (it, i) => {
        blocks.forEach(b => b.style.background = "");
        if (blocks[i]) { blocks[i].style.background = "var(--accent-soft)"; blocks[i].scrollIntoView({ block: "center", behavior: "smooth" }); }
      },
      err => {
        blocks.forEach(b => b.style.background = "");
        if (stopBtn) stopBtn.style.display = "none";
        if (!err) logEvent({ e: "rlisten", surah: s.id });
        else if (err === "audio-failed") alert("Recitation audio didn't load — check your connection (it streams from everyayah.com).");
      });
  };
  document.getElementById("stopBtn").onclick = () => {
    stopSpeak();
    stopRecitation();
    const stopBtn = document.getElementById("stopBtn");
    if (stopBtn) stopBtn.style.display = "none";
  };

  if (mode === "study") {
    document.getElementById("toTest").onclick = () => {
      setStepDone("q-" + s.id, "study");
      renderSurah(s, "test");
    };
  } else {
    // verse-by-verse checking: partial work earns real credit even if he stops early.
    // Each verse grades ONCE (inputs lock) so re-checking can't inflate the score.
    const verseResults = {};
    const gradeVerse = (vi) => {
      if (verseResults[vi]) return verseResults[vi];
      const v = s.verses[vi];
      let right = 0, total = 0;
      v.words.forEach(([ar, tr, en, _gr, _rt, aiMeaning], wi) => {
        total++;
        const input = versesEl.querySelector(`input[data-v="${vi}"][data-w="${wi}"]`);
        const trueEn = input.nextElementSibling;
        const aiLead = aiMeaning ? String(aiMeaning).split(/\s*[—–]\s*/)[0].trim() : "";
        const targetGloss = aiLead ? `${en} ; ${aiLead}` : en;
        const ok = fuzzyEn(input.value, targetGloss);
        input.classList.remove("ok", "no");
        input.classList.add(ok ? "ok" : "no");
        input.disabled = true;
        trueEn.style.display = ok ? "none" : "block";
        trueEn.textContent = en;
        if (ok) right++;
        logEvent({ e: "qfill", surah: s.id, ref: v.ref, w: wi, ar: stripTashkeel(ar), typed: input.value, ok });
        gradeCard(`qw:${s.id}:${vi}:${wi}`, ok ? "good" : "again");
      });
      if (window.SRS && SRS.rate && total > 0) {
        SRS.rate(`s:q:${s.id}:${vi + 1}`, right === total ? "yes" : right >= Math.ceil(total * 0.6) ? "maybe" : "no");
      }
      verseResults[vi] = { right, total };
      const btn = versesEl.querySelector(`.vcheck[data-vi="${vi}"]`);
      if (btn) {
        btn.style.display = "none";
        const chip = btn.parentElement.querySelector(".vscore");
        chip.textContent = `${right}/${total}${right === total ? " ✓" : ""}`;
        chip.style.color = right === total ? "var(--accent)" : "var(--amber)";
      }
      return verseResults[vi];
    };
    const updateScore = () => {
      const vis = Object.keys(verseResults);
      const right = vis.reduce((a, vi) => a + verseResults[vi].right, 0);
      const total = vis.reduce((a, vi) => a + verseResults[vi].total, 0);
      const scoreEl = document.getElementById("score");
      if (vis.length === s.verses.length) {
        scoreEl.textContent = `Score: ${right} / ${total}` + (right === total ? " — ما شاء الله! 🎉" : " — missed words go to your Review deck.");
        setStepDone("q-" + s.id, "test");
        logEvent({ e: "qtest-done", surah: s.id, score: right, total });
      } else {
        scoreEl.textContent = `${vis.length} of ${s.verses.length} verses checked — ${right}/${total} so far. Every checked verse counts, even if you stop here.`;
        logEvent({ e: "qtest-part", surah: s.id, done: vis.length, verses: s.verses.length, score: right, total });
      }
      autoSync();
    };
    versesEl.querySelectorAll(".vcheck").forEach(btn => btn.onclick = () => {
      gradeVerse(+btn.dataset.vi);
      updateScore();
    });
    document.getElementById("checkAll").onclick = () => {
      s.verses.forEach((v, vi) => gradeVerse(vi));
      updateScore();
    };
  }
}
</script>
</body>
</html>
