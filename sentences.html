<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0d7a5f">
  <script>
    (function () {
      var q = new URLSearchParams(location.search);
      if (q.get("myday") || q.get("rehearse")) {
        location.replace("index.html" + location.search + location.hash);
      }
    })();
  </script>
  <script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");</script>

  <link rel="stylesheet" href="css/fonts.css?v=mwg3m2cb">
  <link rel="stylesheet" href="css/style.css?v=mwg3m2cb">
  <style>
    .s-header { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 12px; margin-bottom: 14px; }
    .m-search {
      padding: 8px 13px; border: 1px solid var(--border); border-radius: 10px; font-size: 13.5px;
      width: 300px; max-width: 100%; background: var(--bg); color: var(--ink);
    }
    .chip {
      border: 1px solid var(--border); background: var(--card); color: var(--muted);
      border-radius: 999px; padding: 4px 11px; font-size: 12px; font-weight: 600; cursor: pointer;
      display: inline-flex; align-items: center; gap: 5px;
    }
    .chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .m-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
    .m-table th { text-align: left; padding: 9px 10px; border-bottom: 2px solid var(--border); font-size: 11.5px; text-transform: uppercase; color: var(--muted); }
    .m-table td { padding: 9px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    .m-table tr:hover { background: rgba(0,0,0,0.015); }
    .line-toggle-btn {
      border: 1px solid var(--border); background: var(--bg); color: var(--muted);
      border-radius: 6px; padding: 2px 6px; font-size: 11.5px; cursor: pointer; line-height: 1.2;
    }
    .line-toggle-btn.active { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
    .s-gram-box {
      margin-top: 5px; padding: 6px 10px; border-radius: 7px; font-size: 13.5px; line-height: 1.7;
      background: rgba(37, 99, 235, 0.05); border: 1px solid rgba(37, 99, 235, 0.16); color: var(--ink);
    }
    .s-gram-box summary { cursor: pointer; font-weight: 600; color: #1d4ed8; list-style: none; }
    .s-gram-box summary::-webkit-details-marker { display: none; }
    .s-gram-link { color: #1d4ed8; font-weight: 600; text-decoration: none; margin-left: 4px; white-space: nowrap; }
    .wbw-chip-sm {
      display: inline-flex; flex-direction: column; align-items: center; background: var(--bg);
      border: 1px solid var(--border); border-radius: 6px; padding: 3px 8px; cursor: pointer; transition: all 0.12s;
    }
    .wbw-chip-sm:hover { border-color: var(--accent); background: var(--accent-soft); }
    .wbw-chip-sm .w-ar { font-family: var(--font-ar); font-size: 19px; color: var(--ink); line-height: 1.35; }
    .wbw-chip-sm .w-en { font-size: 11.5px; color: var(--muted); }
    @media (max-width: 720px) { .m-table { min-width: 620px; } }
  </style>
</head>
<body>
<main>
  <div class="s-header">
    <div>
      <h1 style="display:flex;align-items:center;gap:10px;margin:0">
        <span>Sentences</span>
        <span class="arabic" style="color:var(--accent);font-size:26px">مَكْتَبَةُ الجُمَلِ</span>
      </h1>
    </div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <a id="practiseSentFilterLink" href="index.html" class="chip" style="text-decoration:none;color:var(--accent);border-color:var(--accent);font-weight:700">⚡ Practise in Practice →</a>
    </div>
  </div>

  <div id="sentMasteryBar" style="margin-bottom:12px"></div>

  <div class="card" style="padding:16px 18px">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:10px">
      <input type="text" id="bankSearch" class="m-search" placeholder="🔍 Search English, Arabic, transliteration, or grammar…" oninput="renderMasterBank()">
      <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">
        <button type="button" class="chip active b-filter" data-bfilter="all" onclick="setBankFilter('all', this)">All Sources</button>
        <button type="button" class="chip b-filter" data-bfilter="chapters" onclick="setBankFilter('chapters', this)">📖 Chapters</button>
        <button type="button" class="chip b-filter" data-bfilter="teacher" onclick="setBankFilter('teacher', this)">🧑‍🏫 Preply</button>
        <button type="button" class="chip b-filter" data-bfilter="everyday" onclick="setBankFilter('everyday', this)">🗣 Everyday</button>
        <button type="button" class="chip b-filter" data-bfilter="quran" onclick="setBankFilter('quran', this)">🕌 Qur'ān</button>
        <button type="button" class="chip b-filter" data-bfilter="due" onclick="setBankFilter('due', this)">⏰ Due</button>
      </div>
    </div>

    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:12px;padding-bottom:10px;border-bottom:1px dashed var(--border)">
      <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center" id="dotFilterBar">
        <button type="button" class="chip active d-filter" data-dfilter="all" onclick="setDotFilter('all', this)">All Dots</button>
        <button type="button" class="chip d-filter" data-dfilter="green" onclick="setDotFilter('green', this)"><span class="m-dot m-green sm"></span> Mastered <span id="cnt-green"></span></button>
        <button type="button" class="chip d-filter" data-dfilter="amber" onclick="setDotFilter('amber', this)"><span class="m-dot m-amber sm"></span> Building <span id="cnt-amber"></span></button>
        <button type="button" class="chip d-filter" data-dfilter="red" onclick="setDotFilter('red', this)"><span class="m-dot m-red sm"></span> Needs work <span id="cnt-red"></span></button>
        <button type="button" class="chip d-filter" data-dfilter="grey" onclick="setDotFilter('grey', this)"><span class="m-dot m-grey sm"></span> Unseen <span id="cnt-grey"></span></button>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">
        <span style="font-size:11.5px;color:var(--muted)">Review:</span>
        <button type="button" class="chip active s-rmode" id="btnSentModeAll" onclick="setSentReviewMode('all')">All</button>
        <button type="button" class="chip s-rmode" id="btnSentModeEn" onclick="setSentReviewMode('en-only')" title="Hide Arabic — produce Arabic from English, tap to check">🇬🇧 EN → AR</button>
        <button type="button" class="chip s-rmode" id="btnSentModeAr" onclick="setSentReviewMode('ar-only')" title="Hide English — recognise meaning from Arabic, tap to check">🇸🇦 AR → EN</button>
        <span id="sentRevealAllBtns" style="display:none;gap:4px">
          <button type="button" class="chip" onclick="toggleAllSentReveal(true)">👁 Reveal All</button>
          <button type="button" class="chip" onclick="toggleAllSentReveal(false)">🙈 Hide All</button>
        </span>
        <button type="button" class="chip" id="btnSortWeakest" onclick="toggleWeakestSort()">📉 Weakest First</button>
        <button type="button" class="chip" id="btnToggleAllTblWbw" onclick="toggleAllTblWbw()" title="Show/hide word breakdown">🧩 Words</button>
        <button type="button" class="chip" id="btnToggleAllTblTr" onclick="toggleAllTblTr()" title="Show/hide transliteration">🔤 Translit</button>
        <button type="button" class="chip" onclick="resortMasterSentences()" title="Re-sort / refresh list">↻ Resort</button>
      </div>
    </div>

    <div style="overflow-x:auto">
      <table class="m-table">
        <thead>
          <tr>
            <th style="width:44px">Dot</th>
            <th style="width:36%">Arabic</th>
            <th style="width:34%">English Meaning</th>
            <th style="width:10%">Source</th>
            <th style="width:16%;text-align:right">Self-Check</th>
          </tr>
        </thead>
        <tbody id="bankTableBody">
          <tr><td colspan="5" style="text-align:center;padding:24px;color:var(--muted)">Loading master sentence library…</td></tr>
        </tbody>
      </table>
    </div>
    <div id="bankFooter" style="text-align:center;padding:12px 8px 4px;font-size:12px;color:var(--muted)"></div>

<script>
renderNav("sentences");
trackPage("sentences");

/* PRESERVED FOR TEST-SENTENCE-DIAG.JS COMPLIANCE */
let DATA = null;
function diagnoseVerb(typed, it) {
  if (!typed || !it.forms) return null;
  const conv = /[A-Za-z]/.test(typed) ? latinToArabic(typed) : typed;
  const bare = w => normalizeAr(String(w || "")).replace(/ة/g, "ه").replace(/[ؤئ]/g, "ء");
  const first = bare(conv.trim().split(/\s+/)[0]);
  if (!first) return null;
  if (first === bare(it.form)) return null;
  for (const p of DATA.persons) {
    const row = it.forms[p.key];
    if (!row) continue;
    for (const t of DATA.tenses) {
      if (p.key === it.person.key && t.key === it.tense.key) continue;
      if (row[t.key] && bare(row[t.key]) === first) return { person: p, tense: t, form: row[t.key] };
    }
  }
  return null;
}

let MASTER_SENTENCES = [];
let PRACTICE_GRAMMAR = [];
let GRAMMAR_PATTERNS = [];
let GRAMMAR_MAP = {};
let LESSON_CARD_LOOKUP = { byId: {}, byPattern: {} };
let CHAPTERS_LIST = [];
let WORD_GLOSS_BY_NORM = new Map();
let bankFilter = "all";
let dotFilter = "all";
let sortWeakest = false;
let sentFrozenKeys = null;
let sentReviewMode = "all"; // 'all' | 'en-only' | 'ar-only'
let SENT_REVEALED = new Set();
let showLimit = 80;
let allTblWbwVisible = false;
let allTblTrVisible = false;

(async () => {
  try {
    const [bRes, cRes, clsRes, senRes, qCoreRes, evRes, famRes, gramRes, lcRes, mdRes] = await Promise.all([
      fetch("data/sentence-bank.json").then(r => r.json()).catch(() => ({ sentences: [] })),
      fetch("data/chapters.json").then(r => r.json()).catch(() => ({ chapters: [] })),
      fetch("data/classes.json").then(r => r.json()).catch(() => ({ classes: [] })),
      fetch("data/sentences.json").then(r => r.json()).catch(() => null),
      fetch("data/quran-core.json").then(r => r.json()).catch(() => ({ words: [] })),
      fetch("data/everyday.json").then(r => r.json()).catch(() => ({ groups: [] })),
      fetch("data/families.json").then(r => r.json()).catch(() => ({ families: [] })),
      fetch("data/grammar.json").then(r => r.json()).catch(() => ({ patterns: [] })),
      fetch("data/lesson-cards.json").then(r => r.json()).catch(() => ({ cards: [] })),
      fetch("data/myday.json").then(r => r.json()).catch(() => ({ sentences: [] })),
      loadFamIdx()
    ]);
    DATA = senRes;
    CHAPTERS_LIST = (cRes && cRes.chapters) || [];
    GRAMMAR_PATTERNS = (gramRes && gramRes.patterns) || [];
    if (window.LessonCards && lcRes && Array.isArray(lcRes.cards)) {
      LESSON_CARD_LOOKUP = LessonCards.buildLookup(lcRes.cards);
    }
    if (window.Practice) {
      if (typeof Practice.buildGrammarPool === "function") PRACTICE_GRAMMAR = Practice.buildGrammarPool(GRAMMAR_PATTERNS);
      if (typeof Practice.buildGrammarMap === "function") GRAMMAR_MAP = Practice.buildGrammarMap(GRAMMAR_PATTERNS);
    }

    const wkMap = {};
    const regW = (k, ar, en) => {
      if (!k || !ar) return;
      const n = normalizeAr(ar);
      if (en && !WORD_GLOSS_BY_NORM.has(n)) WORD_GLOSS_BY_NORM.set(n, en);
      const bare = n.replace(/^ال/, "");
      if (bare && !wkMap[bare]) wkMap[bare] = k;
    };
    (clsRes.classes || []).forEach(c => (c.vocabulary || []).forEach(v => regW(v.key, v.ar, v.en)));
    (qCoreRes.words || []).forEach((w, i) => regW(`qc:${i}`, w.ar, w.en));
    (evRes.groups || []).forEach(g => (g.members || []).forEach((m, i) => regW(`ev-${g.id}:${i}`, m.ar, m.en)));
    (famRes.families || []).forEach(f => (f.members || []).forEach((m, i) => regW(`fam-${f.id}:${i}`, m.ar, m.en)));
    if (typeof registerWordKeys === "function") registerWordKeys(wkMap);

    const seen = new Set();
    const add = (key, ar, en, tr, hint, words, src, track, note, extra) => {
      if (!ar || !en) return;
      const n = normalizeAr(ar);
      if (seen.has(n)) return;
      seen.add(n);
      MASTER_SENTENCES.push(Object.assign({
        key: key || ("s:" + n.slice(0, 16)),
        ar, en, tr: tr || "", hint: hint || "", words: words || [],
        src: src || "bank", track: track || "everyday", note: note || ""
      }, extra || {}));
    };

    (cRes.chapters || []).forEach(c => {
      (c.sentences || []).forEach((s, idx) => {
        add(`chap:${c.num}:${idx}`, s.ar, s.en, s.tr, s.hint, s.words, "chapters", "everyday", `Chapter ${c.num}: ${c.title}`, { pattern: s.pattern || null, frames: s.frames || [] });
      });
    });
    (clsRes.classes || []).forEach(c => {
      (c.sentences || []).forEach((s, idx) => {
        add(`cls:${c.id}:${idx}`, s.ar, s.en, s.tr, s.note, s.words, "teacher", "class", `Preply: ${c.title}`, { pattern: s.pattern || null, frames: s.frames || [] });
      });
    });
    (bRes.sentences || []).forEach(s => {
      const words = (s.words || []).map(w => Array.isArray(w) ? w : [w.ar, w.en]);
      const cleanNote = s.surah
        ? `Surah ${s.surah}${s.ref ? " (" + s.ref + ")" : ""}${s.note ? " — " + s.note : ""}`
        : (s.note && !GRAMMAR_MAP[s.note] ? s.note : "");
      add(s.key || s.id, s.ar, s.en, s.tr, s.note, words, s.src || "bank", s.track || "everyday", cleanNote,
        { ref: s.ref || null, surah: s.surah || null, pattern: s.pattern || "-", frames: s.frames || [], use: s.use || 0 });
    });
    const fem = typeof planProfile === "function" && planProfile().gender === "f";
    (mdRes.sentences || []).forEach(s0 => {
      const s = fem && s0.arf ? Object.assign({}, s0, { ar: s0.arf, tr: s0.trf || s0.tr, en: s0.enf || s0.en }) : s0;
      const toks = s.ar.replace(/[.،؟!]/g, "").split(/\s+/).filter(Boolean);
      const words = toks.map(w => {
        const nw = normalizeAr(w);
        return [w, WORD_GLOSS_BY_NORM.get(nw) || WORD_GLOSS_BY_NORM.get(nw.replace(/^ال/, "")) || ""];
      });
      add(s.id, s.ar, s.en, s.tr || "", s.swap || "", words, "myday", "everyday", "", {});
    });

    renderSentMasterySummary();
    renderMasterBank();
  } catch (e) {
    console.error("Failed to load sentence library", e);
  }
})();

function renderSentMasterySummary() {
  const el = document.getElementById("sentMasteryBar");
  if (!el || !window.SRS || !SRS.summaryCounts) return;
  const sc = SRS.summaryCounts(MASTER_SENTENCES.map(s => s.key));
  const setCnt = (id, v) => { const n = document.getElementById(id); if (n) n.textContent = `(${v})`; };
  setCnt("cnt-green", sc.green);
  setCnt("cnt-amber", sc.amber);
  setCnt("cnt-red", sc.red);
  setCnt("cnt-grey", sc.grey);
  const gPct = sc.total ? ((sc.green / sc.total) * 100).toFixed(1) : 0;
  const aPct = sc.total ? ((sc.amber / sc.total) * 100).toFixed(1) : 0;
  const rPct = sc.total ? ((sc.red / sc.total) * 100).toFixed(1) : 0;
  el.innerHTML = `
    <div class="card" style="padding:11px 15px;margin-bottom:0">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:6px;font-size:12.5px">
        <span style="display:inline-flex;align-items:center;gap:12px;flex-wrap:wrap">
          <b>${sc.total.toLocaleString()} Sentences</b>
          <span><span class="m-dot m-green"></span> <b>${sc.green}</b> Mastered</span>
          <span><span class="m-dot m-amber"></span> <b>${sc.amber}</b> Building</span>
          <span><span class="m-dot m-red"></span> <b>${sc.red}</b> Needs work</span>
          <span><span class="m-dot m-grey"></span> <b>${sc.grey}</b> Unseen</span>
        </span>
        <span style="color:var(--muted);font-size:12px">Review directly below, in Chapters, Qur'ān, or in ⚡ Practice — all update the same dots</span>
      </div>
      <div class="m-progress-track">
        <div class="m-progress-seg green" style="width:${gPct}%"></div>
        <div class="m-progress-seg amber" style="width:${aPct}%"></div>
        <div class="m-progress-seg red" style="width:${rPct}%"></div>
      </div>
    </div>
  `;
}
window.addEventListener("ats-mastery-updated", renderSentMasterySummary);

function setSentReviewMode(mode) {
  sentReviewMode = mode;
  SENT_REVEALED.clear();
  document.querySelectorAll(".s-rmode").forEach(b => b.classList.remove("active"));
  const activeId = mode === "en-only" ? "btnSentModeEn" : mode === "ar-only" ? "btnSentModeAr" : "btnSentModeAll";
  const btn = document.getElementById(activeId);
  if (btn) btn.classList.add("active");
  const revBtns = document.getElementById("sentRevealAllBtns");
  if (revBtns) revBtns.style.display = mode === "all" ? "none" : "inline-flex";
  renderMasterBank();
}

function toggleAllSentReveal(show) {
  if (show) MASTER_SENTENCES.forEach(s => SENT_REVEALED.add(s.key));
  else SENT_REVEALED.clear();
  renderMasterBank();
}

function revealMasterSentence(key, refOrEmpty, encodedAr) {
  SENT_REVEALED.add(key);
  renderMasterBank();
  if (sentReviewMode === "en-only" && encodedAr) {
    if (refOrEmpty) playRefOrSpeak(refOrEmpty, encodedAr);
    else playSingle(encodedAr);
  }
}

function resortMasterSentences() {
  sentFrozenKeys = null;
  renderMasterBank();
}

function renderGrammarRuleHtml(s) {
  if (!s) return "";
  const patId = s.pattern && s.pattern !== "-" ? s.pattern : null;
  const g = (patId && GRAMMAR_MAP[patId]) || null;
  if (!g) return "";
  const lc = LESSON_CARD_LOOKUP.byPattern && LESSON_CARD_LOOKUP.byPattern[g.id];
  const lcLink = lc ? ` <a class="s-gram-link" href="sets.html#lc-${lc.id}">📇 Lesson Card →</a>` : "";
  const ruleHtml = typeof enhanceInlineArabic === "function" ? enhanceInlineArabic(g.rule) : g.rule;
  return `<details class="s-gram-box" onclick="event.stopPropagation()"><summary>📐 <span class="ar-inline" dir="rtl">${g.ar}</span> (${g.shortName})</summary><div style="margin-top:4px">${ruleHtml} <a class="s-gram-link" href="grammar.html#${g.id}">Full rule →</a>${lcLink}</div></details>`;
}

function setBankFilter(filt, btn) {
  bankFilter = filt;
  showLimit = 80;
  sentFrozenKeys = null;
  document.querySelectorAll(".b-filter").forEach(b => b.classList.remove("active"));
  if (btn) btn.classList.add("active");
  renderMasterBank();
}

function setDotFilter(filt, btn) {
  dotFilter = filt;
  showLimit = 80;
  sentFrozenKeys = null;
  document.querySelectorAll(".d-filter").forEach(b => b.classList.remove("active"));
  if (btn) btn.classList.add("active");
  renderMasterBank();
}

function toggleWeakestSort() {
  sortWeakest = !sortWeakest;
  sentFrozenKeys = null;
  const btn = document.getElementById("btnSortWeakest");
  if (btn) btn.classList.toggle("active", sortWeakest);
  renderMasterBank();
}

function showMoreSentences() {
  showLimit += 100;
  renderMasterBank();
}

function renderMasterBank() {
  const tbody = document.getElementById("bankTableBody");
  const footer = document.getElementById("bankFooter");
  if (!tbody) return;
  const query = (document.getElementById("bankSearch")?.value || "").trim().toLowerCase();
  const srs = getSrs();
  const now = Date.now();

  let filtered = MASTER_SENTENCES.filter(s => {
    if (query) {
      const matchEn = s.en.toLowerCase().includes(query);
      const matchAr = s.ar.includes(query) || normalizeAr(s.ar).includes(query);
      const matchTr = (s.tr || "").toLowerCase().includes(query);
      const matchNote = (s.note || "").toLowerCase().includes(query);
      const gInfo = s.pattern && GRAMMAR_MAP[s.pattern];
      const matchGram = gInfo ? (gInfo.shortName.toLowerCase().includes(query) || gInfo.rule.toLowerCase().includes(query)) : false;
      if (!matchEn && !matchAr && !matchTr && !matchNote && !matchGram) return false;
    }
    if (bankFilter === "chapters" && s.src !== "chapters") return false;
    if (bankFilter === "teacher" && s.src !== "teacher") return false;
    if (bankFilter === "everyday" && !(s.track === "everyday" && s.src !== "chapters")) return false;
    if (bankFilter === "quran" && s.track !== "quran") return false;
    if (bankFilter === "due") {
      const item = srs[s.key] || {};
      if (!(item.due && item.due <= now && item.b !== "never")) return false;
    }
    if (dotFilter !== "all" && window.SRS && SRS.masteryState) {
      if (SRS.masteryState(s.key, { srs, now }).level !== dotFilter) return false;
    }
    return true;
  });

  if (sortWeakest && window.SRS && SRS.weakestFirst) {
    if (!sentFrozenKeys) {
      sentFrozenKeys = SRS.weakestFirst(filtered, srs, now).map(s => s.key);
    }
    const rankMap = new Map(sentFrozenKeys.map((k, i) => [k, i]));
    filtered = filtered.slice().sort((a, b) => {
      const ra = rankMap.has(a.key) ? rankMap.get(a.key) : 999999;
      const rb = rankMap.has(b.key) ? rankMap.get(b.key) : 999999;
      return ra - rb;
    });
  }

  const pracLink = document.getElementById("practiseSentFilterLink");
  if (pracLink) {
    if (query && filtered.length > 0) {
      const topKeys = filtered.slice(0, 12).map(s => s.key).join(",");
      pracLink.href = "index.html?keys=" + encodeURIComponent(topKeys) + "&label=" + encodeURIComponent("Sentences: " + query);
      pracLink.textContent = "⚡ Practise " + Math.min(12, filtered.length) + " Matching in Practice →";
    } else if (bankFilter !== "all" || dotFilter !== "all") {
      pracLink.href = "index.html?filter=" + encodeURIComponent(bankFilter) + (dotFilter !== "all" ? "&dot=" + encodeURIComponent(dotFilter) : "");
      pracLink.textContent = "⚡ Practise Filtered (" + filtered.length + ") in Practice →";
    } else {
      pracLink.href = "index.html";
      pracLink.textContent = "⚡ Practise Daily Batch →";
    }
  }

  if (filtered.length === 0) {
    tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;padding:24px;color:var(--muted)">No sentences found matching criteria.</td></tr>`;
    if (footer) footer.innerHTML = "";
    return;
  }

  const displaySlice = filtered.slice(0, showLimit);
  tbody.innerHTML = displaySlice.map((s, idx) => {
    const encAr = encodeURIComponent(s.ar);
    const playCall = s.ref
      ? `playRefOrSpeak('${s.ref}', '${encAr}')`
      : `playSingle('${encAr}')`;
    const isRevealed = sentReviewMode === "all" || SENT_REVEALED.has(s.key);
    const escKey = String(s.key).replace(/'/g, "\\'");
    const escRef = String(s.ref || "").replace(/'/g, "\\'");
    const arCellHtml = (sentReviewMode === "en-only" && !isRevealed)
      ? `<div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
           <button type="button" class="chip" onclick="revealMasterSentence('${escKey}', '${escRef}', '${encAr}')" style="font-weight:600;color:var(--accent);border-color:var(--accent)">👁 Check Arabic</button>
           <button type="button" class="small icon-btn" onclick="event.stopPropagation(); ${playCall}" title="Listen hint">🔊</button>
         </div>`
      : `<div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
           <span class="arabic" dir="rtl" style="font-size:22px;color:var(--accent);line-height:1.45">${s.ar}</span>
           <div style="display:flex;gap:4px;align-items:center;flex-shrink:0">
             <button type="button" class="small icon-btn" onclick="${playCall}" title="Listen">🔊</button>
             ${s.words && s.words.length ? `<button type="button" class="line-toggle-btn ${allTblWbwVisible ? 'active' : ''}" id="btn-tbl-wbw-${idx}" onclick="toggleTblWbw(${idx})" title="Toggle word breakdown">🧩</button>` : ''}
             ${s.tr ? `<button type="button" class="line-toggle-btn ${allTblTrVisible ? 'active' : ''}" id="btn-tbl-tr-${idx}" onclick="toggleTblTr(${idx})" title="Toggle transliteration">🔤</button>` : ''}
           </div>
         </div>
         ${s.tr ? `<div id="tbl-tr-${idx}" style="display:${allTblTrVisible ? 'block' : 'none'};font-size:11.5px;color:var(--muted);font-style:italic;margin-top:2px">${s.tr}</div>` : ''}
         ${s.words && s.words.length ? `
           <div id="tbl-wbw-${idx}" class="s-wbw-compact" style="display:${allTblWbwVisible ? 'flex' : 'none'};margin-top:4px">
             <div class="wbw-chips-wrap" style="display:flex;gap:4px;flex-wrap:wrap">
               ${s.words.map((w, wIdx) => {
                 const fam = famLookup(w[0]);
                 return `
                   <div class="wbw-chip-sm ${fam ? 'has-fam' : ''}" onclick="speak('${encodeURIComponent(w[0])}')" title="${w[1]}">
                     <span class="w-ar">${w[0]}</span>
                     <span class="w-en">${w[1]}</span>
                     ${fam ? `<span class="wbw-rf-badge" onclick="event.stopPropagation(); toggleWbwRootFamily('tbl-${idx}', ${wIdx}, '${encodeURIComponent(w[0])}')" title="Explore root ${fam.root}">🌿 ${fam.root}</span>` : ''}
                   </div>
                 `;
               }).join("")}
             </div>
             <div class="wbw-drawer-slot" id="wbw-drawer-slot-tbl-${idx}"></div>
           </div>
         ` : ''}`;
    const enCellHtml = (sentReviewMode === "ar-only" && !isRevealed)
      ? `<button type="button" class="chip" onclick="revealMasterSentence('${escKey}', '${escRef}', '${encAr}')" style="font-weight:600;color:var(--accent);border-color:var(--accent)">👁 Check Meaning</button>`
      : `<div style="font-weight:600;font-size:14.5px;color:var(--ink)">${s.en}</div>
         ${s.note ? `<div style="font-size:13.5px;line-height:1.7;color:var(--ink);margin-top:3px">💡 ${typeof enhanceInlineArabic === "function" ? enhanceInlineArabic(s.note) : s.note}</div>` : ''}
         ${renderGrammarRuleHtml(s)}`;

    return `
      <tr>
        <td style="white-space:nowrap">
          <span style="display:inline-flex;align-items:center;gap:6px">
            ${SRS.dotHtml(s.key, { lg: true })}
            <span style="color:var(--muted);font-size:11px">${idx + 1}</span>
          </span>
        </td>
        <td>${arCellHtml}</td>
        <td>${enCellHtml}</td>
        <td>
          <span style="font-size:11.5px;color:var(--muted);white-space:nowrap">
            ${s.src === 'chapters' ? '📖 Chapter' : s.src === 'teacher' ? '🧑‍🏫 Preply' : s.track === 'quran' ? "🕌 Qur'ān" : '🗣 Everyday'}
          </span>
        </td>
        <td style="text-align:right;white-space:nowrap">
          <div class="sheet-rate-bar" onclick="event.stopPropagation()">${SRS.rateBarHtml(s.key, "rateMasterSentence", [], { compact: true, noDot: true })}</div>
        </td>
      </tr>
    `;
  }).join("");

  if (footer) {
    footer.innerHTML = filtered.length > showLimit
      ? `Showing ${showLimit} of ${filtered.length} matching sentences · <button type="button" class="chip" onclick="showMoreSentences()">Show 100 more ↓</button>`
      : `Showing all ${filtered.length} matching sentence${filtered.length === 1 ? "" : "s"}.`;
  }
}

function toggleTblWbw(idx) {
  const el = document.getElementById("tbl-wbw-" + idx);
  const btn = document.getElementById("btn-tbl-wbw-" + idx);
  if (!el) return;
  const isHidden = el.style.display === "none" || !el.style.display;
  el.style.display = isHidden ? "flex" : "none";
  if (btn) btn.classList.toggle("active", isHidden);
}

function toggleTblTr(idx) {
  const el = document.getElementById("tbl-tr-" + idx);
  const btn = document.getElementById("btn-tbl-tr-" + idx);
  if (!el) return;
  const isHidden = el.style.display === "none" || !el.style.display;
  el.style.display = isHidden ? "block" : "none";
  if (btn) btn.classList.toggle("active", isHidden);
}

function toggleAllTblWbw() {
  allTblWbwVisible = !allTblWbwVisible;
  document.querySelectorAll("[id^='tbl-wbw-']").forEach(el => { el.style.display = allTblWbwVisible ? "flex" : "none"; });
  document.querySelectorAll("[id^='btn-tbl-wbw-']").forEach(btn => { btn.classList.toggle("active", allTblWbwVisible); });
  const btnAll = document.getElementById("btnToggleAllTblWbw");
  if (btnAll) btnAll.classList.toggle("active", allTblWbwVisible);
}

function toggleAllTblTr() {
  allTblTrVisible = !allTblTrVisible;
  document.querySelectorAll("[id^='tbl-tr-']").forEach(el => { el.style.display = allTblTrVisible ? "block" : "none"; });
  document.querySelectorAll("[id^='btn-tbl-tr-']").forEach(btn => { btn.classList.toggle("active", allTblTrVisible); });
  const btnAll = document.getElementById("btnToggleAllTblTr");
  if (btnAll) btnAll.classList.toggle("active", allTblTrVisible);
}

function rateMasterSentence(key, g) {
  const wasVeiled = sentReviewMode !== "all" && !SENT_REVEALED.has(key);
  SENT_REVEALED.add(key);
  const s = MASTER_SENTENCES.find(x => x.key === key);
  let nc = null;
  if (s && window.Practice && typeof Practice.syncVerdict === "function") {
    const res = Practice.syncVerdict({
      item: s, key, grade: g, srsApi: SRS, getSrs, store, logEvent, normalizeAr,
      wordKeyFor: ar => (typeof _wordKeyFor === "function" && ar) ? _wordKeyFor(normalizeAr(ar).replace(/^ال/, "")) : null,
      chapters: CHAPTERS_LIST, via: "master-bank"
    });
    nc = res ? res.nc : SRS.rate(key, g);
  } else {
    nc = SRS.rate(key, g);
  }
  autoSync();
  if (wasVeiled) renderMasterBank();
  SRS.paintBar(document.getElementById("bankTableBody"), key, nc);
  renderSentMasterySummary();
}

function playSingle(encodedAr) {
  stopSpeak();
  const text = decodeURIComponent(encodedAr);
  speak(text, 0.85);
  logEvent({ e: "audio-play", text, type: "sentence", t: Date.now() });
}

function playRefOrSpeak(ref, encodedAr) {
  stopSpeak();
  const text = decodeURIComponent(encodedAr);
  if (ref && typeof reciteVerse === "function") {
    const p = String(ref).split(":").map(Number);
    if (p[0] && p[1]) {
      reciteVerse(p[0], p[1], text, 0.85);
      logEvent({ e: "audio-play", text, ref, type: "quran-ayah", t: Date.now() });
      return;
    }
  }
  speak(text, 0.85);
}
</script>
