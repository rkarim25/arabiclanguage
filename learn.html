/* ---------- ONE SCREEN, NOT TWO ----------
   His ask, 2026-08-30: "it should be show me, got it, didnt get it all in one
   setting rather than show me and then saying yes or no. the extra step isnt
   necessary. if i have it i can quickly say got it, in fact maybe repeating
   again or dont repeat or repeat later options should also be there again for
   the spaced repetition engine to be there."

   He is right, and the old flow was worse than merely slow: forcing him through
   "show me" before he could say he knew it meant the site saw the answer before
   he committed to one, which is not a recall test. So every self-graded card now
   offers, on the SAME screen:

     ✓ got it   ✗ didn't get it   show me   + the four spaced-repetition buckets

   "show me" reveals in place rather than navigating, so it costs nothing when he
   does want it. A bucket tap is itself an answer — ✓/⏳/⊘ mean he had it, ↻ means
   he didn't — and it REPLACES the automatic grade rather than being overwritten
   by it (gradeCard clears an explicit bucket by design; see js/app.js). */
/* ---------- SAYING IT INSTEAD OF TYPING IT ----------
   His ask, 2026-08-30: "is it possible to use audio input from me to repeat the
   words rather than writing it?" — followed by "it wasnt working before, it
   needs to work."

   It is the better input for him and always was: his goals are the Qur'an by ear
   and speech in a mosque, he has said in as many words that writing is not a
   priority, and typing Arabic is a tax on every single answer. Speaking is the
   skill; typing was only ever the thing the site could check.

   Three rules make this honest rather than infuriating:

     1. Arabic recognition is NOT reliable enough to fail him on. If what it
        heard matches, he is right. If it does not, the site shows him what it
        heard and asks HIM — because the likeliest explanation is the recogniser,
        not him. Self-judgment after a genuine attempt is exactly what the Qur'an
        recite step already does.
     2. Every alternative the engine offers is checked, not just its first guess
        (js/app.js FIX 2). Arabic homophones make the top guess wrong far more
        often than the third one is.
     3. Typing never goes away. The box stays; the microphone sits beside it. */
const CAN_MIC = typeof SR !== "undefined" && !!SR;
/* SPEAKING MUST NOT DEPEND ON RECOGNITION WORKING.
   2026-08-30, after two rounds of "heard silence" and him proving his microphone
   records perfectly well in the Windows Voice Recorder: the recogniser is a
   convenience, and it was standing between him and the thing he actually asked
   for. He wanted to SAY the answers instead of typing them. Saying them out loud
   is the skill; the recogniser was only ever the thing that could check it.

   So there are always two ways to answer by voice — let it listen, or say it and
   mark it yourself — and the second one needs nothing but a mouth. This is the
   same self-judgment the Qur'an recite step has used since the beginning, and it
   is the reason that step has never once been reported as broken. */
/* ---- THE STUMBLE IS THE HONEST ANSWER, and until 2026-08-31 it had no button ----
   His pen note, written on the class-words lesson while doing this exact step:
   "when i say i said it, i should be able to say how accurate i got it. making it
   binary might not be the best thing."

   ✓/✗ forced him to lie in one direction or the other. A hesitant third attempt
   that got there had to be called a clean pass — which advances the box and takes
   the word out of rotation — or a miss, which sends a word he genuinely produced
   back to box 0. Neither is what happened. The honest answer had nowhere to go, so
   speaking never registered as movement, which is a fair description of why his
   log holds 203 by-ear grades and nothing spoken.

   Three levels. The middle one is the whole point: it holds the box and brings the
   card back tomorrow (gradeCard "hard").

   AND IT LOGS. Every self-marked spoken answer now emits `speak-self`. Until today
   this page recorded nothing at all to say he had opened his mouth — a self-marked
   answer was indistinguishable from a typed one in the record, which is why every
   gap hunt read his speaking as zero when the truth was simply unmeasured. */
const SELF_GRADES = [
  { id: "clean",   label: "✓ said it clean",    grade: "good",  ok: true,  verdict: "✓ said it clean" },
  { id: "stumble", label: "~ got it, stumbled", grade: "hard",  ok: true,  verdict: "~ got it — back again tomorrow" },
  { id: "no",      label: "✗ couldn't",         grade: "again", ok: false, verdict: "✗ not yet" },
];
function selfGradeRow(prefix) {
  return `<div class="row">` + SELF_GRADES.map((g, i) =>
    `<button ${i === 0 ? 'class="primary" ' : ""}id="${prefix}${g.id}">${g.label}</button>`).join("") + `</div>`;
}
/* onPick receives the SELF_GRADES entry — its .ok for the score, its .grade for the card */
function wireSelfGrade(prefix, key, onPick) {
  SELF_GRADES.forEach(g => {
    const b = document.getElementById(prefix + g.id);
    if (!b) return;
    b.onclick = () => {
      logEvent({ e: "speak-self", key: key || "", level: g.id, ok: g.ok, src: "learn" });
      onPick(g);
    };
  });
}

function micRow(id) {
  const self = `<button id="${id}Self">🗣 I said it — mark it myself</button>`;
  if (!CAN_MIC) return `<div class="row" style="margin-top:2px">${self}</div>
    <p style="text-align:center;font-size:12px;color:var(--muted);margin:6px 0 0">
      This browser can't listen, but you can still answer out loud and mark yourself.</p>`;
  return `<div class="row" style="margin-top:2px">
      <button id="${id}" style="font-size:16px">🎤 say it instead</button>
      ${self}
      <span id="${id}Msg" style="font-size:12.5px;color:var(--muted);align-self:center"></span>
    </div>
    <div id="${id}Diag" style="margin-top:8px"></div>`;
}
/* onSaid(ok, heard) — heard is "" when he marked himself */
function wireMic(id, target, onSaid, onSelf) {
  // the self-marked route is always available, recogniser or not
  const selfBtn = document.getElementById(id + "Self");
  if (selfBtn) selfBtn.onclick = () => (onSelf || (() => {}))();
  if (!CAN_MIC) return;
  const btn = document.getElementById(id);
  const msg = document.getElementById(id + "Msg");
  if (!btn) return;
  btn.onclick = () => {
    msg.textContent = "";
    dictate(btn, "🎤 say it instead", (heard, url, err, alts) => {
      if (!heard) {
        msg.textContent = err || "didn't catch that — tap 🎤 to try again";
        /* A failed take is the only moment the diagnosis is worth anything, so
           it is offered HERE rather than on a page he would have to go and find.
           "heard silence" in particular has three quite different causes and
           guessing between them wastes an evening. */
        const dg = document.getElementById(id + "Diag");
        if (dg && !dg.dataset.on) {
          dg.dataset.on = "1";
          dg.innerHTML = `<button class="small" id="${id}Fix">🔧 find out why</button>`;
          document.getElementById(id + "Fix").onclick = () => micDiagnose(dg);
        }
        return;
      }
      // every alternative the engine offered is another chance to be right
      const tries = [heard].concat(alts || []);
      const ok = tries.some(t => heardMatch(t, target) || speakMatch(t, target) || writeMatchAr(t, target).ok);
      onSaid(ok, heard);
    });
  };
}

/* ---------- stepping BACK ----------
   His ask, 2026-08-30, looking at a vocabulary burst: "can you put next and back
   in these?" Every card in the site moved one way only, so a word that went past
   before he had finished reading its example sentence was simply gone.

   Back re-opens the previous card FRESH, ready to be answered again, rather than
   as a read-only replay — answering again is the whole point of going back, and
   the last answer wins, because an SRS card holds one state and the most recent
   evidence is the truthful one. In a test the previous answer comes off the score
   at the same moment, so no question is ever counted twice. */
const BACK_BTN = enabled =>
  `<button id="bk"${enabled ? "" : ' disabled style="opacity:.3"'}>← Back</button>`;

/* Enter advances. Bound on the window with a capture listener and cleared on
   use: document.onkeydown was being lost whenever focus moved off the button,
   which is exactly what happens after an input is disabled. */
let _enterOff = null, _cardAt = 0;
/* Every card render stamps this. Enter is then ignored for a moment afterwards,
   which is what stops ONE keypress from doing two things.

   His report, 2026-08-30: "what does enter do after typing? when i hit enter
   after typing it says not quite even though answer is correct." The screenshot
   showed the answer box EMPTY under "✗ not quite", which is the whole story: the
   Enter that advanced from one card was still in flight when the next card
   mounted its input, and submitted it blank. Two guards, because either alone
   leaves a hole:
     · a blank box is never submitted — pressing Enter with nothing typed does
       nothing at all, which is what anyone would expect;
     · and no Enter counts within 350ms of a card appearing. */
function cardShown() { _cardAt = Date.now(); }
function enterIsStale() { return Date.now() - _cardAt < 350; }
function onEnterOnce(fn) {
  if (_enterOff) _enterOff();
  const h = e => {
    if (e.key !== "Enter" || enterIsStale()) return;
    e.preventDefault(); _enterOff(); fn();
  };
  _enterOff = () => { window.removeEventListener("keydown", h, true); _enterOff = null; };
  window.addEventListener("keydown", h, true);
}
function judgePanel(id) {
  return `<div id="${id}Rev"></div>
    <div class="row">
      <button class="primary" id="${id}Yes">✓ got it</button>
      <button id="${id}No">✗ didn't get it</button>
      <button id="${id}Show">show me</button>
    </div>
    <div class="row" style="gap:6px;align-items:center;justify-content:center;margin-top:2px">
      <span style="font-size:12px;color:var(--muted)" title="Your answer already schedules this card. These only override it.">scheduled from your answer · override:</span>
      <span id="${id}Bkt"></span>
    </div>`;
}
/* answer(html) fills the reveal slot; done(ok, bucketed) ends the card. */
function wireJudge(id, key, answerHtml, done) {
  const rev = document.getElementById(id + "Rev");
  const show = document.getElementById(id + "Show");
  if (show) show.onclick = () => { rev.innerHTML = answerHtml; show.remove(); };
  document.getElementById(id + "Yes").onclick = () => done(true, false);
  document.getElementById(id + "No").onclick = () => { rev.innerHTML = answerHtml; done(false, false); };
  if (key) mountBucketBar(document.getElementById(id + "Bkt"), key,
    b => done(b !== "repeat", true));
}

/* ---------- a meaning question, actually marked ----------
   His ask, 2026-08-30: "in the test, why not give me the option to type in
   english word? here you have to take my word for it, not a proper test."

   So a meaning question takes a typed English answer and enMatch (js/app.js)
   marks it. "show me" is still there and still free — but taking it reveals the
   answer, and only THEN can he self-grade, which is the honest order. The
   spaced-repetition buckets sit alongside either way. */
function meaningPanel(id, canBack) {
  return `<div class="row" style="margin-top:6px">
      <input id="${id}En" placeholder="what does it mean?" autocomplete="off"
        style="flex:1 1 240px;max-width:340px;padding:11px 12px;border:1px solid var(--border);border-radius:10px;font-size:17px;text-align:center">
    </div>
    <div id="${id}Rev"></div>
    <div class="row" id="${id}Row">
      ${BACK_BTN(canBack)}
      <button class="primary" id="${id}Chk">Check</button>
      <button id="${id}Show">show me</button>
    </div>
    <div class="row" style="gap:6px;align-items:center;justify-content:center;margin-top:2px">
      <span style="font-size:12px;color:var(--muted)" title="Your answer already schedules this card. These only override it.">scheduled from your answer · override:</span>
      <span id="${id}Bkt"></span>
    </div>`;
}
function wireMeaning(id, key, en, done) {
  const inp = document.getElementById(id + "En");
  const rev = document.getElementById(id + "Rev");
  const chk = document.getElementById(id + "Chk");
  const show = document.getElementById(id + "Show");
  const say = t => { rev.innerHTML = `<p style="text-align:center;font-size:16px;margin:10px 0 0">${t}</p>`; };
  cardShown();
  inp.focus();
  inp.onkeydown = e => {
    if (e.key !== "Enter") return;
    e.preventDefault();
    if (!inp.value.trim() || enterIsStale()) return;
    chk.click();
  };
  chk.onclick = () => {
    const ok = enMatch(inp.value, en);
    say(ok ? "✓ right" : `✗ not quite — you wrote “${esc(inp.value.trim())}”`);
    inp.disabled = true;
    done(ok, false);
  };
  /* "show me" is one tap and reveals in place. Only THEN can he self-grade — that
     order is the whole point: seeing the answer first and then claiming he knew
     it is not a test, which is what he objected to. */
  show.onclick = () => {
    say("the answer:");
    inp.disabled = true;
    document.getElementById(id + "Row").innerHTML =
      `<button class="primary" id="${id}Yes">✓ I had it</button><button id="${id}No">✗ I didn't</button>`;
    document.getElementById(id + "Yes").onclick = () => done(true, false);
    document.getElementById(id + "No").onclick = () => done(false, false);
  };
  if (key) mountBucketBar(document.getElementById(id + "Bkt"), key, b => done(b !== "repeat", true));
}

/* Wire a freshly-rendered answer box: live conversion, suggestion chips, a tap
   keyboard, and Enter to submit. */
async function wireAnswer(inputId, submitId, exclude) {
  const inp = document.getElementById(inputId);
  if (!inp) return;
  /* `exclude` means this is a TEST: the answer's own words are out of the
     suggestion pool so a chip can't give it away. Say that, rather than offering
     whatever else happened to be close — three unrelated words is not help. */
  cardShown();
  attachInlineTranslit(inp, {
    lexicon: await typingPool(exclude),
    strict: !!(exclude && exclude.length),
    heldBackNote: exclude && exclude.length
      ? "no suggestion for this one — it's the answer. Roughly right is accepted."
      : "",
  });
  inp.focus();
  inp.onkeydown = e => {
    if (e.key !== "Enter") return;
    e.preventDefault();
    // an empty box is not an answer, and an Enter still travelling from the
    // previous card is not one either
    if (!inp.value.trim() || enterIsStale()) return;
    const b = document.getElementById(submitId);
    if (b) b.click();
  };
  const kb = document.getElementById(inputId + "Kb");
  if (kb) kb.onclick = () => mountTranslitDock(() => document.getElementById(inputId));
}

(async () => {
  const ctx = await curCtx();
  if (!ctx) { app.innerHTML = "<p>Couldn't load the curriculum.</p>"; return; }
  const state = Curriculum.milestoneState(ctx);
  if (!state.current) { app.innerHTML = "<h1>Everything achieved</h1><p>Nothing left on the ladder — ask your coach for more.</p>"; return; }

  /* the interleaved bursts — scheduled by Curriculum.burstsFor(), run below */
  if (P.get("burst") === "vocab") return runVocabBurst(ctx, state);
  if (P.get("burst") === "grammar") return runGrammarBurst(ctx, state);

  /* THE CLASS TEST. His ask, 2026-08-30: "put another test of class ready which
     helps me master the content of the class." Unlike a lesson or milestone test
     this one deliberately covers EVERYTHING the class brought, proved or not —
     the point is mastering her material, not clearing the ladder — so it is a
     spread across all of its lessons and reports where he stands rather than
     clearing anything. Retake it as often as he likes; the score history lines up
     because the scope is identical every time. */
  const classId = P.get("class");
  if (classId) {
    let cls = null;
    try { cls = (await fetch("data/classes.json").then(r => r.json())).classes.find(c => c.id === classId); } catch (e) {}
    if (!cls) { location.href = "index.html"; return; }
    return runTest(cls.lessons.map(l => l.id), ctx, state,
      `Class test — ${cls.title}`, { all: true });
  }

  const lessonId = P.get("lesson");
  const lessonSet = (P.get("lessons") || "").split(",").filter(Boolean);
  const findMs = id => (ctx.curriculum.milestones || []).find(m => (m.lessons || []).some(l => l.id === id));

  // a week's worth, or a milestone's worth
  if (lessonSet.length) return runTest(lessonSet, ctx, state, P.get("label") || "This week");

  if (lessonId) {
    const src = findMs(lessonId);
    if (!src) { location.href = "index.html"; return; }
    if (P.get("test")) return runTest([lessonId], ctx, state);
    const srcLesson = src.lessons.find(l => l.id === lessonId);
    return runLesson(srcLesson, src, ctx, P.get("mode") === "hands");
  }

  if (P.get("test")) {
    const ms = state.milestones.find(m => m.id === P.get("m")) || state.current;
    const open = ms.lessons.filter(l => !l.mastered).map(l => l.id);
    return runTest(open.length ? open : ms.lessons.map(l => l.id), ctx, state, ms.name);
  }

  // plain Continue
  const next = Curriculum.nextChunk(ctx, state);
  if (!next) { location.href = "index.html"; return; }
  if (next.testNext) return runTest([next.lesson.id], ctx, state);
  const src = findMs(next.lesson.id);
  return runLesson(src.lessons.find(l => l.id === next.lesson.id), src, ctx, false);
})();

/* ======================= A LESSON — one ~7-minute sitting =======================
   THE SENTENCE IS THE UNIT OF STUDY (CURRICULUM.md §5). His rule, 2026-08-30:

     "first it gives a meaning, then i hear it in arabic, then i repeat it myself
      and then i practise variations of it … i just keep working with sentences
      only and as primary method."

   So every lesson walks the same four steps per sentence, and the two tracks
   differ in exactly one place — step 2 — because their goals are opposite:

     🗣 conversation   meaning → HEAR it → produce it → vary it
     🎧 Qur'an         meaning → RECITE it from memory → decode it by ear → vary

   He has the Qur'an memorised, so being played the audio to learn it teaches him
   nothing; what he cannot yet do is understand it AS it is recited. The Qur'an
   loop therefore takes the recitation from him and gives the audio back as the
   test — which is the actual goal ("understand the Qur'an as it is recited"),
   not a proxy for it.

   The lesson still OWNS its word keys: they are what the test proves and what the
   SRS schedules. Every sentence answer grades the words inside it, so the vocab
   list is maintained underneath without him ever seeing a word list — his second
   condition ("you have to maintain a vocab list for me which you test and get me
   to repeat in sentence format"). */
async function runLesson(lesson, ms, ctx, handsFree) {
  const chunk = Curriculum.lessonChunks(lesson)[0];
  const track = ms.track === "quran" ? "quran" : "conv";
  const keys = lesson.keys || [];

  // Review rides at the front as SENTENCES containing what is slipping — never
  // as a word list, which is the thing he asked to stop doing.
  const review = Curriculum.reviewSentencesFor(chunk, ctx, 2);
  const taught = Curriculum.sentencesFor(keys, ctx, { track, limit: 4, exclude: review.map(s => s.key) });

  const items = review.map(s => ({ s, review: true })).concat(taught.map(s => ({ s, review: false })));

  /* Anything the chosen sentences don't reach is still this lesson's job and the
     test will still ask it, so it is met as a one-word sentence rather than
     silently dropped. This is also the honest fallback when no sentence in the
     bank carries a word yet. */
  const covered = new Set(items.flatMap(x => x.s.teaches || x.s.wordKeys || []));
  const missing = keys.filter(k => !covered.has(k));
  if (missing.length) {
    const resolved = await resolveCards(missing);
    resolved.forEach(r => {
      if (!r || !r.v || !r.v.ar) return;
      items.push({ s: {
        key: r.key, ar: r.v.ar, en: r.v.en, tr: r.v.tr || "", track, single: true,
        words: [{ ar: r.v.ar, en: r.v.en, tr: r.v.tr || "", key: r.key }],
        wordKeys: [r.key], teaches: [r.key], note: r.v.note || null,
      }, review: false });
    });
  }
  if (!items.length) { app.innerHTML = "<p>Nothing to study here.</p>"; return; }

  primeSpeak();
  const head = extra => `
    <div class="crumb">${track === "quran" ? "🎧 Qur'an" : "🗣 Everyday"} · ${esc(ms.name)}</div>
    <h1 style="margin-top:0">${esc(lesson.title)}</h1>
    <p class="sub">${extra || ""}${review.length ? ` <span class="pill">+${review.length} to keep warm</span>` : ""}
      ${speedToggleHtml()}</p>`;

  /* ---- word-level credit ----
     A sentence answer is the only thing he does, so it has to be what feeds the
     word cards. writeMatchAr already reports which target words landed; match
     them to the sentence's words by normalized form (index alignment is not safe
     — punctuation splits differently in different sources). */
  function creditWords(s, m, fallbackOk, fallbackGrade) {
    (s.words || []).forEach(w => {
      const cards = w.keys && w.keys.length ? w.keys : (w.key ? [w.key] : []);
      if (!cards.length) return;
      let ok = fallbackOk, checked = false;
      if (m && m.words) {
        const j = m.words.findIndex(t => normalizeAr(t) === normalizeAr(w.ar));
        if (j >= 0) { ok = m.hits[j] !== "miss"; checked = true; }
      }
      // one word, every card it has: ٱللَّهِ is both qc:1 and qw:fatiha:0:1, and
      // letting those drift apart is what put the same word in a lesson twice
      // a word the typed check actually MATCHED is a clean hit however the whole
      // sentence sounded; a word nothing checked inherits the sentence's grade,
      // stumble included
      cards.forEach(k => gradeCard(k, (!checked && fallbackGrade) ? fallbackGrade : (ok ? "good" : "again")));
    });
  }
  function gradeSentence(s, ok, m, byEar, grade) {
    if (s.key) gradeCard(s.key, grade || (ok ? "good" : "again"));
    creditWords(s, m, ok, grade);
    if (byEar) (s.wordKeys || []).forEach(k => logEvent({ e: "alisten-grade", key: k, ok: !!ok, src: "lesson" }));
  }

  /* ---- the words under a sentence, each one retirable ----
     His ask, 2026-08-30: "give me the option where i can click dont repeat as
     well. there are words like Allah which really i dont need to repeat."
     One tap on the ⊘ retires that word everywhere — it stops being taught,
     tested, reviewed and counted as weak, and it still counts as held, because
     retiring is him saying he knows it. Tapping again brings it straight back.
     The full four-bucket bar would be twenty-four buttons under a six-word
     sentence, so the sentence surfaces the one control he asked for by name; the
     other three live on the card-sized rows (the class page and the vocabulary
     burst), where there is room for them. */
  const wordsHtmlFor = s => (s.words || []).filter(w => w.en).map((w, wi) => {
    const k = (w.keys && w.keys[0]) || w.key || "";
    const off = k && isRetired(k);
    return `<span class="wchip" data-k="${esc(k)}" data-i="${wi}" style="display:inline-block;margin:0 6px 6px 0;padding:3px 9px;border:1px solid var(--border);border-radius:8px;font-size:13px;${off ? "opacity:.5" : ""}">
       <span class="arabic" style="font-size:17px">${esc(w.ar)}</span>
       <span style="color:var(--muted)"> ${esc(w.en)}</span>
       ${k ? `<button type="button" class="wret" title="${off ? "bring this word back" : "don't repeat this word"}"
          style="border:0;background:none;cursor:pointer;font-size:13px;padding:0 0 0 5px;color:${off ? "var(--accent)" : "var(--muted)"}">${off ? "↺" : "⊘"}</button>` : ""}
     </span>`;
  }).join("");
  /* delegated once, so it survives every re-render of the card */
  document.addEventListener("click", e => {
    const b = e.target.closest && e.target.closest(".wret");
    if (!b) return;
    e.preventDefault(); e.stopPropagation();
    const chip = b.closest(".wchip"), k = chip && chip.dataset.k;
    if (!k) return;
    const now = toggleRetire(k);
    chip.style.opacity = now ? ".5" : "";
    b.textContent = now ? "↺" : "⊘";
    b.style.color = now ? "var(--accent)" : "var(--muted)";
    b.title = now ? "bring this word back" : "don't repeat this word";
  });

  const sourceLine = s => s.ref ? `${esc(s.surah || "")} ${esc(s.ref)}${s.part ? ` · part ${esc(s.part)}` : ""}`
    : s.theme ? esc(s.theme) : "";

  if (handsFree) return handsFreeRun();
  return grammarGate();

  /* ---- grammar, when a rule genuinely needs explaining ----
     His condition: "if there are grammar rules which i do need to learn or
     understand then that needs to be added on from time to time." Shown ONCE,
     the first time a sentence using the pattern comes up, then never again. */
  async function grammarGate() {
    const pat = Curriculum.grammarToShow(items.map(x => x.s), ctx);
    if (!pat) return run();
    let g = null;
    try { g = (await fetch("data/grammar.json").then(r => r.json())).patterns.find(p => p.id === pat); } catch (e) {}
    if (!g) return run();
    logEvent({ e: "pattern-seen", pattern: pat });
    app.innerHTML = head("One rule first — it turns up in what follows.") + `
      <div class="card">
        <div class="crumb">grammar</div>
        <h2 style="margin:2px 0 8px">${esc(g.name)}</h2>
        <div class="q-ar arabic" style="margin:6px 0">${esc(g.ar)}</div>
        <p style="font-size:15px;line-height:1.75">${esc(g.what)}</p>
        ${(g.examples || []).slice(0, 2).map(e => `
          <div style="border-top:1px solid var(--border);padding-top:8px;margin-top:8px">
            <div class="arabic" style="font-size:21px;direction:rtl;text-align:right">${esc(e.ar)}</div>
            <div style="font-size:13.5px;color:var(--muted)">${esc(e.en)}</div>
          </div>`).join("")}
        <div class="row"><button class="primary" id="gok">Got it →</button></div>
      </div>`;
    document.getElementById("gok").onclick = run;
  }

  /* ---- the four steps, one sentence at a time ---- */
  function run() {
    let i = 0, right = 0, asked = 0;

    const next = () => { i++; step(); };
    const bar = () => `<div class="crumb">${i + 1} of ${items.length}${items[i].review ? " · keeping warm" : ""}
        ${sourceLine(items[i].s) ? ` · ${sourceLine(items[i].s)}` : ""}</div>
      <div class="prog"><i style="width:${Math.round(100 * i / items.length)}%"></i></div>`;

    function step() {
      if (i >= items.length) return finish(right, asked, "screen");
      meaning(items[i].s);
    }

    /* 1 — the meaning, before any Arabic. Front-loading it is what lets the
       Arabic land as language rather than as noise. */
    function meaning(s) {
      app.innerHTML = head() + `<div class="card">${bar()}
        <div class="q-en" style="font-size:20px">${esc(s.en)}</div>
        ${s.verseEn && s.verseEn !== s.en ? `<p style="font-size:13px;color:var(--muted);text-align:center;line-height:1.6">the whole ayah: ${esc(s.verseEn)}</p>` : ""}
        <p style="text-align:center;font-size:14px;color:var(--muted)">${track === "quran"
          ? "You know this one by heart. Ready to say it?" : "That is what you are about to say."}</p>
        <div class="row"><button class="primary" id="go">${track === "quran" ? "Say it →" : "Hear it →"}</button></div>
      </div>`;
      document.getElementById("go").onclick = () => (track === "quran" ? recite(s) : hear(s));
    }

    /* 2a — conversation: hear it, see it, see what each word is doing. */
    function hear(s) {
      app.innerHTML = head() + `<div class="card">${bar()}
        <div class="q-ar arabic" dir="rtl">${esc(s.ar)}</div>
        ${s.tr ? `<p class="q-tr">${esc(s.tr)}</p>` : ""}
        <div class="q-en" style="font-size:15px;color:var(--muted)">${esc(s.en)}</div>
        <div style="text-align:right;direction:rtl">${wordsHtmlFor(s)}</div>
        ${s.note ? `<p style="font-size:13px;color:var(--muted);line-height:1.7">${esc(s.note)}</p>` : ""}
        <div class="row"><button id="again">🔊 again</button><button class="primary" id="go">Now you say it →</button></div>
      </div>`;
      speak(s.ar, 0.85);
      document.getElementById("again").onclick = () => speak(s.ar, 0.85);
      document.getElementById("go").onclick = () => produce(s);
    }

    /* 2b — Qur'an: HE supplies the Arabic. This is the inversion: the recitation
       is already his, so the site asks for it instead of teaching it. */
    function recite(s) {
      app.innerHTML = head() + `<div class="card">${bar()}
        <div class="q-en" style="font-size:17px;color:var(--muted)">${esc(s.en)}</div>
        <p style="text-align:center;font-size:15px">Say it out loud from memory, then check yourself.</p>
        ${judgePanel("r")}
      </div>`;
      const shown = `<div class="q-ar arabic" dir="rtl">${esc(s.ar)}</div>
        <div style="text-align:right;direction:rtl">${wordsHtmlFor(s)}</div>
        ${s.note ? `<p style="font-size:13px;color:var(--muted);line-height:1.7">${esc(s.note)}</p>` : ""}`;
      wireJudge("r", s.key, shown, (ok, bucketed) => {
        asked++; if (ok) right++;
        if (!bucketed) gradeSentence(s, ok); else creditWords(s, null, ok);
        speak(s.ar, 0.85);
        decode(s);
      });
    }

    /* 3a — Qur'an: the real goal. Audio only, at speed. Does the meaning arrive? */
    function decode(s) {
      app.innerHTML = head() + `<div class="card">${bar()}
        <p style="text-align:center;font-size:15px;margin-top:14px">Now just listen. Does the meaning arrive on its own?</p>
        <div class="row"><button class="primary" id="play" style="font-size:17px">🔊 play</button></div>
        ${judgePanel("d")}
      </div>`;
      speak(s.ar, 0.95);
      document.getElementById("play").onclick = () => speak(s.ar, 0.95);
      const shown = `<div class="q-ar arabic" dir="rtl" style="font-size:26px">${esc(s.ar)}</div>
        <div class="q-en">${esc(s.en)}</div>`;
      wireJudge("d", s.key, shown, (ok, bucketed) => {
        if (!bucketed) gradeSentence(s, ok, null, true);
        else { creditWords(s, null, ok); (s.wordKeys || []).forEach(k => logEvent({ e: "alisten-grade", key: k, ok: !!ok, src: "lesson" })); }
        vary(s);
      });
    }

    /* 3b — conversation: produce it. Typed, because typing is the only way the
       site can actually check him — and every word inside is graded from it. */
    function produce(s) {
      app.innerHTML = head() + `<div class="card">${bar()}
        <div class="q-en">${esc(s.en)}</div>
        <p style="text-align:center;font-size:13.5px;color:var(--muted)">Write the whole thing — type it the way it sounds</p>
        <input id="ans" dir="rtl" style="width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:10px;font-size:22px;text-align:center">
        <div class="row"><button class="primary" id="chk">Check</button><button id="skip">show me</button><button class="small" id="ansKb">⌨ keys</button></div>
        ${micRow("pmic")}
        ${TYPING_HELP}</div>`;
      // a LESSON may suggest the sentence's own words — he is learning to spell them
      wireAnswer("ans", "chk");
      /* SAYING a sentence is closer to the goal than typing it, so in a lesson a
         spoken attempt is simply accepted as the answer — right if the recogniser
         agrees, his call if it does not. */
      wireMic("pmic", s.ar, (ok, heard) => {
        if (ok) { asked++; right++; gradeSentence(s, true); showProduced(s, true, heard); return; }
        app.innerHTML = head() + `<div class="card">${bar()}
          <p style="text-align:center;font-size:15px">It heard “<span class="arabic" dir="rtl">${esc(heard)}</span>”,
          which isn't a match — but Arabic recognition is unreliable. Was what you said right?</p>
          <div class="q-ar arabic" dir="rtl">${esc(s.ar)}</div>
          ${s.tr ? `<p class="q-tr">${esc(s.tr)}</p>` : ""}
          ${selfGradeRow("pj")}
        </div>`;
        speak(s.ar, 0.85);
        wireSelfGrade("pj", s.key, g => { asked++; if (g.ok) right++; gradeSentence(s, g.ok, null, false, g.grade); vary(s); });
      }, () => {
        app.innerHTML = head() + `<div class="card">${bar()}
          <div class="q-ar arabic" dir="rtl">${esc(s.ar)}</div>
          ${s.tr ? `<p class="q-tr">${esc(s.tr)}</p>` : ""}
          <div style="text-align:right;direction:rtl">${wordsHtmlFor(s)}</div>
          <p style="text-align:center;font-size:14px;color:var(--muted)">Is that what you said?</p>
          ${selfGradeRow("ps")}
        </div>`;
        speak(s.ar, 0.85);
        wireSelfGrade("ps", s.key, g => { asked++; if (g.ok) right++; gradeSentence(s, g.ok, null, false, g.grade); vary(s); });
      });
      const showProduced = (sn, ok, heard) => {
        app.innerHTML = head() + `<div class="card">${bar()}
          <p style="text-align:center;font-size:16px">${ok ? "✓ right" : "✗ not quite"}${heard ? ` — heard “${esc(heard)}”` : ""}</p>
          <div class="q-ar arabic" dir="rtl">${esc(sn.ar)}</div>
          ${sn.tr ? `<p class="q-tr">${esc(sn.tr)}</p>` : ""}
          <div style="text-align:right;direction:rtl">${wordsHtmlFor(sn)}</div>
          <div class="row"><button class="primary" id="next">Next</button></div>
        </div>`;
        speak(sn.ar, 0.85);
        document.getElementById("next").onclick = () => vary(sn);
      };
      const submit = show => {
        const inp = document.getElementById("ans");
        const m = show ? null : writeMatchAr(inp.value, s.ar);
        const ok = !!(m && m.ok);
        asked++; if (ok) right++;
        gradeSentence(s, ok, m);
        app.innerHTML = head() + `<div class="card">${bar()}
          <p style="text-align:center;font-size:16px">${show ? "" : ok ? "✓ right" : (m && m.right ? `${m.right} of ${m.total} words` : "✗ not quite")}</p>
          <div class="q-ar arabic" dir="rtl">${esc(s.ar)}</div>
          ${s.tr ? `<p class="q-tr">${esc(s.tr)}</p>` : ""}
          <div style="text-align:right;direction:rtl">${wordsHtmlFor(s)}</div>
          <div class="row"><button class="primary" id="next">Next</button></div>
        </div>`;
        speak(s.ar, 0.85);
        document.getElementById("next").onclick = () => vary(s);
      };
      document.getElementById("chk").onclick = () => submit(false);
      document.getElementById("skip").onclick = () => submit(true);
    }

    /* 4 — variations. Only ever VERIFIED mutations (the conjugation table), never
       invented Arabic, and never a mutation of an ayah: revelation supplies the
       pattern, everyday Arabic supplies the drill. Sentences with no verified
       variation skip this step rather than fake one. */
    function vary(s) {
      const opts = (s.vary || []).filter(v => normalizeAr(v.ar) !== normalizeAr(s.ar));
      if (!opts.length) return next();
      const pick = opts[(i * 3) % opts.length];
      app.innerHTML = head() + `<div class="card">${bar()}
        <div class="crumb">same sentence, one thing changed</div>
        <div class="q-en">${esc(pick.en)}</div>
        <p style="text-align:center;font-size:13px;color:var(--muted)">You just wrote “${esc(s.en)}”. Change it.</p>
        <input id="ans" dir="rtl" style="width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:10px;font-size:22px;text-align:center">
        <div class="row"><button class="primary" id="chk">Check</button><button id="skip">show me</button><button class="small" id="ansKb">⌨ keys</button></div>
      </div>`;
      wireAnswer("ans", "chk");
      const done = show => {
        const inp = document.getElementById("ans");
        const m = show ? null : writeMatchAr(inp.value, pick.ar);
        const ok = !!(m && m.ok);
        asked++; if (ok) right++;
        logEvent({ e: "vary", sentence: s.key, ok, form: pick.verb || "" });
        app.innerHTML = head() + `<div class="card">${bar()}
          <p style="text-align:center;font-size:16px">${show ? "" : ok ? "✓ right" : "✗ not quite"}</p>
          <div class="q-ar arabic" dir="rtl">${esc(pick.ar)}</div>
          <div class="q-en" style="font-size:15px;color:var(--muted)">${esc(pick.en)}</div>
          <div class="row"><button class="primary" id="next">Next</button></div>
        </div>`;
        speak(pick.ar, 0.85);
        document.getElementById("next").onclick = next;
      };
      document.getElementById("chk").onclick = () => done(false);
      document.getElementById("skip").onclick = () => done(true);
    }

    step();
  }

  /* ---- hands-free ----
     Same material, no taps: the sentence's meaning, then the sentence. Three
     oversized targets while it plays (his 2026-08-30 ask) — got it / missed it /
     pause — and a tap grades the sentence and every word in it for real. */
  function handsFreeRun() {
    let i = 0, pass = 1, paused = false, timer = null, token = 0;
    let graded = 0, right = 0;
    const PASSES = 2;

    app.innerHTML = head("Hands-free. It plays on its own — tap only if you want to mark one.") + `
      <div class="card">
        <div class="hands"><div class="w" id="hw">…</div>
          <p style="color:var(--muted);font-size:15px;min-height:22px" id="hs"></p></div>
        <div class="prog"><i id="hp" style="width:0%"></i></div>
        <div style="display:flex;gap:10px;margin-top:16px">
          <button id="hno"  style="flex:1;padding:22px 8px;font-size:17px">✗ missed it</button>
          <button class="primary" id="hyes" style="flex:1;padding:22px 8px;font-size:17px">✓ got it</button>
        </div>
        <div style="display:flex;gap:10px;margin-top:10px">
          <button id="hpause" style="flex:1;padding:16px 8px;font-size:16px">⏸ Pause</button>
          <button id="hstop"  style="flex:1;padding:16px 8px;font-size:16px">Finish</button>
        </div>
        <p style="font-size:12.5px;color:var(--muted);margin:10px 0 0" id="hcount"></p>
      </div>`;

    const w = document.getElementById("hw"), sub = document.getElementById("hs"), bar = document.getElementById("hp");
    const countEl = document.getElementById("hcount"), pauseBtn = document.getElementById("hpause");

    const clearTimer = () => { if (timer) { clearTimeout(timer); timer = null; } };
    const later = (fn, ms) => { const t = token; clearTimer(); timer = setTimeout(() => { if (t === token && !paused) fn(); }, ms); };

    document.getElementById("hyes").onclick = () => mark(true);
    document.getElementById("hno").onclick = () => mark(false);
    document.getElementById("hstop").onclick = () => { token++; clearTimer(); stopSpeak(); finish(right, graded, "hands", graded === 0); };
    pauseBtn.onclick = () => {
      if (paused) { paused = false; pauseBtn.textContent = "⏸ Pause"; step(); }
      else { paused = true; token++; clearTimer(); stopSpeak(); pauseBtn.textContent = "▶ Resume"; sub.textContent = "paused"; }
    };

    function mark(ok) {
      if (paused || i >= items.length) return;
      const s = items[i].s;
      gradeSentence(s, ok, null, true);
      graded++; if (ok) right++;
      countEl.textContent = `${right} of ${graded} marked right`;
      token++; clearTimer(); stopSpeak();
      sub.textContent = (ok ? "✓ " : "✗ ") + s.en;
      i++;
      later(step, 700);
    }

    function step() {
      if (paused) return;
      if (i >= items.length) { if (++pass > PASSES) return finish(right, graded, "hands"); i = 0; }
      const s = items[i].s;
      const total = items.length * PASSES, at = (pass - 1) * items.length + i;
      bar.style.width = Math.round(100 * at / total) + "%";
      const t = ++token;
      // meaning first, then the Arabic — the same order as on screen
      w.textContent = s.en;
      sub.textContent = pass === 1 ? "how would you say it?" : "say it with me";
      speak(s.en, 1.0, () => {
        if (t !== token || paused) return;
        later(() => {
          w.textContent = s.ar;
          speak(s.ar, 0.85, () => {
            if (t !== token || paused) return;
            i++; later(step, 400);
          });
        }, pass === 1 ? 2600 : 900);
      });
    }
    step();
  }

  function finish(right, total, how, stopped) {
    if (!stopped) logEvent({ e: "chunk-done", chunk: chunk.id, lesson: lesson.id, milestone: ms.id, mode: how, right, total });
    try { if (typeof syncSoon === "function") syncSoon(); } catch (e) {}
    app.innerHTML = `
      <h1>${stopped ? "Stopped" : "Lesson done"}</h1>
      <div class="card">
        ${total ? `<p style="font-size:16px;margin-top:0">${right} of ${total} without help.</p>` : ""}
        <p style="font-size:14.5px;color:var(--muted)">${esc(ms.name)} · ${esc(lesson.title)}</p>
        <p style="font-size:15px">${how === "hands"
          ? "That was a listening pass — it doesn't prove the lesson on its own. The 3-minute test does."
          : "Now prove it: the test takes about three minutes and marks the lesson done at 80."}</p>
        <div class="row" style="justify-content:flex-start">
          <a href="learn.html?test=1&lesson=${encodeURIComponent(lesson.id)}"><button class="primary">Take the test · ~3 min</button></a>
          <a href="index.html"><button>Back</button></a>
        </div>
      </div>`;
  }
}

/* ======================= A TEST — one engine, three scopes =======================
   One lesson (~3 min), a week's seven (~7 min), or a milestone. Scoring is per
   lesson at 80 in every case, so clearing a lesson clears it everywhere. */
async function runTest(lessonIds, ctx, state, label, opts) {
  opts = opts || {};
  const attempts = (ctx.log || []).filter(e => e && e.e === "exam-done").length;
  const all = state.milestones.flatMap(m => m.lessons);
  const open = lessonIds.filter(id => { const l = all.find(x => x.id === id); return l && !l.mastered; });
  // opts.all: cover the whole scope even where it is already proved (the class test)
  const use = opts.all || !open.length ? lessonIds : open;
  const ex = Curriculum.examForLessons(use, ctx, { attempt: attempts + 1, state, seed: use.length + (label ? label.length : 3) });
  if (!ex.items.length) {
    app.innerHTML = `<h1>Nothing left to prove</h1><p>Everything here is already proved and still fresh.</p>
      <div class="row" style="justify-content:flex-start"><a href="index.html"><button class="primary">Back</button></a></div>`;
    return;
  }
  const resolved = await resolveCards(ex.items.map(i => i.key));
  /* HE IS TESTED IN SENTENCES (his rule, 2026-08-30: "you have to maintain a
     vocab list for me which you test and get me to repeat in sentence format").
     The exam still SELECTS words — they are what a lesson owns and what gets
     scheduled — but a production question asks for the whole sentence the word
     lives in, and the question is marked on whether that word landed. Short
     sentences only: a nine-word ayah is a fair thing to study and an unfair
     thing to make him type. */
  const qs = ex.items.map((it, i) => {
    const q = Object.assign({}, it, { v: resolved[i] && resolved[i].v });
    if (q.form === "prod") {
      const s = Curriculum.sentencesFor([q.key], ctx, { limit: 1 })[0];
      if (s && (s.words || []).length >= 2 && (s.words || []).length <= 6) q.sentence = s;
    }
    return q;
  }).filter(q => q.v && q.v.ar);

  const title = label || (use.length === 1 ? (all.find(l => l.id === use[0]) || {}).title : "The test");
  const scope = Curriculum.scopeKey(use);
  const prior = Curriculum.scopeHistory(ctx.log, use);
  primeSpeak();
  logEvent({ e: "exam-start", lessons: use, scope, total: qs.length, attempt: attempts + 1 });
  const answers = [];
  let i = 0;

  const priorLine = prior
    ? `<span class="pill">last time: ${prior.last}${prior.attempts > 1 ? ` · ${prior.scores.join(" → ")}` : ""}</span>`
    : "";
  const head = `<div class="crumb">Test</div><h1 style="margin-top:0">${esc(title)}</h1>
    <p class="sub">${qs.length} questions, about ${ex.minutes} minute${ex.minutes === 1 ? "" : "s"}. Pass mark ${Curriculum.PASS}.
    ${ex.sampled ? `A sample across ${use.length} lessons${ex.clearable ? "" : " — too few each to clear a lesson, so this one is a check"}.` : "Each lesson is scored on its own."}
    ${priorLine}</p>`;

  /* ---------- ONE CARD PER QUESTION ----------
     His report, 2026-08-30: "when i click check it just moves to next word. the
     testing setup doesnt work very well. please think about this deeply and fix
     it. test is crucial for me to get right."

     He is right, and the old flow had three faults that all pointed the same way
     — it was never clear what had just happened:

       1. a CORRECT answer advanced silently. He never saw that he was right, nor
          the spelling he should have written, nor the transliteration. Only wrong
          answers got a screen, so the test taught him nothing when he was right.
       2. a MEANING question was self-graded — the answer appeared and he told the
          site whether he had had it, which proves nothing.
       3. every reveal was a page swap, so the question he had just answered was
          gone before he could compare it against the answer.

     So: one card per question, and it never navigates. He answers in it, the
     verdict and the full answer appear INSIDE it, and it advances only when he
     says Next. Everything is marked where the site can mark it — typed English
     for meaning and by-ear, typed Arabic for production — and the four
     spaced-repetition buckets sit on every card as an OVERRIDE.

     To be clear about which drives which, because he asked (2026-08-30: "is it
     baking in the spaced repetition engine automatically based on my answer? …
     i wont do it for every word"): the ANSWER schedules the card, every time,
     with no tapping. Right moves it up a box — 1, 3, 7, 14, 30 days — and wrong
     drops it to box 0 and ten minutes. The four buttons exist only for the cases
     the answer cannot express ("I know this one, stop asking"), and when he taps
     one it REPLACES the automatic grade rather than being overwritten by it.

     Enter is bound throughout: answer, Enter, read, Enter. That is the whole loop. */
  /* The reveal can be REPLAYED — his note, 2026-08-31, written mid-test: "can i
     hear things again on this page". He abandoned that attempt right after. The
     word (and the sentence, when the question came wrapped in one) plays again
     as often as he likes; hearing the answer he just missed IS the study. */
  const answerHtml = q => `<div class="q-ar arabic" style="margin-top:10px">${esc(q.v.ar)}</div>
    <div class="q-en">${esc(q.v.en)}</div>${q.v.tr ? `<p class="q-tr">${esc(q.v.tr)}</p>` : ""}
    ${q.v.note ? `<p style="font-size:13px;color:var(--muted);line-height:1.7;text-align:center">${esc(q.v.note)}</p>` : ""}
    <div class="row" style="margin-top:4px">
      <button type="button" id="jHear">🔊 hear it</button>
      ${q.sentence ? `<button type="button" id="jHearSent">🔊 the sentence</button>` : ""}
    </div>`;
  function wireAnswerAudio(q) {
    const hw = document.getElementById("jHear");
    if (hw) hw.onclick = () => speak(q.v.ar, 0.85);
    const hs = document.getElementById("jHearSent");
    if (hs) hs.onclick = () => speak(q.sentence.ar, 0.85);
  }

  /* Back from an UNANSWERED card: nothing has been recorded for this one, so only
     the previous question's answer comes off the score. */
  function wireBack() {
    const bk = document.getElementById("bk");
    if (bk && i > 0) bk.onclick = () => { answers.pop(); i--; ask(); };
  }

  ask();
  function ask() {
    if (_enterOff) _enterOff();
    if (i >= qs.length) return done();
    const q = qs[i];
    const n = `<div class="crumb">${i + 1} of ${qs.length} · ${esc(q.lessonTitle)}${q.form === "ear" ? " · by ear" : ""}</div>
      <div class="prog"><i style="width:${Math.round(100 * i / qs.length)}%"></i></div>`;

    if (q.form === "ear") {
      app.innerHTML = head + `<div class="card">${n}
        <p style="text-align:center;font-size:15px;margin-top:14px">Listen. What does it mean?</p>
        <div class="row"><button class="primary" id="play" style="font-size:17px">🔊 play</button></div>
        ${meaningPanel("j", i > 0)}</div>`;
      document.getElementById("play").onclick = () => speak(q.v.ar, 0.85);
      speak(q.v.ar, 0.85);
      wireMeaning("j", q.key, q.v.en, settle);
      wireBack();
    } else if (q.form === "mean") {
      app.innerHTML = head + `<div class="card">${n}
        <div class="q-ar arabic">${esc(q.v.ar)}</div>
        <p style="text-align:center;font-size:15px;color:var(--muted)">What does it mean?</p>
        ${meaningPanel("j", i > 0)}</div>`;
      wireMeaning("j", q.key, q.v.en, settle);
      wireBack();
    } else {
      const sent = q.sentence;
      const target = sent ? sent.ar : q.v.ar;
      app.innerHTML = head + `<div class="card">${n}
        <div class="q-en">${esc(sent ? sent.en : q.v.en)}</div>
        <p style="text-align:center;font-size:13px;color:var(--muted)">${sent
          ? `Write the whole sentence — it is marked on <span class="arabic" style="font-size:16px">${esc(q.v.ar)}</span>`
          : "Type it the way it sounds — it turns into Arabic as you go"}</p>
        <input id="ans" dir="rtl" style="width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:10px;font-size:22px;text-align:center">
        <div id="jRev"></div>
        <div class="row" id="jRow">${BACK_BTN(i > 0)}<button class="primary" id="chk">Check</button><button id="skip">show me</button><button class="small" id="ansKb">⌨ keys</button></div>
        ${micRow("mic")}
        <div class="row" style="gap:6px;align-items:center;justify-content:center;margin-top:2px">
          <span style="font-size:12px;color:var(--muted)" title="Your answer already schedules this card. These only override it.">scheduled from your answer · override:</span><span id="jBkt"></span>
        </div>
        ${TYPING_HELP}</div>`;
      // a TEST excludes the answer's own words, so a chip can never give it away
      wireAnswer("ans", "chk", [target]);
      wireBack();
      wireMic("mic", target, (ok, heard) => {
        const rev = document.getElementById("jRev");
        if (ok) {
          rev.innerHTML = `<p style="text-align:center;font-size:16px;margin:10px 0 0">✓ right — heard “${esc(heard)}”</p>`;
          document.getElementById("ans").disabled = true;
          settle(true, false, target);
          return;
        }
        // the recogniser is the weak link here, so he judges, not it
        rev.innerHTML = `<p style="text-align:center;font-size:15px;margin:10px 0 0">
            It heard “<span class="arabic" dir="rtl">${esc(heard)}</span>”, which isn't a match —
            but Arabic recognition is unreliable. Was what you said right?</p>
          <div class="q-ar arabic" dir="rtl" style="font-size:24px">${esc(target)}</div>
          ${selfGradeRow("tj")}
          <div class="row"><button id="micRetry">🎤 try again</button></div>`;
        const rt = document.getElementById("micRetry");
        if (rt) rt.onclick = () => { rev.innerHTML = ""; document.getElementById(id).click(); };
        wireSelfGrade("tj", q.key, g => settle(g.ok, false, target, g.grade));
      }, () => {
        // said out loud, judged by him — the answer is shown first so the
        // judgment is against the real thing, not against memory
        document.getElementById("jRev").innerHTML =
          `<div class="q-ar arabic" dir="rtl" style="margin-top:10px">${esc(target)}</div>
           <p style="text-align:center;font-size:14px;color:var(--muted)">Is that what you said?</p>
           ${selfGradeRow("tk")}`;
        speak(target, 0.85);
        wireSelfGrade("tk", q.key, g => {
          document.getElementById("jRev").innerHTML =
            `<p style="text-align:center;font-size:16px;margin:10px 0 0">${g.verdict}</p>`;
          settle(g.ok, false, target, g.grade);
        });
      });
      mountBucketBar(document.getElementById("jBkt"), q.key, b => settle(b !== "repeat", true));
      const check = shown => {
        const inp = document.getElementById("ans");
        const m = shown ? null : writeMatchAr(inp.value, target);
        let ok = false;
        if (shown) ok = false;
        else if (!sent) ok = m.ok || arMatch(inp.value, q.v.ar);
        else {
          // the question is this WORD; the sentence is only how it was asked
          const j = (m.words || []).findIndex(t => normalizeAr(t) === normalizeAr(q.v.ar));
          ok = j >= 0 ? m.hits[j] !== "miss" : m.ok;
          // the rest of the sentence still counts as revision, as it does in a lesson
          (sent.words || []).forEach(w => {
            const cards = w.keys && w.keys.length ? w.keys : (w.key ? [w.key] : []);
            if (!cards.length || normalizeAr(w.ar) === normalizeAr(q.v.ar)) return;
            const k = (m.words || []).findIndex(t => normalizeAr(t) === normalizeAr(w.ar));
            if (k >= 0) cards.forEach(c => gradeCard(c, m.hits[k] !== "miss" ? "good" : "again"));
          });
        }
        // what he wrote, marked word by word, so a near miss reads as a near miss
        const detail = sent && m ? `<p style="text-align:center;font-size:19px;direction:rtl" class="arabic">${wordsHtml(m)}</p>` : "";
        document.getElementById("jRev").innerHTML =
          `<p style="text-align:center;font-size:16px;margin:10px 0 0">${shown ? "the answer:" : ok ? "✓ right" : (m && m.right ? `${m.right} of ${m.total} words` : "✗ not quite")}</p>${detail}`;
        inp.disabled = true;
        settle(ok, false, target);
      };
      document.getElementById("chk").onclick = () => check(false);
      document.getElementById("skip").onclick = () => check(true);
    }

    /* ---- the verdict, in the same card, and it waits for him ---- */
    function settle(ok, bucketed, speakAr, grade) {
      if (settle.done) return;                 // a bucket tap after answering must not double-count
      settle.done = true;
      answers.push({ key: q.key, lessonId: q.lessonId, lessonTitle: q.lessonTitle, form: q.form, ok: !!ok });
      // an explicit bucket IS his scheduling decision — don't overwrite it.
      // A stumble is a CORRECT answer that must not advance the card: the score
      // keeps it, the schedule holds it — see gradeCard "hard".
      if (!bucketed) gradeCard(q.key, grade || (ok ? "good" : "again"));     // the test is also revision
      if (q.form === "ear") logEvent({ e: "alisten-grade", key: q.key, ok: !!ok, src: "test" });

      const rev = document.getElementById("jRev");
      rev.insertAdjacentHTML("beforeend", answerHtml(q));
      wireAnswerAudio(q);
      const row = document.getElementById("jRow");
      const next = BACK_BTN(i > 0) + `<button class="primary" id="nx" style="min-width:150px">Next →</button>`;
      if (row) row.innerHTML = next;
      else rev.insertAdjacentHTML("afterend", `<div class="row">${next}</div>`);
      speak(speakAr || q.v.ar, 0.85);
      const nx = document.getElementById("nx");
      nx.onclick = () => { i++; ask(); };
      // this card IS answered, so its own answer comes off too — two pops, not one
      const bk = document.getElementById("bk");
      if (bk && i > 0) bk.onclick = () => { answers.pop(); answers.pop(); i--; ask(); };
      nx.focus();
      onEnterOnce(() => nx.click());
    }
  }

  function done() {
    const r = Curriculum.milestoneScoreOf(answers);
    // a score from too few questions reports but must not clear a lesson
    const lessons = ex.clearable ? r.lessons : {};
    logEvent({ e: "exam-done", lessons: lessons, reported: r.lessons, scope, attempt: attempts + 1,
               score: r.score, correct: r.correct, total: r.total, sections: r.sections });
    try { if (typeof syncSoon === "function") syncSoon(); } catch (e) {}

    const cleared = Object.keys(r.lessons).filter(id => r.lessons[id] >= Curriculum.PASS);
    const stillOpen = Object.keys(r.lessons).filter(id => r.lessons[id] < Curriculum.PASS);
    const band = Curriculum.examBand(r.score);
    app.innerHTML = `
      <h1 style="margin-bottom:4px">${esc(title)}</h1>
      <div class="card" style="border-color:var(--accent)">
        <div style="text-align:center">
          <div class="big">${r.score}</div>
          <div style="font-size:15px;font-weight:600;text-transform:capitalize">${esc(band.band)}</div>
          ${prior ? `<div style="font-size:13.5px;color:${r.score > prior.last ? "var(--accent)" : "var(--muted)"};font-weight:600">
              ${r.score > prior.last ? `up from ${prior.last} (+${r.score - prior.last})`
                : r.score === prior.last ? `same as last time (${prior.last})`
                : `down from ${prior.last} (${r.score - prior.last})`}</div>
            <div style="font-size:12.5px;color:var(--muted)">${prior.scores.concat([r.score]).join(" → ")}</div>` : ""}
          ${r.sections.ear !== null ? `<div style="font-size:13px;color:var(--muted)">by ear: ${r.sections.ear}%</div>` : ""}
        </div>
        <div style="margin-top:16px">
          ${Object.keys(r.lessons).map(id => `
            <div class="lrow">
              <span>${r.lessons[id] >= Curriculum.PASS && ex.clearable ? "✓ " : ""}${esc(r.lessonTitles[id])}</span>
              <strong style="color:${r.lessons[id] >= Curriculum.PASS ? "var(--accent)" : "var(--muted)"}">${r.lessons[id]}</strong>
            </div>`).join("")}
        </div>
        <p style="font-size:14.5px;margin-top:14px">
          ${!ex.clearable ? `This was a spread across ${use.length} lessons — enough to show where you stand, not enough per lesson to mark them done. Take a lesson's own 3-minute test to clear it.`
            : cleared.length ? `<strong>Proved:</strong> ${esc(cleared.map(id => r.lessonTitles[id]).join(", "))}.${stillOpen.length ? ` Still open: ${esc(stillOpen.map(id => r.lessonTitles[id]).join(", "))} — those come back, the rest won't.` : ""}`
            : `Nothing cleared this time — 80 is the bar. Those lessons come back; anything you've already proved won't.`}
        </p>
        <div class="row" style="justify-content:flex-start">
          <a href="index.html"><button class="primary">Back to your lessons</button></a>
          <a href="${use.length === 1 ? `learn.html?test=1&lesson=${encodeURIComponent(use[0])}` : `learn.html?lessons=${encodeURIComponent(use.join(","))}&label=${encodeURIComponent(title)}`}"><button>Take it again</button></a>
        </div>
      </div>`;
  }
}

/* ======================= THE INTERLEAVED BURSTS =======================
   His spec, 2026-08-30: "at times I memorise some vocabulary to help me along and
   get me to build sentences quicker. then at times i learn some grammar which
   also helps build sentences quicker" — then "okay schedule that in. also it is
   based on probability of use."

   Curriculum.burstsFor() decides WHEN and WHAT (js/curriculum.js); these two
   functions are how they are run. Both are short on purpose: the week is still
   overwhelmingly sentences, and a burst that ran long would be a lesson wearing
   a different hat. */

/* ---- vocabulary: the commonest words he does not hold, met and then recalled ----
   His format, not a flashcard deck: the table first (recall-then-show, his own
   preference), then a recall pass that drills ONLY the ones he missed until none
   are left, then each word shown inside a real sentence so it leaves as language
   rather than as an entry. Every row carries the four spaced-repetition buckets. */
async function runVocabBurst(ctx, state) {
  const weeks = Curriculum.weekPlan(ctx, state);
  const cw = weeks[Curriculum.currentWeek(weeks) - 1];
  /* ONLY THE ONES HE MISSED. His ask, 2026-08-30: "in vocabulary burst, also
     give me option to run only the ones i couldnt do."

     Right, and it is the cheapest win on the page: after a burst the words he
     already had are settled and re-drilling them is time he does not have. The
     misses are logged by KEY on the way out, so this rebuilds the short list from
     the last run rather than recomputing from frequency — otherwise it would
     quietly hand him a different set of words and call it the same burst. */
  let words;
  const onlyMissed = P.get("only") === "missed";
  if (onlyMissed) {
    const last = (ctx.log || []).filter(e => e && e.e === "burst-done" && e.kind === "vocab" && (e.missed || []).length).slice(-1)[0];
    const want = new Set((last && last.missed) || []);
    const byKey = new Map();
    Curriculum.wordIndex(ctx).forEach(w => byKey.set(w.key, w));
    words = [...want].map(k => byKey.get(k)).filter(Boolean);
  } else {
    words = Curriculum.vocabBurst(ctx, {
      exclude: cw ? cw.lessons.flatMap(x => x.lesson.keys || []) : [],
    });
  }
  if (!words.length) {
    app.innerHTML = onlyMissed
      ? `<h1>Nothing missed</h1><p>Your last burst had no misses to redo.</p>
         <div class="row" style="justify-content:flex-start">
           <a href="learn.html?burst=vocab"><button class="primary">Run a fresh burst</button></a>
           <a href="index.html"><button>Back</button></a></div>`
      : `<h1>Nothing to add</h1>
         <p>Every high-frequency word the site knows about is already yours, or already in this week's lessons.</p>
         <div class="row" style="justify-content:flex-start"><a href="index.html"><button class="primary">Back</button></a></div>`;
    return;
  }
  primeSpeak();
  logEvent({ e: "burst-start", kind: "vocab", n: words.length });
  /* SCORED ON THE FIRST ATTEMPT ONLY. His ask, 2026-08-30: "can i get some score
     for vocabulary burst as well, so that i get a sense of if i should be
     repeating it." The drill loops until nothing is left, so by the end
     everything is right by construction and a final tally would always read 100%
     — useless. What tells him whether to run it again is how many he had cold,
     before any prompting, which is what this counts. Rounds are reported too: a
     word that took four goes has not stuck. */
  const first = { right: 0, seen: new Set(), missed: [] };
  let roundsTaken = 1;
  const head = onlyMissed
    ? `<div class="crumb">📇 Vocabulary burst · the ones you missed</div>
       <h1 style="margin-top:0">${words.length} to go back over</h1>
       <p class="sub">Just the ones you didn't have first time last round. The rest are settled — no point
       drilling them again.</p>`
    : `<div class="crumb">📇 Vocabulary burst · between the lessons</div>
       <h1 style="margin-top:0">${words.length} words worth knowing</h1>
       <p class="sub">Not a new topic — these are the commonest words in the Qur'an and in everyday
       Arabic that you don't hold yet, so each one buys you a lot of sentences. About four minutes.</p>`;

  table();

  function rank(w) {
    // per-10,000 words of real Arabic — the measure the whole list is sorted by
    return w.per10k >= 10 ? "very common" : w.per10k >= 2 ? "common" : "worth having";
  }

  function table() {
    app.innerHTML = head + `<div class="card">
      <p class="sub" style="margin-top:0">Try to recall each one before you look. Tap 🔊 to hear it.</p>
      <table class="tbl">${words.map((w, i) => `
        <tr>
          <td class="ar arabic">${esc(w.ar)}</td>
          <td style="width:34px"><button class="small" data-say="${i}">🔊</button></td>
          <td><span class="veil" data-veil="${i}">${esc(w.en)}</span>
            <div style="font-size:12.5px;color:var(--muted)">${esc(w.tr)} · ${rank(w)}</div>
            <div class="bucket-slot" data-b="${i}"></div></td>
        </tr>`).join("")}</table>
      <div class="row"><button id="all">Reveal all</button><button class="primary" id="go">Now recall them →</button></div>
    </div>`;
    document.querySelectorAll("[data-say]").forEach(b => b.onclick = () => speak(words[+b.dataset.say].ar, 0.85));
    document.querySelectorAll("[data-veil]").forEach(v => v.onclick = () => v.classList.add("on"));
    document.querySelectorAll("[data-b]").forEach(sl => mountBucketBar(sl, words[+sl.dataset.b].key));
    document.getElementById("all").onclick = () => document.querySelectorAll(".veil").forEach(v => v.classList.add("on"));
    document.getElementById("go").onclick = () => drill(words.slice(), 1);
  }

  /* Only the misses come back. Four rounds is the cap — past that it is not a
     burst any more, and a word he cannot produce after four goes is better met
     inside a sentence next week than ground down here. */
  function drill(queue, round) {
    roundsTaken = Math.max(roundsTaken, round);
    if (!queue.length || round > 4) return finish();
    const miss = [];
    const answered = new Set();     // so stepping back and forth cannot double-log a miss
    let at = 0;
    step();
    function step() {
      if (at >= queue.length) return drill(miss, round + 1);
      const w = queue[at];
      app.innerHTML = head + `<div class="card">
        <div class="crumb">round ${round} · ${at + 1} of ${queue.length}</div>
        <div class="prog"><i style="width:${Math.round(100 * at / queue.length)}%"></i></div>
        <div class="q-en">${esc(w.en)}</div>
        <input id="ans" dir="rtl" style="width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:10px;font-size:22px;text-align:center">
        <div id="jRev"></div>
        <div class="row" id="jRow">${BACK_BTN(at > 0)}<button class="primary" id="chk">Check</button><button id="skip">show me</button><button class="small" id="ansKb">⌨ keys</button></div>
        ${micRow("bmic")}
        <div class="row" style="gap:6px;align-items:center;justify-content:center;margin-top:2px">
          <span style="font-size:12px;color:var(--muted)" title="Your answer already schedules this card. These only override it.">scheduled from your answer · override:</span><span id="jBkt"></span>
        </div>
        ${TYPING_HELP}</div>`;
      wireAnswer("ans", "chk", [w.ar]);
      wireBurstBack();
      wireMic("bmic", w.ar, (ok, heard) => {
        const rev = document.getElementById("jRev");
        rev.innerHTML = `<p style="text-align:center;font-size:16px;margin:10px 0 0">${
          ok ? `✓ right — heard “${esc(heard)}”` : `heard “${esc(heard)}” — not a match, but say it again if that was you`}</p>`;
        if (ok) { document.getElementById("ans").disabled = true; settle(true, false); }
      }, () => {
        document.getElementById("jRev").innerHTML =
          `<div class="q-ar arabic" dir="rtl" style="margin-top:10px">${esc(w.ar)}</div>
           <p style="text-align:center;font-size:14px;color:var(--muted)">Is that what you said?</p>
           ${selfGradeRow("bj")}`;
        speak(w.ar, 0.85);
        document.getElementById("ans").disabled = true;
        // clear the prompt before settling, or its dead buttons sit above the verdict
        wireSelfGrade("bj", w.key, g => {
          document.getElementById("jRev").innerHTML =
            `<p style="text-align:center;font-size:16px;margin:10px 0 0">${g.verdict}</p>`;
          settle(g.ok, false, g.grade);
        });
      });
      mountBucketBar(document.getElementById("jBkt"), w.key, b => settle(b !== "repeat", true));
      function wireBurstBack() {
        const bk = document.getElementById("bk");
        if (bk && at > 0) bk.onclick = () => { at--; step(); };
      }
      const check = shown => {
        const inp = document.getElementById("ans");
        const ok = !shown && (arMatch(inp.value, w.ar) || writeMatchAr(inp.value, w.ar).ok);
        document.getElementById("jRev").innerHTML =
          `<p style="text-align:center;font-size:16px;margin:10px 0 0">${shown ? "the answer:" : ok ? "✓ right" : "✗ not quite"}</p>`;
        inp.disabled = true;
        settle(ok, false);
      };
      document.getElementById("chk").onclick = () => check(false);
      document.getElementById("skip").onclick = () => check(true);
      function settle(ok, bucketed, grade) {
        if (settle.done) return;
        settle.done = true;
        if (!bucketed) (w.keys || [w.key]).forEach(k => gradeCard(k, grade || (ok ? "good" : "again")));
        if (!ok && !answered.has(at)) miss.push(w);
        answered.add(at);
        // only the first sight of a word counts toward the score
        if (round === 1 && !first.seen.has(w.key)) {
          first.seen.add(w.key);
          if (ok) first.right++; else first.missed.push(w.key);
        }
        document.getElementById("jRev").insertAdjacentHTML("beforeend",
          `<div class="q-ar arabic">${esc(w.ar)}</div><div class="q-en" style="font-size:15px;color:var(--muted)">${esc(w.en)}</div>
           ${w.example ? `<p style="text-align:center;font-size:17px;direction:rtl" class="arabic">${esc(w.example.ar)}</p>
             <p style="text-align:center;font-size:13px;color:var(--muted)">${esc(w.example.en)}</p>` : ""}`);
        document.getElementById("jRow").innerHTML =
          BACK_BTN(at > 0) + `<button class="primary" id="nx" style="min-width:150px">Next →</button>`;
        speak(w.example ? w.example.ar : w.ar, 0.85);
        wireBurstBack();
        const nx = document.getElementById("nx");
        nx.onclick = () => { at++; step(); };
        nx.focus();
        onEnterOnce(() => nx.click());
      }
    }
  }

  function finish() {
    if (_enterOff) _enterOff();
    const total = words.length;
    const score = Math.round(100 * first.right / (total || 1));
    logEvent({ e: "burst-done", kind: "vocab", n: total, score, firstTry: first.right, rounds: roundsTaken,
               keys: words.map(w => w.key), missed: first.missed });
    try { if (typeof syncSoon === "function") syncSoon(); } catch (e) {}
    /* The verdict is about whether to run it again, which is what he asked for —
       not a grade. Cold recall of a word he met minutes ago is a low bar, so the
       thresholds are set accordingly. */
    const verdict = score >= 75
      ? "These are yours. The review deck will bring them back on its own — no need to repeat this."
      : score >= 40
        ? "Worth running again tomorrow. About half went in; a second pass usually finishes the job."
        : "Run it again tomorrow, and again the day after. Most of these did not stick on first sight, which is normal for words this new.";
    const band = score >= 75 ? "var(--accent)" : score >= 40 ? "var(--warn,#d97706)" : "var(--red,#c0392b)";
    app.innerHTML = `<h1>Burst done</h1>
      <div class="card" style="border-color:${band}">
        <div style="text-align:center">
          <div class="big" style="color:${band}">${score}</div>
          <div style="font-size:15px;font-weight:600">${first.right} of ${total} on first sight</div>
          <div style="font-size:13px;color:var(--muted)">${roundsTaken === 1 ? "one round" : roundsTaken + " rounds to clear them all"}</div>
        </div>
        <p style="font-size:15px;margin:14px 0 0">${verdict}</p>
      </div>
      <div class="card">
        <p style="margin-top:0">${total} words, each one now inside a sentence you can use. They join the
        review deck like everything else — and anything you marked ⊘ won't come back.</p>
        <table class="tbl">${words.map(w => `<tr>
          <td class="ar arabic">${esc(w.ar)}</td>
          <td>${esc(w.en)}${w.example ? `<div style="font-size:13px;color:var(--muted);direction:rtl;text-align:right" class="arabic">${esc(w.example.ar)}</div>` : ""}</td>
        </tr>`).join("")}</table>
        <div class="row" style="justify-content:flex-start">
          ${first.missed.length ? `<a href="learn.html?burst=vocab&only=missed"><button class="primary">↻ Just the ${first.missed.length} I missed</button></a>` : ""}
          <a href="index.html"><button class="${first.missed.length ? "" : "primary"}">Back to your lessons</button></a>
          <a href="learn.html"><button>Next lesson →</button></a>
        </div>
      </div>`;
  }
}

/* ---- grammar: the one rule that unlocks the most of what is coming ----
   Chosen by reach across the sentence bank, not by syllabus order, and shown once
   ever — the same pattern-seen log the in-lesson gate uses, so the two can never
   both spend a slot on the same rule. */
async function runGrammarBurst(ctx, state) {
  const weeks = Curriculum.weekPlan(ctx, state);
  const cw = weeks[Curriculum.currentWeek(weeks) - 1];
  const keys = cw ? cw.lessons.flatMap(x => x.lesson.keys || []) : [];
  const sents = Curriculum.sentencesFor(keys, ctx, { limit: 12, maxWords: 999 });
  const id = Curriculum.grammarBurst(ctx, { sentences: sents });
  let g = null;
  try { g = (await fetch("data/grammar.json").then(r => r.json())).patterns.find(p => p.id === id); } catch (e) {}
  if (!g) {
    app.innerHTML = `<h1>No rule due</h1><p>Every pattern the site teaches has already been explained to you once.</p>
      <div class="row" style="justify-content:flex-start"><a href="index.html"><button class="primary">Back</button></a></div>`;
    return;
  }
  primeSpeak();
  logEvent({ e: "pattern-seen", pattern: id, src: "burst" });
  logEvent({ e: "burst-start", kind: "grammar", pattern: id });
  const used = (ctx.bank.sentences || []).filter(s => s.pattern === id).length;
  const head = `<div class="crumb">📐 Grammar burst · between the lessons</div>
    <h1 style="margin-top:0">${esc(g.name)}</h1>
    <p class="sub">Worth three minutes because ${used} of the sentences you have still to learn use it.</p>`;

  app.innerHTML = head + `<div class="card">
    <div class="q-ar arabic" style="margin:6px 0">${esc(g.ar)}</div>
    <p style="font-size:15px;line-height:1.75">${esc(g.what)}</p>
    ${(g.examples || []).map(e => `
      <div style="border-top:1px solid var(--border);padding-top:8px;margin-top:8px">
        <div class="arabic" style="font-size:21px;direction:rtl;text-align:right">${esc(e.ar)}</div>
        <div style="font-size:13.5px;color:var(--muted)">${esc(e.en)}</div>
      </div>`).join("")}
    <div class="row"><button class="primary" id="go">Now use it →</button></div>
  </div>`;
  document.getElementById("go").onclick = () => drill(0);

  const items = (g.test || []).slice(0, 3);
  const gFirst = { right: 0, seen: new Set() };
  function drill(at) {
    if (at >= items.length) return finish();
    const t = items[at];
    const key = `gt:${id}:${at}`;
    app.innerHTML = head + `<div class="card">
      <div class="crumb">${at + 1} of ${items.length}</div>
      <div class="prog"><i style="width:${Math.round(100 * at / items.length)}%"></i></div>
      <div class="q-en">${esc(t.prompt)}</div>
      ${t.hint ? `<p class="q-tr">${esc(t.hint)}</p>` : ""}
      <input id="ans" dir="rtl" style="width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:10px;font-size:22px;text-align:center">
      <div id="jRev"></div>
      <div class="row" id="jRow">${BACK_BTN(at > 0)}<button class="primary" id="chk">Check</button><button id="skip">show me</button><button class="small" id="ansKb">⌨ keys</button></div>
      <div class="row" style="gap:6px;align-items:center;justify-content:center;margin-top:2px">
        <span style="font-size:12px;color:var(--muted)" title="Your answer already schedules this card. These only override it.">scheduled from your answer · override:</span><span id="jBkt"></span>
      </div>
      ${TYPING_HELP}</div>`;
    wireAnswer("ans", "chk", [t.ar]);
    if (at > 0) { const b0 = document.getElementById("bk"); if (b0) b0.onclick = () => drill(at - 1); }
    mountBucketBar(document.getElementById("jBkt"), key, b => settle(b !== "repeat", true));
    const check = shown => {
      const inp = document.getElementById("ans");
      const ok = !shown && writeMatchAr(inp.value, t.ar).ok;
      document.getElementById("jRev").innerHTML =
        `<p style="text-align:center;font-size:16px;margin:10px 0 0">${shown ? "the answer:" : ok ? "✓ right" : "✗ not quite"}</p>`;
      inp.disabled = true;
      settle(ok, false);
    };
    document.getElementById("chk").onclick = () => check(false);
    document.getElementById("skip").onclick = () => check(true);
    function settle(ok, bucketed) {
      if (settle.done) return;
      settle.done = true;
      if (!bucketed) gradeCard(key, ok ? "good" : "again");
      if (!gFirst.seen.has(at)) { gFirst.seen.add(at); if (ok) gFirst.right++; }
      document.getElementById("jRev").insertAdjacentHTML("beforeend",
        `<div class="q-ar arabic">${esc(t.ar)}</div>`);
      document.getElementById("jRow").innerHTML =
        BACK_BTN(at > 0) + `<button class="primary" id="nx" style="min-width:150px">Next →</button>`;
      speak(t.ar, 0.85);
      const bk = document.getElementById("bk");
      if (bk && at > 0) bk.onclick = () => drill(at - 1);
      const nx = document.getElementById("nx");
      nx.onclick = () => drill(at + 1);
      nx.focus();
      onEnterOnce(() => nx.click());
    }
  }

  function finish() {
    if (_enterOff) _enterOff();
    const total = items.length || 1;
    const score = Math.round(100 * gFirst.right / total);
    logEvent({ e: "burst-done", kind: "grammar", pattern: id, score, firstTry: gFirst.right, n: items.length });
    try { if (typeof syncSoon === "function") syncSoon(); } catch (e) {}
    const band = score >= 67 ? "var(--accent)" : "var(--warn,#d97706)";
    app.innerHTML = `<h1>Burst done</h1>
      <div class="card" style="border-color:${band}">
        <div style="text-align:center">
          <div class="big" style="color:${band}">${score}</div>
          <div style="font-size:15px;font-weight:600">${gFirst.right} of ${items.length} applied correctly</div>
        </div>
        <p style="font-size:15px;margin:14px 0 0">${score >= 67
          ? "The rule landed. It will not be explained again, but you will keep meeting it."
          : "Worth re-reading — it is on <a href=\"grammar.html\" style=\"color:var(--accent)\">Others</a>, and the sentences ahead will drill it anyway."}</p>
      </div>
      <div class="card">
        <p style="margin-top:0">${esc(g.name)} — you will meet it in ${used} of the sentences still ahead of you,
        and it won't be explained again.</p>
        <div class="row" style="justify-content:flex-start">
          <a href="index.html"><button class="primary">Back to your lessons</button></a>
          <a href="learn.html"><button>Next lesson →</button></a>
        </div>
      </div>`;
  }
}
</script>
