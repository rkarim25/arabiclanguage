/* Audio Toolbar Handling */
function playSingle(encodedAr) {
  stopAudio();
  const text = decodeURIComponent(encodedAr);
  speak(text, 0.85);
  logEvent({ e: "audio-play", text, type: "sentence", t: Date.now() });
}

function setupAudioSpeed() {
  const n = document.getElementById("spNorm");
  const s = document.getElementById("spSlow");
  const update = () => {
    const slow = speakSpeed() === "slow";
    n.style.fontWeight = slow ? "400" : "700";
    s.style.fontWeight = slow ? "700" : "400";
  };
  n.onclick = () => { setSpeakSpeed("normal"); update(); };
  s.onclick = () => { setSpeakSpeed("slow"); update(); };
  update();
}

let isPlaying = false;
let isPaused = false;
let currentWithPause = false;
let _sentenceToken = 0;

function stopAudio() {
  _sentenceToken++;
  isPlaying = false;
  isPaused = false;
  stopSpeak();
  clearAppMediaSession();
  document.querySelectorAll(".sheet-row, .s-card").forEach(c => c.classList.remove("playing", "active"));
  document.getElementById("btnPlayAll").classList.remove("playing");
  document.getElementById("btnPlayPauses").classList.remove("playing");
  const pBtn = document.getElementById("btnPause");
  if (pBtn) { pBtn.style.display = "none"; pBtn.textContent = "⏸ Pause"; }
  document.getElementById("btnStop").style.display = "none";
}

function pauseSentenceAudio() {
  if (!isPlaying || isPaused) return;
  _sentenceToken++;
  isPaused = true;
  stopSpeak();
  const pBtn = document.getElementById("btnPause");
  if (pBtn) pBtn.textContent = "▶ Resume";
  setAppMediaSession({ state: "paused" });
}

function resumeSentenceAudio() {
  if (!isPlaying || !isPaused) return;
  isPaused = false;
  const pBtn = document.getElementById("btnPause");
  if (pBtn) pBtn.textContent = "⏸ Pause";
  setAppMediaSession({ state: "playing" });
  playStep(currentWithPause);
}

function nextSentence() {
  if (!ACTIVE_SENTENCES || ACTIVE_SENTENCES.length === 0) return;
  _sentenceToken++;
  stopSpeak();
  audioIdx = (audioIdx + 1) % ACTIVE_SENTENCES.length;
  if (isPaused) {
    isPaused = false;
    const pBtn = document.getElementById("btnPause");
    if (pBtn) pBtn.textContent = "⏸ Pause";
  }
  playStep(currentWithPause);
}

function prevSentence() {
  if (!ACTIVE_SENTENCES || ACTIVE_SENTENCES.length === 0) return;
  _sentenceToken++;
  stopSpeak();
  audioIdx = audioIdx > 0 ? audioIdx - 1 : ACTIVE_SENTENCES.length - 1;
  if (isPaused) {
    isPaused = false;
    const pBtn = document.getElementById("btnPause");
    if (pBtn) pBtn.textContent = "⏸ Pause";
  }
  playStep(currentWithPause);
}

document.getElementById("btnPlayAll").onclick = () => {
  stopAudio();
  isPlaying = true;
  isPaused = false;
  currentWithPause = false;
  document.getElementById("btnStop").style.display = "inline-block";
  const pBtn = document.getElementById("btnPause");
  if (pBtn) { pBtn.style.display = "inline-block"; pBtn.textContent = "⏸ Pause"; }
  document.getElementById("btnPlayAll").classList.add("playing");
  audioIdx = 0;
  playStep(false);
};

document.getElementById("btnPlayPauses").onclick = () => {
  stopAudio();
  isPlaying = true;
  isPaused = false;
  currentWithPause = true;
  document.getElementById("btnStop").style.display = "inline-block";
  const pBtn = document.getElementById("btnPause");
  if (pBtn) { pBtn.style.display = "inline-block"; pBtn.textContent = "⏸ Pause"; }
  document.getElementById("btnPlayPauses").classList.add("playing");
  audioIdx = 0;
  playStep(true);
};

const pBtn = document.getElementById("btnPause");
if (pBtn) {
  pBtn.onclick = () => {
    if (isPaused) resumeSentenceAudio();
    else pauseSentenceAudio();
  };
}

document.getElementById("btnStop").onclick = stopAudio;

function playStep(withPause) {
  if (!isPlaying || isPaused || audioIdx >= ACTIVE_SENTENCES.length) {
    if (audioIdx >= ACTIVE_SENTENCES.length) stopAudio();
    return;
  }
  currentWithPause = !!withPause;
  const myTok = ++_sentenceToken;
  const s = ACTIVE_SENTENCES[audioIdx];
  document.querySelectorAll(".sheet-row, .s-card").forEach(c => c.classList.remove("playing", "active"));
  const row = document.getElementById("srow-" + audioIdx) || document.getElementById("scard-" + audioIdx);
  if (row) {
    row.classList.add("playing");
    row.scrollIntoView({ behavior: "smooth", block: "center" });
  }

  setAppMediaSession({
    metadata: {
      title: s.ar,
      artist: s.en,
      album: `Sentences · ${audioIdx + 1}/${ACTIVE_SENTENCES.length}`
    },
    onPlay: () => {
      if (isPaused) resumeSentenceAudio();
      else if (!isPlaying) {
        isPlaying = true;
        isPaused = false;
        playStep(withPause);
      }
    },
    onPause: pauseSentenceAudio,
    onNext: nextSentence,
    onPrev: prevSentence,
    onStop: stopAudio,
    state: isPaused ? "paused" : "playing"
  });

  const afterArabic = () => {
    if (myTok !== _sentenceToken || !isPlaying || isPaused) return;
    if (withPause) {
      playAudioGap(3, () => {
        if (myTok !== _sentenceToken || !isPlaying || isPaused) return;
        speak(s.en, 1.0, () => {
          if (myTok !== _sentenceToken || !isPlaying || isPaused) return;
          playAudioGap(1, () => {
            if (myTok !== _sentenceToken || !isPlaying || isPaused) return;
            audioIdx++;
            playStep(withPause);
          });
        });
      });
    } else {
      playAudioGap(1, () => {
        if (myTok !== _sentenceToken || !isPlaying || isPaused) return;
        audioIdx++;
        playStep(withPause);
      });
    }
  };
  if (s.ref && typeof playRecitation === "function") {
    const p = String(s.ref).split(":").map(Number);
    if (p[0] && p[1]) {
      playRecitation([{ n: p[0], ayah: p[1] }], afterArabic, err => { if (err) speak(s.ar, 0.85, afterArabic); });
      return;
    }
  }
  speak(s.ar, 0.85, afterArabic);
}

// Topic filter chips
document.getElementById("filterChips").addEventListener("click", e => {
  const b = e.target.closest("[data-filter]");
  if (!b) return;
  document.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
  b.classList.add("active");
  currentFilter = b.dataset.filter;
  load10Sentences();
});

function renderHomeChapStrip() {
  const el = document.getElementById("homeChapStrip");
  if (!el || typeof SRS !== "object" || !SRS.summaryCounts) return;
  const activeChap = getActiveWeeklyChapter();
  if (!activeChap) { el.innerHTML = ""; return; }
  const sentKeys = (activeChap.sentences || []).map((_, i) => `chap:${activeChap.num}:${i}`);
  const sc = SRS.summaryCounts(sentKeys);
  const gPct = sc.total ? Math.round((sc.green / sc.total) * 100) : 0;
  const aPct = sc.total ? Math.round((sc.amber / sc.total) * 100) : 0;
  const rPct = sc.total ? Math.round((sc.red / sc.total) * 100) : 0;
  const readyTest = sc.green >= 8;
  el.innerHTML = `
    <div class="card" style="padding:11px 15px;margin-bottom:0">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:6px;font-size:13px">
        <span style="display:inline-flex;align-items:center;gap:9px;flex-wrap:wrap">
          <a href="chapters.html?chap=${activeChap.id}" style="font-weight:700;color:var(--ink);text-decoration:none">📖 ${activeChap.title}</a>
          <span><span class="m-dot m-green"></span> <b>${sc.green}/${sc.total}</b></span>
          <span><span class="m-dot m-amber"></span> <b>${sc.amber}</b></span>
          <span><span class="m-dot m-red"></span> <b>${sc.red}</b></span>
          <span><span class="m-dot m-grey"></span> <b>${sc.grey}</b></span>
        </span>
        <span style="display:inline-flex;align-items:center;gap:8px;font-size:12.5px">
          ${new Date().getDay() === 6 ? `<a href="index.html?myday=1&amp;rehearse=1" style="color:var(--accent);font-weight:600;text-decoration:none">🎤 Rehearse for Sunday →</a>` : new Date().getDay() === 0 ? `<a href="class.html" style="color:var(--accent);font-weight:600;text-decoration:none">🧑‍🏫 Lesson Brief →</a>` : ""}
          ${readyTest ? `<a href="chapters.html?chap=${activeChap.id}#testBox" style="color:var(--accent);font-weight:700;text-decoration:none">🔥 Test Ready →</a>` : ""}
          <button type="button" class="pt-btn" onclick="focusPracticeUrl('?chap=${activeChap.id}')" style="font-size:11.5px;padding:2px 9px;color:var(--accent);border-color:var(--accent);font-weight:700" title="Focus Practice exclusively on Chapter ${activeChap.num} sentences &amp; Lesson Cards">⚡ Focus Ch ${activeChap.num}</button>
          <a href="chapters.html?chap=${activeChap.id}" style="color:var(--accent);font-weight:600;text-decoration:none">Open Chapter →</a>
        </span>
      </div>
      <div class="m-progress-track" title="Chapter ${activeChap.num}: ${sc.green} mastered · ${sc.amber} building · ${sc.red} needs work · ${sc.grey} unseen">
        <div class="m-progress-seg green" style="width:${gPct}%"></div>
        <div class="m-progress-seg amber" style="width:${aPct}%"></div>
        <div class="m-progress-seg red" style="width:${rPct}%"></div>
      </div>
    </div>
  `;
}
window.addEventListener("ats-mastery-updated", renderHomeChapStrip);

/* 📥 OFFLINE PACK — a quick open on a good signal loads what this week needs */
(async () => {
  try {
    if (typeof packTextsForKeys !== "function" || typeof offlinePack !== "function") return;
    const ctx = typeof curCtx === "function" ? await curCtx() : null;
    const hwc = typeof planHomework === "function" ? planHomework() : null;
    const packKeys = [];
    if (hwc && !hwc.past) packKeys.push(...(hwc.keys || []));
    const texts = await packTextsForKeys([...new Set(packKeys)], ctx);
    if (typeof Curriculum !== "undefined") {
      const weeks = Curriculum.weekPlan(ctx, Curriculum.milestoneState(ctx));
      const cw = Curriculum.currentWeek(weeks);
      const cwk = weeks[cw - 1];
      ((cwk && cwk.lessons) || []).forEach(l => {
        try { Curriculum.sentencesFor((l.lesson && l.lesson.keys) || [], ctx, { limit: 12, maxWords: 999 }).forEach(s => texts.push(s.ar, s.en)); } catch (e) {}
      });
    }
    const line = document.getElementById("packLine");
    if (line) line.id = "packLine";
    const r = await offlinePack(texts, (n, t) => { if (line) line.textContent = `📥 Offline pack: ${n} of ${t} clips ready…`; });
    if (line) {
      line.textContent = r.skipped
        ? "📥 Offline pack: needs a signal once — open this page on wifi and it loads itself"
        : `📥 Offline pack: ${r.n} of ${r.total} clips on this phone — this week's lessons and Sunday's words play with no signal`;
    }
    if (r.fetched) logEvent({ e: "pack", n: r.n, total: r.total, fetched: r.fetched });
    if (typeof offlinePackQuran === "function") {
      const activeChap = getActiveWeeklyChapter();
      offlinePackQuran([activeChap && activeChap.surahId ? activeChap.surahId : "fatiha"]);
    }
  } catch (e) {}
})();
</script>
