const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const app = document.getElementById("app");

/* ---------- typing Arabic ----------
   Typing Arabic script is not the skill being tested — knowing the word is. So
   every answer box converts English letters to Arabic AS he types
   (attachInlineTranslit in js/app.js) and offers tap-to-fix chips from the
   site-wide lexicon when what he has typed is close to a real word.

   The pool rule follows the rest of the codebase: in a LESSON the item's own
   words are included (he is learning them, and picking the right spelling is
   the point), but in a TEST they are excluded, so a chip can never hand him the
   graded answer. A roughly-right spelling still passes either way — writeMatchAr
   accepts sound-alike answers. */
let LEXICON = null;
async function typingPool(exclude) {
  if (!LEXICON) {
    try { LEXICON = Object.keys(await fetch("data/lexicon.json").then(r => r.json())); }
    catch (e) { LEXICON = []; }
  }
  if (!exclude || !exclude.length) return LEXICON;
  const out = new Set(exclude.flatMap(a => String(a).split(/\s+/)).map(w => normalizeAr(w)).filter(Boolean));
  return LEXICON.filter(w => !out.has(normalizeAr(w)));
}

/* The full key list. He asked (2026-08-30, looking at أَثَاث after typing
   "athath"): "how to write ta marbuta and also how could i have gotten the hamza
   to display or the short vowels to display. for this example not sure how i
   could have done it, tell me."

   Every one of these already worked — none of them was written down anywhere,
   which is the same as not existing. Each row below was checked against
   latinToArabic before being claimed here. The heading matters as much as the
   table: none of it is REQUIRED, because the marking is on sound. */
const TYPING_HELP = `
  <details style="margin-top:8px">
    <summary style="cursor:pointer;font-size:12.5px;color:var(--muted)">How to type Arabic here</summary>
    <div style="font-size:12.5px;color:var(--muted);line-height:1.8;margin-top:6px">
      <p style="margin:0 0 8px"><b>You never need any of this.</b> Type it the way it sounds —
      <code>kitab</code> → <span dir="rtl">كتاب</span> — and an answer that is right by sound is marked right.
      The keys below are for when you want the letters exactly.</p>
      <table style="width:100%;border-collapse:collapse;font-size:12.5px">
        <tr><td style="padding:3px 8px 3px 0;white-space:nowrap"><b>Long vowels</b></td>
            <td><code>aa</code>=<span dir="rtl">ا</span> · <code>ee</code>/<code>ii</code>=<span dir="rtl">ي</span> ·
                <code>oo</code>/<code>uu</code>=<span dir="rtl">و</span></td></tr>
        <tr><td style="padding:3px 8px 3px 0;white-space:nowrap"><b>Short vowels</b></td>
            <td><code>a</code>=<span dir="rtl">◌َ</span> · <code>i</code>=<span dir="rtl">◌ِ</span> ·
                <code>u</code>=<span dir="rtl">◌ُ</span> — they appear exactly where you type them.
                <code>^</code>=sukūn <span dir="rtl">◌ْ</span>, <code>*</code>=shadda <span dir="rtl">◌ّ</span>
                (or just double the letter: <code>qq</code>).</td></tr>
        <tr><td style="padding:3px 8px 3px 0;white-space:nowrap"><b>Tanwīn</b></td>
            <td><code>a~</code> <code>i~</code> <code>u~</code> — <code>shukra~</code> → <span dir="rtl">شُكْرًا</span></td></tr>
        <tr><td style="padding:3px 8px 3px 0;white-space:nowrap"><b>Tāʾ marbūṭa</b></td>
            <td><code>t:</code> — <code>ghurfat:</code> → <span dir="rtl">غُرْفَة</span>,
                <code>shaqqat:</code> → <span dir="rtl">شَقَّة</span></td></tr>
        <tr><td style="padding:3px 8px 3px 0;white-space:nowrap"><b>Hamza, by seat</b></td>
            <td><code>'</code> alone = <span dir="rtl">ء</span> ·
                <code>A'</code>=<span dir="rtl">أ</span> · <code>a'</code>=<span dir="rtl">إ</span> ·
                <code>w'</code>=<span dir="rtl">ؤ</span> · <code>y'</code>=<span dir="rtl">ئ</span>.
                So <code>A'athaath</code> → <span dir="rtl">أَثَاث</span> and
                <code>suw'aal</code> → <span dir="rtl">سُؤَال</span>.</td></tr>
        <tr><td style="padding:3px 8px 3px 0;white-space:nowrap"><b>Tricky letters</b></td>
            <td><code>H</code>=<span dir="rtl">ح</span> · <code>kh</code>=<span dir="rtl">خ</span> ·
                <code>th</code>=<span dir="rtl">ث</span> · <code>dh</code>=<span dir="rtl">ذ</span> ·
                <code>sh</code>=<span dir="rtl">ش</span> · <code>gh</code>=<span dir="rtl">غ</span> ·
                <code>3</code>=<span dir="rtl">ع</span> · <code>S</code>=<span dir="rtl">ص</span> ·
                <code>T</code>=<span dir="rtl">ط</span> · <code>D</code>=<span dir="rtl">ض</span> ·
                <code>Z</code>=<span dir="rtl">ظ</span> · <code>Y</code>=<span dir="rtl">ى</span></td></tr>
        <tr><td style="padding:3px 8px 3px 0;white-space:nowrap"><b>Chat numbers</b></td>
            <td><code>2</code>=<span dir="rtl">ء</span> · <code>5</code>=<span dir="rtl">خ</span> ·
                <code>6</code>=<span dir="rtl">ط</span> · <code>7</code>=<span dir="rtl">ح</span> ·
