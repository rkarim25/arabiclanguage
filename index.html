<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0d7a5f">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>Practice — Arabic العربية</title>
  <link rel="stylesheet" href="css/fonts.css?v=mwg3m2cb">
  <link rel="stylesheet" href="css/style.css?v=mwg3m2cb">
  <style>
    .s-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 14px; }
    .stat-strip { display: flex; gap: 20px; align-items: baseline; }
    .stat-strip .num { font-size: 26px; font-weight: 700; color: var(--accent); line-height: 1; }
    .stat-strip .lbl { font-size: 12px; color: var(--muted); }

    /* Top View Switcher */
    .tab-bar { display: inline-flex; border: 1px solid var(--border); border-radius: 999px; background: var(--card); padding: 3px; gap: 4px; margin-bottom: 12px; }
    .tab-btn { border: none; background: transparent; padding: 5px 14px; border-radius: 999px; font-size: 13px; font-weight: 600; cursor: pointer; color: var(--muted); transition: all 0.15s; }
    .tab-btn.active { background: var(--accent); color: #fff; box-shadow: 0 2px 6px rgba(13,122,95,0.25); }

    /* Unified Sleek Practice Toolbar */
    .practice-toolbar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px 12px; margin-bottom: 12px; padding: 7px 12px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; }
    .pt-group { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    
    .dir-toggle { display: inline-flex; border: 1px solid var(--border); border-radius: 999px; background: var(--bg); padding: 2px; }
    .dir-btn { border: none; background: transparent; padding: 4px 10px; border-radius: 999px; font-size: 11.5px; font-weight: 600; cursor: pointer; color: var(--muted); transition: all 0.12s; }
    .dir-btn.active { background: var(--accent); color: #fff; }

    .filter-chips { display: inline-flex; gap: 4px; flex-wrap: wrap; margin: 0; }
    .chip { border: 1px solid var(--border); background: var(--bg); border-radius: 999px; padding: 3px 9px; font-size: 11.5px; cursor: pointer; color: var(--muted); transition: all 0.1s; }
    .chip:hover { border-color: var(--accent); color: var(--ink); }
    .chip.active { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); font-weight: 700; }

    .pt-btn { border: 1px solid var(--border); background: var(--bg); border-radius: 6px; padding: 4px 9px; font-size: 12px; font-weight: 600; color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; gap: 4px; transition: all 0.1s; }
    .pt-btn:hover { border-color: var(--accent); background: var(--accent-soft); }
    .pt-btn.playing { background: var(--amber); color: #fff; border-color: var(--amber); }

    .speed-sw button { padding: 4px 7px; font-size: 11.5px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); cursor: pointer; }
    .speed-sw button.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    /* Compact Sentence Cards (One Below Another, Sleek & Neat) */
    .sentence-list { display: flex; flex-direction: column; gap: 9px; margin-top: 6px; }
    .s-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; display: flex; flex-direction: column; gap: 8px; transition: all 0.15s; }
    .s-card:hover { border-color: var(--accent); }
    .s-card.revealed { background: rgba(13, 122, 95, 0.02); }
    .s-card.playing { border-color: var(--accent); background: rgba(13, 122, 95, 0.08); border-left: 4px solid var(--accent); }

    .s-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
    .s-prompt-wrap { display: flex; align-items: baseline; gap: 8px; flex: 1; min-width: 260px; flex-wrap: wrap; }
    .s-num { color: var(--muted); font-size: 12.5px; font-weight: 700; flex-shrink: 0; }
    .s-prompt-text { font-size: 16px; font-weight: 600; color: var(--ink); line-height: 1.45; }
    .s-prompt-text.ar { font-family: var(--font-ar); font-size: 26px; color: var(--accent); direction: rtl; text-align: right; line-height: 1.55; }
    
    .s-meta-wrap { display: inline-flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .exp-dots-only { font-size: 11px; letter-spacing: 2px; color: var(--accent); white-space: nowrap; user-select: none; }
    .exp-dots-only.new { color: #94a3b8; }
    .src-tag { color: var(--accent); font-weight: 600; font-size: 11px; }

    .s-action-bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
    .s-reveal-btn { display: inline-flex; align-items: center; gap: 5px; padding: 5px 12px; border-radius: 6px; border: 1px dashed var(--border); background: var(--bg); color: var(--muted); font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.12s; user-select: none; }
    .s-reveal-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

    /* Colored SRS Rating Dots (Replaces wordy pills) */
    .s-rate-bar, .sheet-rate-bar { display: inline-flex; gap: 6px; align-items: center; justify-content: flex-end; }
    .rate-btn {
      width: 22px;
      height: 22px;
      min-width: 22px;
      border-radius: 50%;
      padding: 0;
      border: 2px solid transparent;
      background: transparent;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      line-height: 1;
      transition: all 0.12s ease-in-out;
      user-select: none;
    }
    .rate-btn:hover { transform: scale(1.2); }
    
    .rate-btn[data-b="strong"] { border-color: #10b981; background: #ecfdf5; color: transparent; }
    .rate-btn[data-b="strong"].selected { background: #059669; border-color: #059669; color: #fff; transform: scale(1.1); box-shadow: 0 0 0 2px rgba(5,150,105,0.25); }

    .rate-btn[data-b="medium"] { border-color: #0284c7; background: #f0f9ff; color: transparent; }
    .rate-btn[data-b="medium"].selected { background: #0284c7; border-color: #0284c7; color: #fff; transform: scale(1.1); box-shadow: 0 0 0 2px rgba(2,132,199,0.25); }

    .rate-btn[data-b="weak"] { border-color: #d97706; background: #fffbeb; color: transparent; }
    .rate-btn[data-b="weak"].selected { background: #d97706; border-color: #d97706; color: #fff; transform: scale(1.1); box-shadow: 0 0 0 2px rgba(217,119,6,0.25); }

    .rate-btn[data-b="learning"] { border-color: #ef4444; background: #fef2f2; color: transparent; }
    .rate-btn[data-b="learning"].selected { background: #dc2626; border-color: #dc2626; color: #fff; transform: scale(1.1); box-shadow: 0 0 0 2px rgba(220,38,38,0.25); }

    .rate-btn[data-b="never"] { border-color: #94a3b8; background: #f8fafc; color: transparent; }
    .rate-btn[data-b="never"].selected { background: #64748b; border-color: #64748b; color: #fff; transform: scale(1.1); box-shadow: 0 0 0 2px rgba(100,116,139,0.25); }

    /* SRS Legend Bar */
    .srs-legend-bar { display: inline-flex; align-items: center; gap: 12px; flex-wrap: wrap; font-size: 11.5px; color: var(--muted); margin-top: 3px; }
    .leg-item { display: inline-flex; align-items: center; gap: 4px; }
    .leg-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
    .leg-dot.strong { background: #059669; }
    .leg-dot.medium { background: #0284c7; }
    .leg-dot.weak { background: #d97706; }
    .leg-dot.learning { background: #dc2626; }
    .leg-dot.never { background: #64748b; }

    .s-revealed-body { display: flex; flex-direction: column; gap: 7px; padding: 9px 0 5px; border-top: 1px dashed var(--border); }
    .s-ar-line { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
    .s-ar-text { font-family: var(--font-ar); font-size: 28px; color: var(--accent); line-height: 1.6; flex: 1; text-align: right; }
    .s-en-line { font-size: 15.5px; font-weight: 600; color: var(--ink); line-height: 1.45; }
    .s-tr-line { font-size: 13.5px; color: var(--muted); font-style: italic; }

    /* Compact Word-by-Word Chips */
    .s-wbw-wrap { display: flex; flex-wrap: wrap; gap: 6px; direction: rtl; margin-top: 4px; }
    .wbw-chip-sm { border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; background: var(--bg); font-size: 12px; cursor: pointer; display: inline-flex; flex-direction: column; align-items: center; gap: 2px; transition: all 0.1s; }
    .wbw-chip-sm:hover { border-color: var(--accent); background: var(--accent-soft); }
    .wbw-chip-sm .w-ar { font-family: var(--font-ar); font-size: 19px; color: var(--accent); line-height: 1.35; }
    .wbw-chip-sm .w-en { font-size: 11.5px; color: var(--muted); direction: ltr; }

    .s-hint-line { font-size: 14px; color: var(--ink); background: rgba(13, 122, 95, 0.04); border-left: 3px solid rgba(13, 122, 95, 0.32); padding: 7px 11px; border-radius: 6px; line-height: 1.75; margin-top: 3px; }
    .s-gram-box { font-size: 14px; color: var(--ink); background: #fffbeb; border: 1px solid rgba(217,119,6,0.28); border-left: 3px solid var(--amber); padding: 8px 12px; border-radius: 7px; line-height: 1.75; margin-top: 3px; }
    .s-gram-box summary { cursor: pointer; font-weight: 600; color: #b45309; user-select: none; }
    .s-gram-link { color: var(--accent); font-weight: 600; text-decoration: none; margin-left: 6px; font-size: 12.5px; }
    .s-gram-link:hover { text-decoration: underline; }

    /* Motivation, Rhythm & Live Energy Pacing Strip */
    .mot-strip { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 10px 14px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; gap: 10px 14px; flex-wrap: wrap; }
    .mot-left { display: flex; flex-direction: column; gap: 3px; flex: 1; min-width: 240px; }
    .mot-top-line { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12.5px; }
    .mot-week { display: inline-flex; align-items: center; gap: 3px; }
    .mot-day { width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--border); background: var(--bg); color: var(--muted); font-size: 10.5px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }
    .mot-day.on { background: var(--accent); border-color: var(--accent); color: #fff; }
    .mot-day.today { box-shadow: 0 0 0 2px rgba(13, 122, 95, 0.25); }
    .mot-mode-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 700; padding: 2px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
    .mot-mode-badge.light { background: #ecfdf5; color: #047857; }
    .mot-mode-badge.surge { background: #fffbeb; color: #b45309; }
    .mot-nurture { font-size: 12.5px; color: var(--muted); line-height: 1.45; }
    .mot-right { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .mot-pill { border: 1px solid var(--border); background: var(--bg); color: var(--ink); border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.12s; }
    .mot-pill:hover { border-color: var(--accent); background: var(--accent-soft); }
    .mot-pill.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .batch-progress-footer { margin-top: 14px; padding: 13px 16px; border-radius: 12px; background: var(--bg); border: 1px dashed var(--border); display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
    .batch-ai-nudge { margin-top: 14px; padding: 12px 14px; background: var(--card); border: 1px solid var(--border); border-radius: 10px; text-align: left; }
    .batch-ai-pre { white-space: pre-wrap; font-family: monospace; font-size: 11.5px; line-height: 1.45; color: var(--ink); background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px; margin-top: 8px; max-height: 260px; overflow-y: auto; }
    .mode-pill-teach { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 999px; background: #ecfdf5; color: var(--accent); border: 1px solid rgba(13,122,95,0.28); }
    .mode-pill-commute { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 999px; background: #eff6ff; color: #1d4ed8; border: 1px solid rgba(29,78,216,0.25); }
    .cap-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(185px, 1fr)); gap: 8px; margin-top: 8px; }
    .cap-cell { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 12px; line-height: 1.45; }
    .cap-cell b { display: block; font-size: 12.5px; color: var(--ink); margin-bottom: 2px; }

    .line-toggle-btn { border: 1px solid var(--border); background: var(--card); color: var(--muted); padding: 2px 7px; font-size: 11px; font-weight: 600; border-radius: 6px; cursor: pointer; transition: all 0.12s; display: inline-flex; align-items: center; gap: 3px; user-select: none; }
    .line-toggle-btn:hover { border-color: var(--accent); color: var(--ink); }
    .line-toggle-btn.active { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); font-weight: 700; }

    /* Master Bank Table & Controls */
    .sheet-wrap { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; border: 1px solid var(--border); border-radius: 10px; background: var(--card); margin-top: 6px; }
    .m-search { width: 100%; max-width: 380px; padding: 8px 14px; border: 1px solid var(--border); border-radius: 10px; font-size: 13.5px; background: var(--card); color: var(--ink); }
    .m-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 4px; }
    .m-table th { text-align: left; padding: 8px 10px; border-bottom: 2px solid var(--border); color: var(--muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.5px; background: rgba(0,0,0,0.02); }
    .m-table td { padding: 7px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    .m-table tr:hover { background: rgba(13, 122, 95, 0.04); }

    /* Completion Banner */
    .done-banner { text-align: center; padding: 22px; background: var(--accent-soft); border: 1px solid var(--accent); border-radius: 14px; margin-top: 16px; }

    /* Mobile & Flexible Responsive Layout */
    @media (max-width: 768px) {
      .s-header { flex-direction: column; align-items: flex-start; gap: 10px; }
      .stat-strip { width: 100%; justify-content: space-between; }
      .practice-toolbar { flex-direction: column; align-items: stretch; gap: 8px; }
      .pt-group { width: 100%; justify-content: space-between; }
      .dir-toggle { display: flex; flex: 1; }
      .dir-btn { flex: 1; text-align: center; }
      .filter-chips { width: 100%; justify-content: flex-start; }
      
      .s-head { flex-direction: column; align-items: flex-start; gap: 6px; }
      .s-meta-wrap { align-self: flex-end; }
      .s-action-bar { flex-direction: row; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
      .s-reveal-btn { flex: 1; min-width: 140px; justify-content: center; }
      .s-rate-bar { width: auto; justify-content: flex-end; margin-left: auto; }
      .m-table { min-width: 600px; }
    }
  </style>
</head>
<body>
<main>
  <div class="s-header">
    <div>
      <h1 style="display:flex;align-items:center;gap:10px;margin:0">
        <span>Practice</span>
        <span class="arabic" style="color:var(--accent);font-size:26px">بِنَاءُ الجُمَل</span>
      </h1>
      <p class="sub" style="margin:2px 0">Incremental Practice Batches · Batch 1 advances weekly lessons, Batch 2+ consolidates review</p>
    </div>
    <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap">
      <div class="stat-strip">
        <div><div class="num" id="statHeld">0</div><div class="lbl">Sentences Held</div></div>
        <div><div class="num" id="statDue">0</div><div class="lbl">Due for Review</div></div>
        <div><div class="num" id="statTotal">0</div><div class="lbl">Master Bank</div></div>
      </div>
    </div>
  </div>

  <div id="focusBanner" style="display:none;margin-bottom:10px"></div>

  <!-- PRACTICE VIEW -->
  <div id="viewPractice">
    <!-- MOTIVATION, CONSISTENCY RHYTHM & LIVE ENERGY SELECTOR -->
    <div id="motivationStrip"></div>

    <!-- Session Progress & List -->
    <div class="card" style="padding:16px 18px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px">
        <div>
          <h2 style="margin:0;font-size:16px" id="sessionTitle" title="⚪ unseen · 🔴 needs work · 🟡 building · 🟢 mastered — earn green by passing across 2+ days (✗ · ≈ · ✓)">⚡ Practice</h2>
          <div class="srs-legend-bar" id="srsLegend"></div>
        </div>
        <span style="display:inline-flex;align-items:center;gap:7px;flex-wrap:wrap">
          <span style="font-size:13px;font-weight:600;color:var(--accent)" id="sessionCount">0 rated</span>
          <button type="button" class="pt-btn" id="btnTopNextBatch" onclick="advanceToNextBatch()" style="font-weight:700;color:var(--accent);border-color:var(--accent)" title="Finish this batch and start the next incremental Practice batch">▶ Next Batch →</button>
          <a class="pt-btn" href="audio.html?commute=1" style="text-decoration:none" title="Hands-free Commute version of Practice — active chapter sentences, Qur'an by ear, vocab &amp; spoken golden rules">🚗 Commute</a>
          <button type="button" class="pt-btn" onclick="toggleTopVoiceBrief()" title="Copy or view a 3–5 min AI Voice Brief built from the exact sentences, words &amp; grammar in this batch">🗣 Speak Brief</button>
          <button type="button" class="pt-btn" onclick="toggleCapabilityDrawer()" title="See what Practice knows you can and cannot do across Vocabulary, Sentences, Lesson Cards, Qur'an &amp; Motivation">📊 Capabilities</button>
          <button type="button" class="pt-btn" onclick="redoBatch()" title="The same batch again, weakest first — your last verdicts decide the order">↻ Redo</button>
          <button type="button" class="pt-btn" id="btnPause" style="display:none" title="Pause or Resume playback">⏸ Pause</button>
          <button type="button" class="pt-btn" id="btnStop" style="display:none">⏹</button>
          <details class="more"><summary title="Direction, stream filters &amp; audio controls">⋯</summary><div class="more-body">
            <div class="dir-toggle">
              <button type="button" class="dir-btn active" id="dirEnFirst" onclick="setDirection('en-first')">🇬🇧 EN → AR</button>
              <button type="button" class="dir-btn" id="dirArFirst" onclick="setDirection('ar-first')">🇸🇦 AR → EN</button>
            </div>
            <div class="filter-chips" id="filterChips">
              <button type="button" class="chip active" data-filter="balanced" title="Adaptive Practice mix (10-sentence effort across vocab, sentences, grammar, and Qur'an)">⚡ Adaptive</button>
              <button type="button" class="chip" data-filter="due">Due</button>
              <button type="button" class="chip" data-filter="new">New</button>
              <button type="button" class="chip" data-filter="weakest" title="Prioritize sentences with struggle words">📉 Weakest</button>
              <button type="button" class="chip" data-filter="chapters">Chapters</button>
              <button type="button" class="chip" data-filter="teacher">Preply</button>
              <button type="button" class="chip" data-filter="quran">Qur'an</button>
              <button type="button" class="chip" data-filter="everyday">Everyday</button>
            </div>
            <button type="button" class="pt-btn" id="btnPlayAll" title="Play batch continuously">▶ Play</button>
            <button type="button" class="pt-btn" id="btnPlayPauses" title="Plays Arabic, pauses 3s for recall, then says English">⏸ Gap</button>
            <span class="speed-sw" style="display:inline-flex;gap:3px;align-items:center">
              <button type="button" id="spNorm" title="Normal audio speed">🔊</button>
              <button type="button" id="spSlow" title="Slow audio speed">🐢</button>
            </span>
            <button type="button" class="pt-btn" onclick="revealAllCards()" title="Reveal all items in this batch">👁️ Reveal all</button>
          </div></details>
        </span>
      </div>
      <div id="capabilityDrawer" style="display:none;margin-bottom:12px"></div>
      <div id="topVoiceBriefDrawer" style="display:none;margin-bottom:12px"></div>
      <div class="sentence-list" id="sentenceList">Loading practice…</div>
      <div id="doneArea"></div>
    </div>
  </div>

  <!-- ACTIVE CHAPTER EARNED GREEN BAR & COACH'S NOTE (AT END OF PRACTICE PAGE) -->
  <div id="homeChapStrip" style="margin-top:14px;margin-bottom:12px"></div>

  <details class="coach-details" id="coachCard" style="display:none;margin-bottom:12px">
    <summary>
      <span>
        <h2 style="display:inline;font-size:14.5px;margin:0;font-weight:700">🧑‍🏫 Coach's Note</h2>
        <span style="font-weight:400;font-size:12px;color:var(--muted)" id="coachDate"></span>
      </span>
      <span style="font-size:12px;font-weight:600">Tap to expand ▾</span>
    </summary>
    <div class="coach-body">
      <p id="coachNote" style="font-size:14px;line-height:1.6;margin:0 0 8px"></p>
      <ul id="coachFocus" style="margin:0;padding-left:18px;font-size:13px;line-height:1.5"></ul>
    </div>
  </details>

  <p id="packLine" style="font-size:12px;color:var(--muted);text-align:center;margin:14px 0 0">📥 Loading offline audio pack…</p>
</main>

<script src="js/progress-model.js?v=mwg3m2cb"></script>
<script src="js/curriculum.js?v=mwg3m2cb"></script>
<script src="js/srs.js?v=mwg3m2cb"></script>
<script src="js/frames.js?v=mwg3m2cb"></script>
<script src="js/freetry.js?v=mwg3m2cb"></script>
<script src="js/practice.js?v=mwg3m2cb"></script>

renderNav("home");
trackPage("home");

/* PRESERVED FOR TEST-SENTENCE-DIAG.JS COMPLIANCE */
let DATA = null;
function diagnoseVerb(typed, it) {
  if (!typed || !it.forms) return null;
  const conv = /[A-Za-z]/.test(typed) ? latinToArabic(typed) : typed;
  const bare = w => normalizeAr(String(w || "")).replace(/ة/g, "ه").replace(/[ؤئ]/g, "ء");
  const first = bare(conv.trim().split(/\s+/)[0]);
  if (!first) return null;
  if (first === bare(it.form)) return null; // verb was right; the object differed
  for (const p of DATA.persons) {
    const row = it.forms[p.key];
    if (!row) continue;
    for (const t of DATA.tenses) {
      if (p.key === it.person.key && t.key === it.tense.key) continue;
      if (row[t.key] && bare(row[t.key]) === first) return { person: p, tense: t, form: row[t.key] };
    }
  }
  return null;
}

let MASTER_SENTENCES = [];
let PRACTICE_WORDS = [];
let PRACTICE_GRAMMAR = [];
let PRACTICE_LESSON_CARDS = [];
let LESSON_CARD_LOOKUP = { byId: {}, byPattern: {} };
let GRAMMAR_PATTERNS = [];
let GRAMMAR_MAP = {};
let CHAPTERS_LIST = [];
let CLASSES_LIST = [];
let EV_GROUPS = [];
let SURAH_MAP = {};
let KEY_ITEM_MAP = new Map();
let FOCUSED_PRACTICE_SPEC = null;
let WORD_GLOSS_BY_NORM = new Map();
let FREQ_WORDS = {};
let ACTIVE_SENTENCES = [];
let CURRENT_BUILT_BATCH = null;
let REVEALED = new Set();
let BATCH_RATED = new Set();
let BATCH_DONE_LOGGED = false;
let IS_ADAPTIVE_PRACTICE = true;
let SESSION_COOLDOWN = new Set();
let currentFilter = "balanced";
let bankFilter = "all";
let promptDirection = "en-first";
let audioIdx = 0;
const BATCH_SIZE = 10;

function getActiveWeeklyChapter() {
  if (!CHAPTERS_LIST.length) return null;
  const log = store.get("ats-log", []);
  const isMast = cid => log.some(x => x && x.e === "chap-test" && x.chap === cid && (x.score >= 80 || x.pass === true));
  const savedId = store.get("ats-current-chap-id") || localStorage.getItem("ats-current-chap-id");
  if (savedId) {
    const found = CHAPTERS_LIST.find(c => c.id === savedId);
    if (found && !isMast(found.id)) return found;
  }
  return CHAPTERS_LIST.find(c => !isMast(c.id)) || CHAPTERS_LIST[CHAPTERS_LIST.length - 1];
}

function allPracticeItems() {
  return MASTER_SENTENCES.concat(PRACTICE_GRAMMAR, PRACTICE_LESSON_CARDS, PRACTICE_WORDS.map(w => ({
    key: w.key, kind: "word", effort: 0.5, ar: w.ar, en: w.en, tr: w.tr || "",
    note: w.note || (w.root ? "Root: " + w.root : ""), words: [[w.ar, w.en]],
    src: "vocab", wordSrc: w.src || "everyday", track: w.src === "quran" ? "quran-word" : "vocab"
  })));
}

(async () => {
  try {
    if (window.LessonCards) LessonCards.ensureStyles();
    const [bRes, cRes, clsRes, senRes, qCoreRes, evRes, famRes, gramRes, lcRes, freqRes, vRes] = await Promise.all([
      fetch("data/sentence-bank.json").then(r => r.json()).catch(() => ({ sentences: [] })),
      fetch("data/chapters.json").then(r => r.json()).catch(() => ({ chapters: [] })),
      fetch("data/classes.json").then(r => r.json()).catch(() => ({ classes: [] })),
      fetch("data/sentences.json").then(r => r.json()).catch(() => null),
      fetch("data/quran-core.json").then(r => r.json()).catch(() => ({ words: [] })),
      fetch("data/everyday.json").then(r => r.json()).catch(() => ({ groups: [] })),
      fetch("data/families.json").then(r => r.json()).catch(() => ({ families: [] })),
      fetch("data/grammar.json").then(r => r.json()).catch(() => ({ patterns: [] })),
      fetch("data/lesson-cards.json").then(r => r.json()).catch(() => ({ cards: [] })),
      fetch("data/frequency.json").then(r => r.json()).catch(() => ({ words: {} })),
      fetch("data/verses.json").then(r => r.json()).catch(() => ({ surahs: [] })),
      loadFamIdx()
    ]);
    DATA = senRes;
    FREQ_WORDS = (freqRes && freqRes.words) || {};
    CHAPTERS_LIST = (cRes && cRes.chapters) || [];
    CLASSES_LIST = (clsRes && clsRes.classes) || [];
    EV_GROUPS = (evRes && evRes.groups) || [];
    ((vRes && vRes.surahs) || []).forEach(s => { if (s && s.id) SURAH_MAP[s.id] = s; });
    GRAMMAR_PATTERNS = (gramRes && gramRes.patterns) || [];
    if (window.LessonCards && lcRes && Array.isArray(lcRes.cards)) {
      PRACTICE_LESSON_CARDS = LessonCards.buildPracticePool(lcRes.cards);
      LESSON_CARD_LOOKUP = LessonCards.buildLookup(lcRes.cards);
    }

    // Vocabulary pool with exact SRS keys matching words.html
    const seenWords = new Set();
    const addWord = (k, ar, en, tr, note, src, root) => {
      if (!k || !ar || !en) return;
      const n = normalizeAr(ar);
      if (!WORD_GLOSS_BY_NORM.has(n)) WORD_GLOSS_BY_NORM.set(n, en);
      if (seenWords.has(n)) return;
      seenWords.add(n);
      const fam = famLookup(ar);
      PRACTICE_WORDS.push({ key: k, ar, en, tr: tr || "", note: note || "", src, root: root || (fam ? fam.root : ""), fam });
    };
    (clsRes.classes || []).forEach(c => (c.vocabulary || []).forEach(v => addWord(v.key, v.ar, v.en, v.tr, v.note, "teacher")));
    (qCoreRes.words || []).forEach((w, i) => addWord(`qc:${i}`, w.ar, w.en, w.tr, "", "quran"));
    (evRes.groups || []).forEach(g => (g.members || []).forEach((m, i) => addWord(`ev-${g.id}:${i}`, m.ar, m.en, m.tr, m.note, "everyday")));
    (famRes.families || []).forEach(f => (f.members || []).forEach((m, i) => addWord(`fam-${f.id}:${i}`, m.ar, m.en, "", `Root: ${f.root}`, "root", f.root)));

    // Register canonical word keys so _wordKeyFor() resolves sentence words & adopts tw: twins automatically
    if (typeof registerWordKeys === "function" && PRACTICE_WORDS.length) {
      const wkMap = {};
      PRACTICE_WORDS.forEach(w => {
        const n = normalizeAr(w.ar).replace(/^ال/, "");
        if (n && !wkMap[n]) wkMap[n] = w.key;
      });
      registerWordKeys(wkMap);
    }

    // Grammar pool + inline rule lookup map matching grammar.html
    if (window.Practice) {
      if (typeof Practice.buildGrammarPool === "function") PRACTICE_GRAMMAR = Practice.buildGrammarPool(GRAMMAR_PATTERNS);
      if (typeof Practice.buildGrammarMap === "function") GRAMMAR_MAP = Practice.buildGrammarMap(GRAMMAR_PATTERNS);
    }

    const seen = new Set();
    const add = (key, ar, en, tr, hint, words, src, track, note, extra) => {
      if (!ar || !en) return;
      const n = normalizeAr(ar);
      if (seen.has(n)) return;
      seen.add(n);
      MASTER_SENTENCES.push(Object.assign({
        key: key || ("s:" + n.slice(0, 16)),
        ar,
        en,
        tr: tr || "",
        hint: hint || "",
        words: words || [],
        src: src || "bank",
        track: track || "everyday",
        note: note || ""
      }, extra || {}));   // extra: wk (word keys per word), pattern, use — what Free try plans with
    };

    // 1. Chapters 1-10 sentences (Reza's weekly units)
    (cRes.chapters || []).forEach(c => {
      (c.sentences || []).forEach((s, idx) => {
        add(`chap:${c.num}:${idx}`, s.ar, s.en, s.tr, s.hint, s.words, "chapters", "everyday", `Chapter ${c.num}: ${c.title}`, { pattern: s.pattern || null, frames: s.frames || [] });
      });
    });

    // 2. Preply Teacher sentences
    (clsRes.classes || []).forEach(c => {
      (c.sentences || []).forEach((s, idx) => {
        add(`cls:${c.id}:${idx}`, s.ar, s.en, s.tr, s.note, s.words, "teacher", "class", `Preply: ${c.title}`, { pattern: s.pattern || null, frames: s.frames || [] });
      });
    });

    // 3. Sentence Bank (never emit bare s.pattern slug into s.note — grammar rules render via GRAMMAR_MAP!)
    (bRes.sentences || []).forEach(s => {
      const words = (s.words || []).map(w => Array.isArray(w) ? w : [w.ar, w.en]);
      const cleanNote = s.surah
        ? `Surah ${s.surah}${s.ref ? " (" + s.ref + ")" : ""}${s.note ? " — " + s.note : ""}`
        : (s.note && !GRAMMAR_MAP[s.note] ? s.note : "");
      add(s.key || s.id, s.ar, s.en, s.tr, s.note, words, s.src || "bank", s.track || "everyday", cleanNote,
        { wk: (s.words || []).map(w => Array.isArray(w) ? [] : (w.keys && w.keys.length ? w.keys : (w.key ? [w.key] : []))), ref: s.ref || null, surah: s.surah || null, wordKeys: s.wordKeys || [], pattern: s.pattern || "-", frames: s.frames || [], use: s.use || 0 });
    });

    await loadMyDay();

    // Index all Practice items + Surah ayahs & words so any dynamic ?keys= / ?surah= / ?set= / ?chap= link resolves cleanly
    KEY_ITEM_MAP.clear();
    allPracticeItems().forEach(it => { if (it && it.key && !KEY_ITEM_MAP.has(it.key)) KEY_ITEM_MAP.set(it.key, it); });
    Object.values(SURAH_MAP).forEach(sur => {
      (sur.verses || []).forEach((v, vi) => {
        const aKey = "s:q:" + sur.id + ":" + (vi + 1);
        const wPairs = (v.words || []).map(w => [w[0], w[2] || w[1] || ""]);
        const wKeys = (v.words || []).map((_, wi) => ["qw:" + sur.id + ":" + vi + ":" + wi]);
        if (!KEY_ITEM_MAP.has(aKey)) {
          KEY_ITEM_MAP.set(aKey, {
            key: aKey, kind: "quran", track: "quran", src: "quran",
            ar: v.ar, en: v.en, tr: v.tr || "", words: wPairs, wk: wKeys,
            ref: v.ref || (sur.n + ":" + (vi + 1)), surah: sur.nameEn ? sur.nameEn.split("—")[0].trim() : sur.name,
            surahId: sur.id, note: "Surah " + (sur.nameEn ? sur.nameEn.split("—")[0].trim() : sur.name) + " (" + (v.ref || (sur.n + ":" + (vi + 1))) + ")"
          });
        }
        (v.words || []).forEach((w, wi) => {
          const qwKey = "qw:" + sur.id + ":" + vi + ":" + wi;
          const gloss = w[2] || w[1] || "";
          if (w[0] && gloss && !KEY_ITEM_MAP.has(qwKey)) {
            KEY_ITEM_MAP.set(qwKey, {
              key: qwKey, kind: "word", effort: 0.5, ar: w[0], en: gloss, tr: w[1] && w[2] ? w[1] : "",
              note: "Surah " + (sur.nameEn ? sur.nameEn.split("—")[0].trim() : sur.name) + " (" + (sur.n + ":" + (vi + 1)) + ")",
              words: [[w[0], gloss]], wk: [[qwKey]], src: "vocab", wordSrc: "quran", track: "quran-word", surahId: sur.id
            });
          }
        });
      });
    });

    updateOverallStats();
    const lg = document.getElementById("srsLegend"); if (lg) lg.innerHTML = SRS.legendHtml();
    /* 🎯 Try it — say it or write it; ✨ Free try builds a batch from what he holds */
    TryIt.setup({
      src: "sentences",
      items: () => ACTIVE_SENTENCES,
      rowId: idx => "scard-" + idx,
      pool: () => MASTER_SENTENCES,
      size: BATCH_SIZE,
      onVerdict: (it, g, idx, how, meta) => rateSentence(it.key, g, idx, how, meta),
      onFreeDone: (okN, n) => {
        // the commute's sentences count as checked only now — when the round actually ended
        if (window._pendingCommuteCheck) {
          const c = window._pendingCommuteCheck;
          window._pendingCommuteCheck = null;
          logEvent({ e: "commute-check-done", forT: c.forT, n: c.n, t: Date.now() });
          (c.forTs || []).forEach(ft => { if (ft && ft !== c.forT) logEvent({ e: "commute-check-done", forT: ft, n: c.n, t: Date.now() }); });
        }
        BATCH_DONE_LOGGED = true;
        const curB = (CURRENT_BUILT_BATCH && CURRENT_BUILT_BATCH.batchNum) || 1;
        const nextB = curB + 1;
        const nextDesc = nextB === 2 ? "75% Review + Weekly Sentences" : "Deep Review Mix";
        let t = document.getElementById("freeDone");
        if (!t) { t = document.createElement("div"); t.id = "freeDone"; const d = document.getElementById("doneArea"); if (d && d.parentNode) d.parentNode.insertBefore(t, d); else document.body.appendChild(t); }
        t.innerHTML = `<div class="done-banner"><h3 style="margin:0 0 6px;color:var(--accent);font-size:20px">${okN >= Math.ceil(n / 2) ? `🎉 Batch ${curB} Complete!` : `✓ Batch ${curB} Complete!`}</h3>
          <p style="margin:0 0 10px;font-size:14px">${okN ? `${okN} of ${n} said or written and got right — every section updated automatically.` : `${n} practiced — every verdict updated its home section.`}</p>
          ${typeof planMoodHTML === "function" && curB === 1 ? planMoodHTML() : ""}
          <div style="margin-top:10px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
            <button type="button" class="primary" onclick="startNextPracticeBatch(${nextB})" style="font-size:14.5px;padding:8px 18px">▶ Start Batch ${nextB} (${nextDesc}) →</button>
            <button type="button" class="pt-btn" onclick="redoBatch()" style="font-size:13.5px;padding:7px 14px">↻ Redo batch</button>
            <a href="chapters.html" class="pt-btn" style="font-size:13.5px;padding:7px 14px;text-decoration:none">📖 Open Chapters →</a>
          </div>
          ${renderBatchVoiceBriefHTML("free")}
        </div>`;
        if (t.scrollIntoView) t.scrollIntoView({ behavior: "smooth", block: "center" });
      },
      onFree: (list, meta) => {
        stopAudio();
        REVEALED.clear();
        BATCH_RATED.clear();
        BATCH_DONE_LOGGED = false;
        IS_ADAPTIVE_PRACTICE = false;
        const fd = document.getElementById("freeDone"); if (fd) fd.innerHTML = "";
        ACTIVE_SENTENCES = list;
        LAST_BATCH_KEYS = list.map(x => x.key);
        const t = document.getElementById("sessionTitle");
        if (t) t.textContent = meta.title || `✨ Free try — level ${meta.theta}`;
        const lg = document.getElementById("srsLegend");
        const gf = meta.grammar && meta.grammar.focus ? meta.grammar.focus : null;
        const gp = gf && meta.grammar.profile[gf];
        const gTxt = gf ? (gp && gp.unseen ? `new grammar this time: ${gf}` : `grammar focus: ${gf}${gp && gp.passRate != null ? ` (you pass ${gp.passRate}%)` : ""}`) : "";
        if (lg) lg.innerHTML = `<span class="srs-legend"><span class="leg">built from what you hold · aimed at about 3 in 4 right${gTxt ? " · " + gTxt : ""} · ${meta.mix.retry ? meta.mix.retry + " retry · " : ""}${meta.mix.grammar || 0} grammar · ${meta.mix.stretch} stretch · ${meta.mix.consolidate} consolidate · ${meta.candidates} qualified${meta.tries ? " · level from " + meta.tries + " of your tries" : " · first session: starting level"}</span></span>`;
        render10Cards();
      },
    });
    setupAudioSpeed();
    /* the plan's core block: ?myday=1 → Practice; &rehearse=1 → only what he proved this week */
    const q = new URLSearchParams(location.search);
    if (q.get("view") === "list" || q.get("view") === "master") { location.replace("sentences.html"); return; }
    if (!loadFocusedPracticeFromUrl(location.search)) {
      const reqBatch = parseInt(q.get("batch") || "0", 10);
      await startMyDay(!!q.get("rehearse"), reqBatch >= 1 ? reqBatch : undefined);
    }
    renderMotivationStrip();
    renderHomeChapStrip();
  } catch (e) {
    console.error("Failed to load sentence bank", e);
  }
})();

function getExposure(key) {
  const srs = getSrs();
  let item = srs[key];
  if (!item && key.startsWith("s:")) item = srs[key.slice(2)];
  if (!item && !key.startsWith("s:")) item = srs["s:" + key];
  item = item || {};
  const reps = item.reps || (item.u ? 1 : 0);
  const box = item.box != null ? item.box : 0;
  return {
    reps,
    box,
    isNew: !item.u && reps === 0,
    isLeech: (box === 0 || box === 1) && reps >= 4,
    isRetired: item.b === "never"
  };
}

function updateOverallStats() {
  const srs = getSrs();
  const now = Date.now();
  const held = MASTER_SENTENCES.filter(s => (srs[s.key] || {}).box >= 3).length;
  const due = MASTER_SENTENCES.filter(s => {
    const item = srs[s.key];
    return item && item.b !== "never" && item.due && item.due <= now;
  }).length;

  document.getElementById("statHeld").textContent = held;
  document.getElementById("statDue").textContent = due;
  document.getElementById("statTotal").textContent = MASTER_SENTENCES.length;
}

/* ADAPTIVE PRACTICE + FILTERED SENTENCE BATCH ENGINE */
function loadPracticeBatch(explicitBatchNum) {
  stopAudio();
  if (window.TryIt) TryIt.endFree();
  FOCUSED_PRACTICE_SPEC = null;
  const fb = document.getElementById("focusBanner");
  if (fb) { fb.style.display = "none"; fb.innerHTML = ""; }
  REVEALED.clear();
  BATCH_RATED.clear();
  BATCH_DONE_LOGGED = false;
  IS_ADAPTIVE_PRACTICE = true;
  const fd = document.getElementById("freeDone"); if (fd) fd.innerHTML = "";

  const hw = store.get("ats-homework", null);
  const hwPast = !!(hw && hw.lessonAt && new Date(hw.lessonAt).getTime() + 2 * 3600000 < Date.now());
  const easy = (typeof planEasyDay === "function") && planEasyDay();
  const activeChap = getActiveWeeklyChapter();

  const built = Practice.buildBatch({
    now: Date.now(),
    batchNum: explicitBatchNum,
    activeChapNum: activeChap ? activeChap.num : null,
    srs: getSrs(),
    log: store.get("ats-log", []),
    words: PRACTICE_WORDS,
    sentences: MASTER_SENTENCES,
    grammar: PRACTICE_GRAMMAR,
    lessonCards: PRACTICE_LESSON_CARDS,
    grammarPatterns: GRAMMAR_PATTERNS,
    grammarMap: GRAMMAR_MAP,
    freq: FREQ_WORDS,
    homework: new Set((hw && !hwPast && hw.keys) || []),
    exclude: SESSION_COOLDOWN,
    easyDay: easy,
    FreeTry: window.FreeTry || null,
    wordKeyFor: ar => (typeof _wordKeyFor === "function" && ar) ? _wordKeyFor(normalizeAr(ar).replace(/^ال/, "")) : null
  });

  CURRENT_BUILT_BATCH = built;
  if (built.capabilities) store.set("ats-capabilities", built.capabilities);
  if (built.pendingCommute) { const cd = built.pendingCommute; window._pendingCommuteCheck = { forT: cd.t, forTs: cd.forTs || [cd.t], n: cd.n }; }
  const titleEl = document.getElementById("sessionTitle");
  if (titleEl) titleEl.textContent = built.title;
  const lg = document.getElementById("srsLegend");
  if (lg) lg.innerHTML = `<span class="srs-legend"><span class="leg">${built.summary}</span></span>`;

  ACTIVE_SENTENCES = built.list;
  ACTIVE_SENTENCES.forEach((it, idx) => { if (it && it._autoReveal) REVEALED.add(idx); });
  LAST_BATCH_KEYS = built.list.map(x => x.key);
  const topDrawer = document.getElementById("topVoiceBriefDrawer");
  if (topDrawer && topDrawer.style.display !== "none") {
    topDrawer.innerHTML = renderBatchVoiceBriefHTML("top");
  }
  const capDrawer = document.getElementById("capabilityDrawer");
  if (capDrawer && capDrawer.style.display !== "none") {
    capDrawer.innerHTML = renderCapabilityDrawerHTML();
  }
  logEvent({ e: "practice-batch", batch: built.batchNum, effort: built.effort, budget: built.budget, teachCount: built.teachCount, reviewPct: built.reviewPct, counts: built.counts, mode: built.diag.mode, commuteDebt: !!built.diag.commuteDebt, t: Date.now() });
  render10Cards();
}

function renderCapabilityDrawerHTML() {
  if (!window.Practice || typeof Practice.summarizeCapabilities !== "function") return "";
  const activeChap = getActiveWeeklyChapter();
  const cap = Practice.summarizeCapabilities({
    now: Date.now(),
    activeChapNum: activeChap ? activeChap.num : null,
    srs: getSrs(),
    log: store.get("ats-log", []),
    words: PRACTICE_WORDS,
    sentences: MASTER_SENTENCES,
    grammar: PRACTICE_GRAMMAR,
    lessonCards: PRACTICE_LESSON_CARDS
  });
  store.set("ats-capabilities", cap);
  return `
    <div class="batch-ai-nudge" style="margin-top:0">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">

        <button type="button" class="pt-btn" onclick="toggleCapabilityDrawer()" style="font-size:11.5px;padding:3px 9px">Close ✕</button>
      </div>
      <div class="cap-grid">
        <div class="cap-cell">
          <b>🔤 Vocabulary</b>
          <div><b>${cap.vocab.held}</b> solid · <b>${cap.vocab.learning}</b> learning${cap.vocab.slips ? ` · <span style="color:#dc2626;font-weight:600">${cap.vocab.slips} slips</span>` : ""}</div>
          <div style="color:var(--muted);font-size:11px">Synced with Words &amp; Chapter Vocab</div>
        </div>
        <div class="cap-cell">
          <b>🗣 Sentences &amp; Production</b>
          <div><b>${cap.sentences.held}</b> held · <b>${cap.sentences.provenActive}</b> spoken/typed</div>
          <div style="color:var(--muted);font-size:11px">${cap.sentences.activeChapNum ? `Ch ${cap.sentences.activeChapNum}: ${cap.sentences.activeChapSolid}/${cap.sentences.activeChapTotal} solid` : "Synced with Chapters"}</div>
        </div>
        <div class="cap-cell">
          <b>📇 Lesson Cards &amp; Grammar</b>
          <div><b>${cap.concepts.lessonCardsHeld}/${cap.concepts.lessonCardsTotal}</b> Lesson Cards · <b>${cap.concepts.grammarPatternsHeld}/${cap.concepts.grammarPatternsTotal}</b> rules</div>
          <div style="color:var(--muted);font-size:11px">Synced with Sets &amp; Grammar</div>
        </div>
        <div class="cap-cell">

      btn.textContent = "✓ Copied Speaking Brief!";
      setTimeout(() => { btn.textContent = orig; }, 2200);

  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(done).catch(() => {
      const ta = document.createElement("textarea");
      ta.value = txt; document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); } catch (_) {}
      document.body.removeChild(ta);
      done();
    });
  } else {
    const ta = document.createElement("textarea");
    ta.value = txt; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } catch (_) {}
    document.body.removeChild(ta);
    done();
  }
}

function decorateFocusItem(raw, srs, now) {
  if (!raw) return null;
  const st = window.SRS && SRS.masteryState ? SRS.masteryState(raw.key, { srs, now }) : { level: "grey" };
  const isUnseen = st.level === "grey";
  const copy = Object.assign({}, raw);
  if (copy.kind === "lesson-card") {
    copy.lcMode = isUnseen ? "teach" : "review";
    copy._autoReveal = isUnseen;
  } else if (isUnseen) {
    copy.practiceMode = "teach";
    copy._autoReveal = true;
  }
  return copy;
}

function rankFocusItems(pool, srs, now, limit, preserveOrder) {
  const seenKeys = new Set();
  const dedup = [];
  (pool || []).forEach(it => {
    if (!it || !it.key || seenKeys.has(it.key)) return;
    if ((srs[it.key] || {}).b === "never") return;
    seenKeys.add(it.key);
    dedup.push(it);
  });
  let picked = dedup;
  if (!preserveOrder && dedup.length > 1) {
    const prio = { red: 0, grey: 1, amber: 2, green: 3 };
    picked = dedup.slice().sort((a, b) => {
      if (a.kind === "lesson-card" && b.kind !== "lesson-card") return -1;
      if (b.kind === "lesson-card" && a.kind !== "lesson-card") return 1;
      const sa = window.SRS && SRS.masteryState ? SRS.masteryState(a.key, { srs, now }).level : "grey";
      const sb = window.SRS && SRS.masteryState ? SRS.masteryState(b.key, { srs, now }).level : "grey";
      return (prio[sa] ?? 2) - (prio[sb] ?? 2);
    });
  }
  return picked.slice(0, limit || 12).map(it => decorateFocusItem(it, srs, now)).filter(Boolean);
}

function loadFocusedPracticeFromUrl(searchStr) {
  const q = new URLSearchParams(searchStr != null ? searchStr : location.search);
  const srs = getSrs();
  const now = Date.now();
  let list = [];
  let title = "";
  let sub = "";
  let backHref = "";
  let backLabel = "";
  let forceDir = null;

  const chapParam = q.get("chap");
  const surahParam = q.get("surah");
  const lcParam = q.get("lc");
  const setParam = q.get("set");
  const gramParam = q.get("grammar");
  const classParam = q.get("class");
  const focusParam = q.get("focus");
  const filterParam = q.get("filter");
  const dotParam = q.get("dot");
  const keysParam = q.get("keys");

  if (chapParam) {
    const ch = CHAPTERS_LIST.find(c => c.id === chapParam || String(c.num) === String(chapParam).replace(/^chap-/, ""));
    if (ch) {
      const pool = [];
      PRACTICE_LESSON_CARDS.forEach(lc => {
        const chs = (lc.lcCard && lc.lcCard.triggers && lc.lcCard.triggers.chapters) || [];
        if (chs.includes(ch.num)) {
          const st = SRS.masteryState(lc.key, { srs, now });
          if (st.level !== "green") pool.push(lc);
        }
      });
      MASTER_SENTENCES.filter(s => String(s.key || "").startsWith("chap:" + ch.num + ":")).forEach(s => pool.push(s));
      if (ch.surahId) {
        MASTER_SENTENCES.filter(s => String(s.key || "").startsWith("s:q:" + ch.surahId + ":")).slice(0, 3).forEach(s => pool.push(s));
      }
      list = rankFocusItems(pool, srs, now, 13, false);
      title = "📖 Focused Practice — " + ch.title;
      sub = "All verdicts update Chapter " + ch.num + " sentences, vocabulary & Earned Mastery Dots live.";
      backHref = "chapters.html?chap=" + ch.id;
      backLabel = "📖 Back to Chapter " + ch.num;
    }
  } else if (surahParam) {
    const sur = SURAH_MAP[surahParam];
    const pool = [];
    if (sur) {
      (sur.verses || []).forEach((_, vi) => {
        const ak = "s:q:" + sur.id + ":" + (vi + 1);
        const it = KEY_ITEM_MAP.get(ak);
        if (it) pool.push(it);
      });
      (sur.verses || []).forEach((v, vi) => (v.words || []).forEach((_, wi) => {
        const qk = "qw:" + sur.id + ":" + vi + ":" + wi;
        const it = KEY_ITEM_MAP.get(qk);
        if (it) pool.push(it);
      }));
      list = rankFocusItems(pool, srs, now, 12, false);
      const sName = sur.nameEn ? sur.nameEn.split("—")[0].trim() : sur.name;
      title = "🕌 Qur'ān Practice — Surah " + sName;
      sub = "Mishary Rashid Alafasy recitation + word-by-word recall · Verdicts sync directly to Qur'ān & Words.";
      backHref = "quran.html?s=" + encodeURIComponent(sur.id);
      backLabel = "🕌 Back to Surah " + sName;
      forceDir = "ar-first";
    }
  } else if (lcParam) {
    const lcKey = lcParam.startsWith("lc:") ? lcParam : ("lc:" + lcParam);
    const lcItem = PRACTICE_LESSON_CARDS.find(x => x.key === lcKey);
    if (lcItem) {
      const pats = new Set(((lcItem.lcCard && lcItem.lcCard.triggers && lcItem.lcCard.triggers.patterns) || []));
      const chaps = new Set(((lcItem.lcCard && lcItem.lcCard.triggers && lcItem.lcCard.triggers.chapters) || []));
      const appPool = [];
      PRACTICE_GRAMMAR.filter(g => pats.has(g.patId)).forEach(g => appPool.push(g));
      MASTER_SENTENCES.forEach(s => {
        if ((s.pattern && pats.has(s.pattern)) || (Array.isArray(s.frames) && s.frames.some(f => pats.has(f)))) appPool.push(s);
        else if (String(s.key || "").startsWith("chap:") && chaps.has(Number(String(s.key).split(":")[1]))) appPool.push(s);
      });
      const head = decorateFocusItem(lcItem, srs, now);
      if (head) { head._autoReveal = true; }
      list = [head].concat(rankFocusItems(appPool, srs, now, 9, false)).filter(Boolean);
      title = "📇 Lesson Card Practice — " + (lcItem.title || lcParam);
      sub = "Study the visual mental map first, then apply it immediately across real sentences.";
      backHref = "sets.html#lc-" + lcKey.replace(/^lc:/, "");
      backLabel = "📇 Back to Lesson Cards";
    }
  } else if (setParam) {
    const grp = EV_GROUPS.find(g => g.id === setParam);
    const setPrefix = "ev-" + setParam + ":";
    const setWords = allPracticeItems().filter(it => it.kind === "word" && String(it.key || "").startsWith(setPrefix));
    if (setWords.length) {
      const setNorms = new Set(setWords.map(w => normalizeAr(w.ar).replace(/^ال/, "")).filter(Boolean));
      const matchingSents = MASTER_SENTENCES.filter(s =>
        (s.words || []).some(w => setNorms.has(normalizeAr(w[0] || "").replace(/^ال/, "")))
      ).slice(0, 5);
      list = rankFocusItems(setWords.concat(matchingSents), srs, now, 12, false);
      title = "🗂 Set Practice — " + ((grp && (grp.theme || grp.title)) || setParam);
      sub = "Words from this set + real sentences using them · Verdicts sync with Sets & Words.";
      backHref = "sets.html#" + encodeURIComponent(setParam);
      backLabel = "🗂 Back to Sets";
    }
  } else if (gramParam) {
    const pat = GRAMMAR_PATTERNS.find(p => p.id === gramParam);
    const pool = [];
    const lcCard = LESSON_CARD_LOOKUP.byPattern && LESSON_CARD_LOOKUP.byPattern[gramParam];
    if (lcCard) {
      const lcIt = PRACTICE_LESSON_CARDS.find(x => x.key === "lc:" + lcCard.id);
      if (lcIt) pool.push(lcIt);
    }
    PRACTICE_GRAMMAR.filter(g => g.patId === gramParam).forEach(g => pool.push(g));
    MASTER_SENTENCES.filter(s => s.pattern === gramParam || (Array.isArray(s.frames) && s.frames.includes(gramParam))).slice(0, 12).forEach(s => pool.push(s));
    if (pool.length) {
      list = rankFocusItems(pool, srs, now, 11, false);
      title = "📐 Grammar Practice — " + ((pat && pat.name) || gramParam);
      sub = "Pattern checks + sentences demonstrating this frame · Verdicts sync with Grammar & Sets.";
      backHref = "grammar.html?g=" + encodeURIComponent(gramParam);
      backLabel = "📐 Back to Pattern";
    }
  } else if (classParam) {
    const cls = CLASSES_LIST.find(c => c.id === classParam);
    if (cls) {
      const clsSents = MASTER_SENTENCES.filter(s => String(s.key || "").startsWith("cls:" + cls.id + ":"));
      const clsWordKeys = new Set((cls.vocabulary || []).map(v => v.key));
      const clsWords = allPracticeItems().filter(it => it.kind === "word" && clsWordKeys.has(it.key));
      list = rankFocusItems(clsSents.concat(clsWords), srs, now, 12, false);
      title = "🧑‍🏫 Preply Class Practice — " + (cls.title || cls.id);
      sub = "Captured Sunday class dialogue sentences & vocabulary · Verdicts sync with Teacher & Words.";
      backHref = "class.html?class=" + encodeURIComponent(cls.id);
      backLabel = "🧑‍🏫 Back to Teacher";
    }
  } else if (keysParam) {
    const rawKeys = keysParam.split(",").map(s => s.trim()).filter(Boolean);
    const resolved = rawKeys.map(k => KEY_ITEM_MAP.get(k)).filter(Boolean);
    if (resolved.length) {
      list = rankFocusItems(resolved, srs, now, Math.min(16, resolved.length), true);
      const customLabel = q.get("label") || "Selected Items";
      title = "⚡ Focused Practice — " + customLabel;
      sub = list.length + " targeted items loaded dynamically into Practice.";
      backHref = document.referrer && document.referrer.includes(location.host) ? "" : "class.html";
      backLabel = "🧑‍🏫 Teacher Brief";
    }
  } else if (focusParam === "words") {
    const wsrc = q.get("wsrc") || "all";
    let wPool = allPracticeItems().filter(it => it.kind === "word");
    if (wsrc === "teacher") wPool = wPool.filter(w => w.wordSrc === "teacher");
    else if (wsrc === "quran") wPool = wPool.filter(w => w.wordSrc === "quran");
    else if (wsrc === "everyday") wPool = wPool.filter(w => w.wordSrc === "everyday");
    else if (wsrc === "due") wPool = wPool.filter(w => { const c = srs[w.key]; return c && c.b !== "never" && c.due && c.due <= now; });
    if (dotParam && dotParam !== "all") {
      wPool = wPool.filter(w => SRS.masteryState(w.key, { srs, now }).level === dotParam);
    }
    if (wPool.length) {
      const pickedWords = SRS.buildBatch(wPool, { size: 10, mode: wsrc === "due" ? "due" : "balanced", srs, now });
      list = pickedWords.map(it => decorateFocusItem(it, srs, now)).filter(Boolean);
      title = "📇 Vocabulary in Practice" + (wsrc !== "all" ? " · " + wsrc : "") + (dotParam && dotParam !== "all" ? " · " + dotParam : "");
      sub = "Every word verdict updates Master Vocabulary, Sets & Chapter Vocab automatically.";
      backHref = "words.html";
      backLabel = "📇 Back to Words";
    }
  } else if (filterParam || (dotParam && dotParam !== "all")) {
    const f = filterParam || "all";
    let sPool = MASTER_SENTENCES.slice();
    if (f === "chapters") sPool = sPool.filter(s => s.src === "chapters");
    else if (f === "teacher") sPool = sPool.filter(s => s.src === "teacher");
    else if (f === "everyday") sPool = sPool.filter(s => s.track === "everyday" && s.src !== "chapters");
    else if (f === "quran") { sPool = sPool.filter(s => s.track === "quran"); forceDir = "ar-first"; }
    else if (f === "due") sPool = sPool.filter(s => { const c = srs[s.key]; return c && c.b !== "never" && c.due && c.due <= now; });
    if (dotParam && dotParam !== "all") {
      sPool = sPool.filter(s => SRS.masteryState(s.key, { srs, now }).level === dotParam);
    }
    if (sPool.length) {
      const mode = ["weakest", "due", "new"].includes(f) ? f : "balanced";
      const chosen = SRS.buildBatch(sPool, { size: BATCH_SIZE, mode, srs, now });
      list = chosen.map(it => decorateFocusItem(it, srs, now)).filter(Boolean);
      title = "💬 Sentence Practice" + (f !== "all" ? " · " + f : "") + (dotParam && dotParam !== "all" ? " · " + dotParam : "");
      sub = "Filtered from your Sentence Library · Verdicts update Earned Mastery Dots live.";
      backHref = f === "quran" ? "quran.html" : "sentences.html";
      backLabel = f === "quran" ? "🕌 Back to Qur'ān" : "💬 Back to Sentences";
    }
  }

  if (!list.length) return false;

  stopAudio();
  if (window.TryIt) TryIt.endFree();
  REVEALED.clear();
  BATCH_RATED.clear();
  BATCH_DONE_LOGGED = false;
  IS_ADAPTIVE_PRACTICE = false;
  const fd = document.getElementById("freeDone"); if (fd) fd.innerHTML = "";

  if (forceDir && promptDirection !== forceDir) {
    promptDirection = forceDir;
    const enBtn = document.getElementById("dirEnFirst");
    const arBtn = document.getElementById("dirArFirst");
    if (enBtn) enBtn.classList.toggle("active", forceDir === "en-first");
    if (arBtn) arBtn.classList.toggle("active", forceDir === "ar-first");
  }

  FOCUSED_PRACTICE_SPEC = { title, sub, backHref, backLabel, search: searchStr || location.search };
  ACTIVE_SENTENCES = list;
  ACTIVE_SENTENCES.forEach((it, idx) => { if (it && it._autoReveal) REVEALED.add(idx); });
  LAST_BATCH_KEYS = list.map(x => x.key);

  const titleEl = document.getElementById("sessionTitle");
  if (titleEl) titleEl.textContent = title;
  const lg = document.getElementById("srsLegend");
  if (lg) lg.innerHTML = `<span class="srs-legend"><span class="leg">${escBriefHtml(sub)}</span></span>`;

  const fb = document.getElementById("focusBanner");
  if (fb) {
    fb.style.display = "block";
    fb.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;padding:10px 14px;border-radius:12px;background:var(--accent-soft);border:1.5px solid var(--accent);font-size:13px">
        <span><b>${escBriefHtml(title)}</b> <span style="color:var(--muted)">· ${list.length} items · syncs across all tabs</span></span>
        <span style="display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap">
          ${backHref ? `<a href="${backHref}" class="pt-btn" style="font-size:12px;padding:4px 10px;text-decoration:none">${escBriefHtml(backLabel)}</a>` : ""}
          <button type="button" class="pt-btn" onclick="clearPracticeFocus()" style="font-size:12px;padding:4px 10px;font-weight:700;color:var(--accent);border-color:var(--accent)">⚡ Back to Daily Adaptive Batch</button>
        </span>
      </div>
    `;
  }

  render10Cards();
  return true;
}

function playCardAudio(idx) {
  const s = ACTIVE_SENTENCES[idx];
  if (!s) return;
  stopAudio();
  if (s.ref && typeof reciteVerse === "function") {
    const p = String(s.ref).split(":").map(Number);
    if (p[0] && p[1]) {
      reciteVerse(p[0], p[1], s.ar, 0.85);
      logEvent({ e: "audio-play", text: s.ar, ref: s.ref, type: "quran-ayah", t: Date.now() });
      return;
    }
  }
  speak(s.speakAr || s.ar, 0.85);
  logEvent({ e: "audio-play", text: s.speakAr || s.ar, type: s.kind || "sentence", t: Date.now() });
}

function playChipAudio(idx, wIdx, encodedWord) {
  const s = ACTIVE_SENTENCES[idx];
  const word = decodeURIComponent(encodedWord);
  if (s && (s.kind === "quran" || s.track === "quran") && Array.isArray(s.wk) && Array.isArray(s.wk[wIdx]) && typeof speakQuranWord === "function") {
    const qwKey = s.wk[wIdx].find(k => /^qw:[^:]+:\d+:\d+$/.test(k));
    if (qwKey) {
      const parts = qwKey.split(":");
      speakQuranWord(parts[1], +parts[2], +parts[3], word, 0.85);
      return;
    }
  }
  speak(word, 0.85);
}

function handleCardClick(idx, e) {
  if (e.target.closest("button") || e.target.closest("a") || e.target.closest("details") || e.target.closest("summary") || e.target.closest(".s-gram-box") || e.target.closest(".lc-wrap") || e.target.closest(".tryit") || e.target.closest(".s-rate-bar") || e.target.closest(".rate-btn") || e.target.closest(".wbw-chip-sm") || e.target.closest(".wbw-chip") || e.target.closest(".line-toggle-btn")) return;
  if (!REVEALED.has(idx)) {
    revealCard(idx);
  }
}

function revealCard(idx) {
  REVEALED.add(idx);
  const s = ACTIVE_SENTENCES[idx];
  const old = document.getElementById("scard-" + idx);
  if (old && s) {
    const y = window.scrollY;
    const tmp = document.createElement("div");
    tmp.innerHTML = cardHtml(s, idx);
    old.replaceWith(tmp.firstElementChild);
    if (window.TryIt) TryIt.rewire();
    updateSessionProgress();
    if (Math.abs(window.scrollY - y) > 1) window.scrollTo(0, y);   // stay exactly where he was
  } else render10Cards();
  if (s) playCardAudio(idx);
}

function revealAllCards() {
  ACTIVE_SENTENCES.forEach((_, idx) => REVEALED.add(idx));
  render10Cards();
}

function setDirection(dir) {
  promptDirection = dir;
  document.getElementById("dirEnFirst").classList.toggle("active", dir === "en-first");
  document.getElementById("dirArFirst").classList.toggle("active", dir === "ar-first");
  render10Cards();
}

/* ---- Practice / Rehearse ---- */
let MYDAY = null;
async function loadMyDay() {
  if (MYDAY) return MYDAY;
  const d = await fetch("data/myday.json").then(r => r.json()).catch(() => ({ sentences: [] }));
  const fem = typeof planProfile === "function" && planProfile().gender === "f";   // Saba: her own forms
  MYDAY = (d.sentences || []).map(s0 => {
    const s = fem && s0.arf ? Object.assign({}, s0, { ar: s0.arf, tr: s0.trf || s0.tr, en: s0.enf || s0.en }) : s0;
    const fr = (typeof Frames !== "undefined" && Frames) ? Frames.detect(s.ar) : { pattern: null, frames: [] };
    const toks = s.ar.replace(/[.،؟!]/g, "").split(/\s+/).filter(Boolean);
    const words = toks.map(w => {
      const nw = normalizeAr(w);
      const gl = WORD_GLOSS_BY_NORM.get(nw) || WORD_GLOSS_BY_NORM.get(nw.replace(/^ال/, "")) || "";
      return [w, gl];
    });
    return { key: s.id, ar: s.ar, en: s.en, tr: s.tr || "", hint: s.swap || "", words, src: "myday", track: "everyday", note: "", pattern: fr.pattern, frames: fr.frames, who: s.who, moment: s.moment, use: 3 };
  });
  // they join the master list so verdicts and the Sunday script resolve them
  MYDAY.forEach(s => { if (!MASTER_SENTENCES.some(x => x.key === s.key)) MASTER_SENTENCES.push(s); });
  return MYDAY;
}
async function startMyDay(rehearse, explicitBatchNum) {
  const md = await loadMyDay();
  const mine = md.filter(s => s.who === "me");
  if (rehearse) {
    const proven = new Set((typeof planScript === "function" ? planScript() : []).map(x => x.en.toLowerCase()));
    let pool = MASTER_SENTENCES.filter(s => proven.has(String(s.en).trim().toLowerCase()));
    if (pool.length < 5) pool = pool.concat(mine.filter(s => !pool.includes(s)).slice(0, 8 - pool.length));
    await TryIt.free({ pool, loose: true, includeRecent: true, size: Math.min(8, Math.max(5, pool.length)), kind: "rehearse", title: "🎤 Rehearse — your Sunday script" });
  } else {
    currentFilter = "balanced";
    loadPracticeBatch(explicitBatchNum);
  }
}

/* Every verdict inside Practice automatically updates its home section:
   · word    → words.html / vocab.html / review.html (vocab-rate + tw: twin)
   · grammar → grammar.html (gt:<id>:<i> + gtest-done when pattern passes)
   · quran   → quran.html + words.html (sentence-rate + qw:/qc: word keys)
   · sentence→ sentences.html + chapters + constituent words */
function wordGradeFor(g) { return g === "solid" || g === "yes" ? "yes" : g === "maybe" ? "maybe" : "no"; }
function rateSentence(key, g, cardIdx, how, meta) {
  SESSION_COOLDOWN.add(key);
  BATCH_RATED.add(key);
  const s = ACTIVE_SENTENCES[cardIdx];
  let nc = null;
  if (s && window.Practice && typeof Practice.syncVerdict === "function") {
    const res = Practice.syncVerdict({
      item: s,
      key,
      grade: g,
      srsApi: SRS,
      getSrs,
      store,
      logEvent,
      normalizeAr,
      wordKeyFor: ar => (typeof _wordKeyFor === "function" && ar) ? _wordKeyFor(normalizeAr(ar).replace(/^ال/, "")) : null,
      chapters: CHAPTERS_LIST,
      via: "practice",
      meta
    });
    nc = res ? res.nc : SRS.rate(key, g);
    if ((s.kind === "quran" || s.track === "quran") && promptDirection === "ar-first" && g !== "retire") {
      logEvent({ e: "alisten-grade", key, ok: g === "yes" || g === "solid", src: "practice-quran", t: Date.now() });
    }
    autoSync();
  } else {
    nc = SRS.rate(key, g);
    autoSync();
  }
  const capDrawer = document.getElementById("capabilityDrawer");
  if (capDrawer && capDrawer.style.display !== "none") {
    capDrawer.innerHTML = renderCapabilityDrawerHTML();
  }
  updateOverallStats();
  SRS.paintBar(document.getElementById("srow-" + cardIdx) || document.getElementById("scard-" + cardIdx), key, nc);
  updateSessionProgress();
}

function jumpToNextUnrated() {
  const unratedIdx = ACTIVE_SENTENCES.findIndex(s => !BATCH_RATED.has(s.key));
  if (unratedIdx < 0) return;
  const el = document.getElementById("scard-" + unratedIdx);
  if (el && el.scrollIntoView) {
    el.scrollIntoView({ behavior: "smooth", block: "center" });
    el.style.boxShadow = "0 0 0 3px rgba(13, 122, 95, 0.35)";
    setTimeout(() => { el.style.boxShadow = ""; }, 1800);
  }
}

function finalizeCurrentBatchTelemetry() {
  const total = ACTIVE_SENTENCES.length;
  if (!IS_ADAPTIVE_PRACTICE || BATCH_DONE_LOGGED || total === 0) return;
  BATCH_DONE_LOGGED = true;
  if (window._pendingCommuteCheck) {
    const c = window._pendingCommuteCheck;
    window._pendingCommuteCheck = null;
    logEvent({ e: "commute-check-done", forT: c.forT, n: c.n, t: Date.now() });
    (c.forTs || []).forEach(ft => { if (ft && ft !== c.forT) logEvent({ e: "commute-check-done", forT: ft, n: c.n, t: Date.now() }); });
  }
  const srsNow = getSrs();
  const okAll = ACTIVE_SENTENCES.filter(s => srsNow[s.key] && (srsNow[s.key].g === "yes" || srsNow[s.key].g === "solid" || srsNow[s.key].b === "never")).length;
  if (window.Practice && typeof Practice.summarizeCapabilities === "function") {
    const activeChapNow = getActiveWeeklyChapter();
    store.set("ats-capabilities", Practice.summarizeCapabilities({
      now: Date.now(), activeChapNum: activeChapNow ? activeChapNow.num : null,
      srs: srsNow, log: store.get("ats-log", []), words: PRACTICE_WORDS,
      sentences: MASTER_SENTENCES, grammar: PRACTICE_GRAMMAR, lessonCards: PRACTICE_LESSON_CARDS
    }));
  }
  logEvent({ e: "tryit-free-done", kind: "myday", n: total, ok: okAll, okAll, via: "markers", t: Date.now() });
  autoSync();
}

function advanceToNextBatch() {
  if (IS_ADAPTIVE_PRACTICE) {
    const curB = (CURRENT_BUILT_BATCH && CURRENT_BUILT_BATCH.batchNum) || 1;
    if (BATCH_RATED.size > 0) finalizeCurrentBatchTelemetry();
    startNextPracticeBatch(curB + 1);

    clearPracticeFocus();

  bankFilter = filt;
  document.querySelectorAll(".b-filter").forEach(b => b.classList.remove("active"));

}

function renderMasterBank() {
  const tbody = document.getElementById("bankTableBody");
  const footer = document.getElementById("bankFooter");
  if (!tbody) return;
  const query = (document.getElementById("bankSearch")?.value || "").trim().toLowerCase();
  const srs = getSrs();
  const now = Date.now();

  let filtered = MASTER_SENTENCES.filter(s => {
    if (query) {
      const matchEn = s.en.toLowerCase().includes(query);
      const matchAr = s.ar.includes(query) || normalizeAr(s.ar).includes(query);
      const matchTr = (s.tr || "").toLowerCase().includes(query);
      const matchNote = (s.note || "").toLowerCase().includes(query);
      const gInfo = s.pattern && GRAMMAR_MAP[s.pattern];
      const matchGram = gInfo ? (gInfo.shortName.toLowerCase().includes(query) || gInfo.rule.toLowerCase().includes(query)) : false;
      if (!matchEn && !matchAr && !matchTr && !matchNote && !matchGram) return false;
    }

    if (bankFilter === "chapters") return s.src === "chapters";
    if (bankFilter === "teacher") return s.src === "teacher";
    if (bankFilter === "quran") return s.track === "quran";
    if (bankFilter === "due") {
      const item = srs[s.key] || {};
      return item.due && item.due <= now && item.b !== "never";
    }
    return true;
  });

  if (filtered.length === 0) {
    tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;padding:24px;color:var(--muted)">No sentences found matching criteria.</td></tr>`;
    if (footer) footer.textContent = "";
    return;
  }

  const displaySlice = filtered.slice(0, 50);

  tbody.innerHTML = displaySlice.map((s, idx) => {
    const exp = getExposure(s.key);
    const item = srs[s.key] || {};
    const curBucket = item.b || (item.box >= 4 ? "strong" : item.box >= 2 ? "medium" : item.box === 1 ? "weak" : null);
    const dots = [1, 2, 3, 4, 5].map(b => b <= exp.box ? "●" : "○").join("");

    return `
      <tr>
        <td style="color:var(--muted);font-size:11.5px">${idx + 1}</td>
        <td>
          <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
            <span class="arabic" dir="rtl" style="font-size:22px;color:var(--accent);line-height:1.4">${s.ar}</span>
            <div style="display:flex;gap:4px;align-items:center;flex-shrink:0">
              <button type="button" class="small icon-btn" onclick="playSingle('${encodeURIComponent(s.ar)}')">🔊</button>
              ${s.words && s.words.length ? `<button type="button" class="line-toggle-btn" id="btn-tbl-wbw-${idx}" onclick="toggleTblWbw(${idx})" title="Toggle word breakdown">🧩</button>` : ''}
              ${s.tr ? `<button type="button" class="line-toggle-btn" id="btn-tbl-tr-${idx}" onclick="toggleTblTr(${idx})" title="Toggle transliteration">🔤</button>` : ''}
            </div>
          </div>
          ${s.tr ? `<div id="tbl-tr-${idx}" style="display:none;font-size:11.5px;color:var(--muted);font-style:italic;margin-top:2px">${s.tr}</div>` : ''}
          ${s.words && s.words.length ? `
            <div id="tbl-wbw-${idx}" class="s-wbw-compact" style="display:none;margin-top:3px">
              <div class="wbw-chips-wrap" style="display:flex;gap:4px;flex-wrap:wrap">
                ${s.words.map((w, wIdx) => {
                  const fam = famLookup(w[0]);
                  return `
                    <div class="wbw-chip-sm ${fam ? 'has-fam' : ''}" onclick="speak('${encodeURIComponent(w[0])}')" title="${w[1]}">
                      <span class="w-ar">${w[0]}</span>
                      <span class="w-en">${w[1]}</span>
                      ${fam ? `<span class="wbw-rf-badge" onclick="event.stopPropagation(); toggleWbwRootFamily('tbl-${idx}', ${wIdx}, '${encodeURIComponent(w[0])}')" title="Explore root ${fam.root}">🌿 ${fam.root}</span>` : ''}
                    </div>
                  `;
                }).join("")}
              </div>
              <div class="wbw-drawer-slot" id="wbw-drawer-slot-tbl-${idx}"></div>
            </div>
          ` : ''}
        </td>
        <td>
          <div style="font-weight:600;font-size:13.5px;color:var(--ink)">${s.en}</div>
          ${s.note ? `<div style="font-size:11px;color:var(--muted);margin-top:2px">💡 ${s.note}</div>` : ''}
          ${renderGrammarRuleHtml(s, true)}
        </td>
        <td>
          <span style="font-size:11.5px;color:var(--muted)">
            ${s.src === 'chapters' ? '📖 Chapter' : s.src === 'teacher' ? '🧑‍🏫 Preply' : s.track === 'quran' ? "🕌 Qur'an" : '🗣 Everyday'}
          </span>
        </td>
        <td style="text-align:center">
          ${exp.isRetired ? `<span class="exp-badge" style="background:rgba(0,0,0,0.06);color:var(--muted);font-size:10.5px;padding:2px 6px">Retired</span>` :
            (item.due && item.due <= now && item.b !== 'never') ? `<span class="exp-badge" style="background:#fef3c7;color:#b45309;font-size:10.5px;padding:2px 6px;font-weight:700">Due</span>` :
            exp.box >= 4 ? `<span class="exp-badge" style="background:#ecfdf5;color:#059669;font-size:10.5px;padding:2px 6px">Mastered</span>` :
            `<span style="color:var(--muted);font-size:11px">—</span>`}
        </td>
        <td style="text-align:right">
          <div class="sheet-rate-bar" onclick="event.stopPropagation()">${SRS.rateBarHtml(s.key, "rateMasterSentence", [])}</div>
        </td>
      </tr>
    `;
  }).join("");

  if (footer) {
    footer.textContent = filtered.length > 50 ? `Showing first 50 of ${filtered.length} matching sentences. Search to narrow down.` : "";
  }
}
