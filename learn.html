<script>
renderNav("learn");
trackPage("learn");

const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const app = document.getElementById("app");
const P = new URLSearchParams(location.search);

/* ---------- typing Arabic ----------
   Typing Arabic script is not the skill being tested — knowing the word is. So
   every answer box converts English letters to Arabic AS he types
   (attachInlineTranslit in js/app.js) and offers tap-to-fix chips from the
   site-wide lexicon when what he has typed is close to a real word.

   The pool rule follows the rest of the codebase: in a LESSON the item's own
   words are included (he is learning them, and picking the right spelling is
   the point), but in a TEST they are excluded, so a chip can never hand him the
   graded answer. A roughly-right spelling still passes either way — writeMatchAr
   accepts sound-alike answers. */
let LEXICON = null;
async function typingPool(exclude) {
  if (!LEXICON) {
    try { LEXICON = Object.keys(await fetch("data/lexicon.json").then(r => r.json())); }
    catch (e) { LEXICON = []; }
  }
  if (!exclude || !exclude.length) return LEXICON;
  const out = new Set(exclude.flatMap(a => String(a).split(/\s+/)).map(w => normalizeAr(w)).filter(Boolean));
  return LEXICON.filter(w => !out.has(normalizeAr(w)));
}

const TYPING_HELP = `
  <details style="margin-top:8px">
    <summary style="cursor:pointer;font-size:12.5px;color:var(--muted)">How to type Arabic here</summary>
    <div style="font-size:12.5px;color:var(--muted);line-height:1.7;margin-top:6px">
      Just type it the way it sounds — <code>kitab</code> → <span dir="rtl">كتاب</span>. It converts as you go.<br>
      <b>Long vowels:</b> <code>aa</code>=ا · <code>ee</code>/<code>ii</code>=ي · <code>oo</code>/<code>uu</code>=و ·
      <b>tricky letters:</b> <code>H</code>=ح · <code>kh</code>=خ · <code>th</code>=ث · <code>dh</code>=ذ ·
      <code>sh</code>=ش · <code>gh</code>=غ · <code>3</code>=ع · <code>S</code>=ص · <code>T</code>=ط ·
      <b>"the":</b> <code>al-kitab</code> → <span dir="rtl">الكتاب</span>.<br>
      Close spellings are accepted, and the chips under the box fix a word with one tap.
    </div>
  </details>`;

/* Wire a freshly-rendered answer box: live conversion, suggestion chips, a tap
   keyboard, and Enter to submit. */
async function wireAnswer(inputId, submitId, exclude) {
  const inp = document.getElementById(inputId);
  if (!inp) return;
  attachInlineTranslit(inp, { lexicon: await typingPool(exclude) });
  inp.focus();
  inp.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); const b = document.getElementById(submitId); if (b) b.click(); } };
  const kb = document.getElementById(inputId + "Kb");
  if (kb) kb.onclick = () => mountTranslitDock(() => document.getElementById(inputId));
}

(async () => {
  const ctx = await curCtx();
  if (!ctx) { app.innerHTML = "<p>Couldn't load the curriculum.</p>"; return; }
  const state = Curriculum.milestoneState(ctx);
  if (!state.current) { app.innerHTML = "<h1>Everything achieved</h1><p>Nothing left on the ladder — ask your coach for more.</p>"; return; }

  const lessonId = P.get("lesson");
  const lessonSet = (P.get("lessons") || "").split(",").filter(Boolean);
  const findMs = id => (ctx.curriculum.milestones || []).find(m => (m.lessons || []).some(l => l.id === id));

  // a week's worth, or a milestone's worth
  if (lessonSet.length) return runTest(lessonSet, ctx, state, P.get("label") || "This week");

  if (lessonId) {
    const src = findMs(lessonId);
    if (!src) { location.href = "index.html"; return; }
    if (P.get("test")) return runTest([lessonId], ctx, state);
    const srcLesson = src.lessons.find(l => l.id === lessonId);
    return runLesson(srcLesson, src, ctx, P.get("mode") === "hands");
  }

  if (P.get("test")) {
    const ms = state.milestones.find(m => m.id === P.get("m")) || state.current;
    const open = ms.lessons.filter(l => !l.mastered).map(l => l.id);
    return runTest(open.length ? open : ms.lessons.map(l => l.id), ctx, state, ms.name);
  }

  // plain Continue
  const next = Curriculum.nextChunk(ctx, state);
  if (!next) { location.href = "index.html"; return; }
  if (next.testNext) return runTest([next.lesson.id], ctx, state);
  const src = findMs(next.lesson.id);
  return runLesson(src.lessons.find(l => l.id === next.lesson.id), src, ctx, false);
})();

/* ======================= A LESSON — one ~7-minute sitting =======================
   THE SENTENCE IS THE UNIT OF STUDY (CURRICULUM.md §5). His rule, 2026-08-30:

     "first it gives a meaning, then i hear it in arabic, then i repeat it myself
      and then i practise variations of it … i just keep working with sentences
      only and as primary method."

   So every lesson walks the same four steps per sentence, and the two tracks
   differ in exactly one place — step 2 — because their goals are opposite:

     🗣 conversation   meaning → HEAR it → produce it → vary it
     🎧 Qur'an         meaning → RECITE it from memory → decode it by ear → vary

   He has the Qur'an memorised, so being played the audio to learn it teaches him
   nothing; what he cannot yet do is understand it AS it is recited. The Qur'an
   loop therefore takes the recitation from him and gives the audio back as the
   test — which is the actual goal ("understand the Qur'an as it is recited"),
   not a proxy for it.

   The lesson still OWNS its word keys: they are what the test proves and what the
   SRS schedules. Every sentence answer grades the words inside it, so the vocab
   list is maintained underneath without him ever seeing a word list — his second
   condition ("you have to maintain a vocab list for me which you test and get me
   to repeat in sentence format"). */
async function runLesson(lesson, ms, ctx, handsFree) {
  const chunk = Curriculum.lessonChunks(lesson)[0];
  const track = ms.track === "quran" ? "quran" : "conv";
  const keys = lesson.keys || [];

  // Review rides at the front as SENTENCES containing what is slipping — never
  // as a word list, which is the thing he asked to stop doing.
  const review = Curriculum.reviewSentencesFor(chunk, ctx, 2);
  const taught = Curriculum.sentencesFor(keys, ctx, { track, limit: 4, exclude: review.map(s => s.key) });

  const items = review.map(s => ({ s, review: true })).concat(taught.map(s => ({ s, review: false })));

  /* Anything the chosen sentences don't reach is still this lesson's job and the
     test will still ask it, so it is met as a one-word sentence rather than
     silently dropped. This is also the honest fallback when no sentence in the
     bank carries a word yet. */
  const covered = new Set(items.flatMap(x => x.s.teaches || x.s.wordKeys || []));
  const missing = keys.filter(k => !covered.has(k));
  if (missing.length) {
    const resolved = await resolveCards(missing);
    resolved.forEach(r => {
      if (!r || !r.v || !r.v.ar) return;
      items.push({ s: {
        key: r.key, ar: r.v.ar, en: r.v.en, tr: r.v.tr || "", track, single: true,
        words: [{ ar: r.v.ar, en: r.v.en, tr: r.v.tr || "", key: r.key }],
        wordKeys: [r.key], teaches: [r.key], note: r.v.note || null,
      }, review: false });
    });
  }
  if (!items.length) { app.innerHTML = "<p>Nothing to study here.</p>"; return; }

  primeSpeak();
  const head = extra => `
    <div class="crumb">${track === "quran" ? "🎧 Qur'an" : "🗣 Everyday"} · ${esc(ms.name)}</div>
    <h1 style="margin-top:0">${esc(lesson.title)}</h1>
    <p class="sub">${extra || ""}${review.length ? ` <span class="pill">+${review.length} to keep warm</span>` : ""}</p>`;

  /* ---- word-level credit ----
     A sentence answer is the only thing he does, so it has to be what feeds the
     word cards. writeMatchAr already reports which target words landed; match
     them to the sentence's words by normalized form (index alignment is not safe
     — punctuation splits differently in different sources). */
  function creditWords(s, m, fallbackOk) {
    (s.words || []).forEach(w => {
      const cards = w.keys && w.keys.length ? w.keys : (w.key ? [w.key] : []);
      if (!cards.length) return;
      let ok = fallbackOk;
      if (m && m.words) {
        const j = m.words.findIndex(t => normalizeAr(t) === normalizeAr(w.ar));
        if (j >= 0) ok = m.hits[j] !== "miss";
      }
      // one word, every card it has: ٱللَّهِ is both qc:1 and qw:fatiha:0:1, and
      // letting those drift apart is what put the same word in a lesson twice
      cards.forEach(k => gradeCard(k, ok ? "good" : "again"));
    });
  }
  function gradeSentence(s, ok, m, byEar) {
    if (s.key) gradeCard(s.key, ok ? "good" : "again");
    creditWords(s, m, ok);
    if (byEar) (s.wordKeys || []).forEach(k => logEvent({ e: "alisten-grade", key: k, ok: !!ok, src: "lesson" }));
  }

  const wordsHtmlFor = s => (s.words || []).filter(w => w.en).map(w =>
    `<span style="display:inline-block;margin:0 6px 6px 0;padding:3px 9px;border:1px solid var(--border);border-radius:8px;font-size:13px">
       <span class="arabic" style="font-size:17px">${esc(w.ar)}</span>
       <span style="color:var(--muted)"> ${esc(w.en)}</span></span>`).join("");

  const sourceLine = s => s.ref ? `${esc(s.surah || "")} ${esc(s.ref)}${s.part ? ` · part ${esc(s.part)}` : ""}`
    : s.theme ? esc(s.theme) : "";

  if (handsFree) return handsFreeRun();
  return grammarGate();

  /* ---- grammar, when a rule genuinely needs explaining ----
     His condition: "if there are grammar rules which i do need to learn or
     understand then that needs to be added on from time to time." Shown ONCE,
     the first time a sentence using the pattern comes up, then never again. */
  async function grammarGate() {
    const pat = Curriculum.grammarToShow(items.map(x => x.s), ctx);
    if (!pat) return run();
    let g = null;
    try { g = (await fetch("data/grammar.json").then(r => r.json())).patterns.find(p => p.id === pat); } catch (e) {}
    if (!g) return run();
    logEvent({ e: "pattern-seen", pattern: pat });
    app.innerHTML = head("One rule first — it turns up in what follows.") + `
      <div class="card">
        <div class="crumb">grammar</div>
        <h2 style="margin:2px 0 8px">${esc(g.name)}</h2>
        <div class="q-ar arabic" style="margin:6px 0">${esc(g.ar)}</div>
        <p style="font-size:15px;line-height:1.75">${esc(g.what)}</p>
        ${(g.examples || []).slice(0, 2).map(e => `
          <div style="border-top:1px solid var(--border);padding-top:8px;margin-top:8px">
            <div class="arabic" style="font-size:21px;direction:rtl;text-align:right">${esc(e.ar)}</div>
            <div style="font-size:13.5px;color:var(--muted)">${esc(e.en)}</div>
          </div>`).join("")}
        <div class="row"><button class="primary" id="gok">Got it →</button></div>
      </div>`;
    document.getElementById("gok").onclick = run;
  }

  /* ---- the four steps, one sentence at a time ---- */
  function run() {
    let i = 0, right = 0, asked = 0;

    const next = () => { i++; step(); };
    const bar = () => `<div class="crumb">${i + 1} of ${items.length}${items[i].review ? " · keeping warm" : ""}
        ${sourceLine(items[i].s) ? ` · ${sourceLine(items[i].s)}` : ""}</div>
      <div class="prog"><i style="width:${Math.round(100 * i / items.length)}%"></i></div>`;

    function step() {
      if (i >= items.length) return finish(right, asked, "screen");
      meaning(items[i].s);
    }

    /* 1 — the meaning, before any Arabic. Front-loading it is what lets the
       Arabic land as language rather than as noise. */
    function meaning(s) {
      app.innerHTML = head() + `<div class="card">${bar()}
        <div class="q-en" style="font-size:20px">${esc(s.en)}</div>
        ${s.verseEn && s.verseEn !== s.en ? `<p style="font-size:13px;color:var(--muted);text-align:center;line-height:1.6">the whole ayah: ${esc(s.verseEn)}</p>` : ""}
        <p style="text-align:center;font-size:14px;color:var(--muted)">${track === "quran"
          ? "You know this one by heart. Ready to say it?" : "That is what you are about to say."}</p>
        <div class="row"><button class="primary" id="go">${track === "quran" ? "Say it →" : "Hear it →"}</button></div>
      </div>`;
      document.getElementById("go").onclick = () => (track === "quran" ? recite(s) : hear(s));
    }

    /* 2a — conversation: hear it, see it, see what each word is doing. */
    function hear(s) {
      app.innerHTML = head() + `<div class="card">${bar()}
        <div class="q-ar arabic" dir="rtl">${esc(s.ar)}</div>
        ${s.tr ? `<p class="q-tr">${esc(s.tr)}</p>` : ""}
        <div class="q-en" style="font-size:15px;color:var(--muted)">${esc(s.en)}</div>
        <div style="text-align:right;direction:rtl">${wordsHtmlFor(s)}</div>
        ${s.note ? `<p style="font-size:13px;color:var(--muted);line-height:1.7">${esc(s.note)}</p>` : ""}
        <div class="row"><button id="again">🔊 again</button><button class="primary" id="go">Now you say it →</button></div>
      </div>`;
      speak(s.ar, 0.85);
      document.getElementById("again").onclick = () => speak(s.ar, 0.85);
      document.getElementById("go").onclick = () => produce(s);
    }

    /* 2b — Qur'an: HE supplies the Arabic. This is the inversion: the recitation
       is already his, so the site asks for it instead of teaching it. */
    function recite(s) {
      app.innerHTML = head() + `<div class="card">${bar()}
        <div class="q-en" style="font-size:17px;color:var(--muted)">${esc(s.en)}</div>
        <p style="text-align:center;font-size:15px">Say it out loud from memory, then check yourself.</p>
        <div class="row"><button class="primary" id="rev">Show me the Arabic</button></div>
      </div>`;
      document.getElementById("rev").onclick = () => {
        app.innerHTML = head() + `<div class="card">${bar()}
          <div class="q-ar arabic" dir="rtl">${esc(s.ar)}</div>
          <div style="text-align:right;direction:rtl">${wordsHtmlFor(s)}</div>
          ${s.note ? `<p style="font-size:13px;color:var(--muted);line-height:1.7">${esc(s.note)}</p>` : ""}
          <p style="text-align:center;font-size:14px;color:var(--muted)">Did it come out right?</p>
          <div class="row"><button id="no">✗ not quite</button><button class="primary" id="yes">✓ yes</button></div>
        </div>`;
        speak(s.ar, 0.85);
        document.getElementById("yes").onclick = () => { asked++; right++; gradeSentence(s, true); decode(s); };
        document.getElementById("no").onclick = () => { asked++; gradeSentence(s, false); decode(s); };
      };
    }

    /* 3a — Qur'an: the real goal. Audio only, at speed. Does the meaning arrive? */
    function decode(s) {
      app.innerHTML = head() + `<div class="card">${bar()}
        <p style="text-align:center;font-size:15px;margin-top:14px">Now just listen. Does the meaning arrive on its own?</p>
        <div class="row"><button class="primary" id="play" style="font-size:17px">🔊 play</button></div>
        <div class="row"><button id="rev">show me</button></div>
      </div>`;
      speak(s.ar, 0.95);
      document.getElementById("play").onclick = () => speak(s.ar, 0.95);
      document.getElementById("rev").onclick = () => {
        app.innerHTML = head() + `<div class="card">${bar()}
          <div class="q-ar arabic" dir="rtl" style="font-size:26px">${esc(s.ar)}</div>
          <div class="q-en">${esc(s.en)}</div>
          <p style="text-align:center;font-size:14px;color:var(--muted)">Did it arrive while it played?</p>
          <div class="row"><button id="no">✗ no</button><button class="primary" id="yes">✓ yes</button></div>
        </div>`;
        document.getElementById("yes").onclick = () => { gradeSentence(s, true, null, true); vary(s); };
        document.getElementById("no").onclick = () => { gradeSentence(s, false, null, true); vary(s); };
      };
    }

    /* 3b — conversation: produce it. Typed, because typing is the only way the
       site can actually check him — and every word inside is graded from it. */
    function produce(s) {
      app.innerHTML = head() + `<div class="card">${bar()}
        <div class="q-en">${esc(s.en)}</div>
        <p style="text-align:center;font-size:13.5px;color:var(--muted)">Write the whole thing — type it the way it sounds</p>
        <input id="ans" dir="rtl" style="width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:10px;font-size:22px;text-align:center">
        <div class="row"><button class="primary" id="chk">Check</button><button id="skip">show me</button><button class="small" id="ansKb">⌨ keys</button></div>
        ${TYPING_HELP}</div>`;
      // a LESSON may suggest the sentence's own words — he is learning to spell them
      wireAnswer("ans", "chk");
      const submit = show => {
        const inp = document.getElementById("ans");
        const m = show ? null : writeMatchAr(inp.value, s.ar);
        const ok = !!(m && m.ok);
        asked++; if (ok) right++;
        gradeSentence(s, ok, m);
        app.innerHTML = head() + `<div class="card">${bar()}
          <p style="text-align:center;font-size:16px">${show ? "" : ok ? "✓ right" : (m && m.right ? `${m.right} of ${m.total} words` : "✗ not quite")}</p>
          <div class="q-ar arabic" dir="rtl">${esc(s.ar)}</div>
          ${s.tr ? `<p class="q-tr">${esc(s.tr)}</p>` : ""}
          <div style="text-align:right;direction:rtl">${wordsHtmlFor(s)}</div>
          <div class="row"><button class="primary" id="next">Next</button></div>
        </div>`;
        speak(s.ar, 0.85);
        document.getElementById("next").onclick = () => vary(s);
      };
      document.getElementById("chk").onclick = () => submit(false);
      document.getElementById("skip").onclick = () => submit(true);
    }

    /* 4 — variations. Only ever VERIFIED mutations (the conjugation table), never
       invented Arabic, and never a mutation of an ayah: revelation supplies the
       pattern, everyday Arabic supplies the drill. Sentences with no verified
       variation skip this step rather than fake one. */
    function vary(s) {
      const opts = (s.vary || []).filter(v => normalizeAr(v.ar) !== normalizeAr(s.ar));
      if (!opts.length) return next();
      const pick = opts[(i * 3) % opts.length];
      app.innerHTML = head() + `<div class="card">${bar()}
        <div class="crumb">same sentence, one thing changed</div>
        <div class="q-en">${esc(pick.en)}</div>
        <p style="text-align:center;font-size:13px;color:var(--muted)">You just wrote “${esc(s.en)}”. Change it.</p>
        <input id="ans" dir="rtl" style="width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:10px;font-size:22px;text-align:center">
        <div class="row"><button class="primary" id="chk">Check</button><button id="skip">show me</button><button class="small" id="ansKb">⌨ keys</button></div>
      </div>`;
      wireAnswer("ans", "chk");
      const done = show => {
        const inp = document.getElementById("ans");
        const m = show ? null : writeMatchAr(inp.value, pick.ar);
        const ok = !!(m && m.ok);
        asked++; if (ok) right++;
        logEvent({ e: "vary", sentence: s.key, ok, form: pick.verb || "" });
        app.innerHTML = head() + `<div class="card">${bar()}
          <p style="text-align:center;font-size:16px">${show ? "" : ok ? "✓ right" : "✗ not quite"}</p>
          <div class="q-ar arabic" dir="rtl">${esc(pick.ar)}</div>
          <div class="q-en" style="font-size:15px;color:var(--muted)">${esc(pick.en)}</div>
          <div class="row"><button class="primary" id="next">Next</button></div>
        </div>`;
        speak(pick.ar, 0.85);
        document.getElementById("next").onclick = next;
      };
      document.getElementById("chk").onclick = () => done(false);
      document.getElementById("skip").onclick = () => done(true);
    }

    step();
  }

  /* ---- hands-free ----
     Same material, no taps: the sentence's meaning, then the sentence. Three
     oversized targets while it plays (his 2026-08-30 ask) — got it / missed it /
     pause — and a tap grades the sentence and every word in it for real. */
  function handsFreeRun() {
    let i = 0, pass = 1, paused = false, timer = null, token = 0;
    let graded = 0, right = 0;
    const PASSES = 2;

    app.innerHTML = head("Hands-free. It plays on its own — tap only if you want to mark one.") + `
      <div class="card">
        <div class="hands"><div class="w" id="hw">…</div>
          <p style="color:var(--muted);font-size:15px;min-height:22px" id="hs"></p></div>
        <div class="prog"><i id="hp" style="width:0%"></i></div>
        <div style="display:flex;gap:10px;margin-top:16px">
          <button id="hno"  style="flex:1;padding:22px 8px;font-size:17px">✗ missed it</button>
          <button class="primary" id="hyes" style="flex:1;padding:22px 8px;font-size:17px">✓ got it</button>
        </div>
        <div style="display:flex;gap:10px;margin-top:10px">
          <button id="hpause" style="flex:1;padding:16px 8px;font-size:16px">⏸ Pause</button>
          <button id="hstop"  style="flex:1;padding:16px 8px;font-size:16px">Finish</button>
        </div>
        <p style="font-size:12.5px;color:var(--muted);margin:10px 0 0" id="hcount"></p>
      </div>`;

    const w = document.getElementById("hw"), sub = document.getElementById("hs"), bar = document.getElementById("hp");
    const countEl = document.getElementById("hcount"), pauseBtn = document.getElementById("hpause");

    const clearTimer = () => { if (timer) { clearTimeout(timer); timer = null; } };
    const later = (fn, ms) => { const t = token; clearTimer(); timer = setTimeout(() => { if (t === token && !paused) fn(); }, ms); };

    document.getElementById("hyes").onclick = () => mark(true);
    document.getElementById("hno").onclick = () => mark(false);
    document.getElementById("hstop").onclick = () => { token++; clearTimer(); stopSpeak(); finish(right, graded, "hands", graded === 0); };
    pauseBtn.onclick = () => {
      if (paused) { paused = false; pauseBtn.textContent = "⏸ Pause"; step(); }
      else { paused = true; token++; clearTimer(); stopSpeak(); pauseBtn.textContent = "▶ Resume"; sub.textContent = "paused"; }
    };

    function mark(ok) {
      if (paused || i >= items.length) return;
      const s = items[i].s;
      gradeSentence(s, ok, null, true);
      graded++; if (ok) right++;
      countEl.textContent = `${right} of ${graded} marked right`;
      token++; clearTimer(); stopSpeak();
      sub.textContent = (ok ? "✓ " : "✗ ") + s.en;
      i++;
      later(step, 700);
    }

    function step() {
      if (paused) return;
      if (i >= items.length) { if (++pass > PASSES) return finish(right, graded, "hands"); i = 0; }
      const s = items[i].s;
      const total = items.length * PASSES, at = (pass - 1) * items.length + i;
      bar.style.width = Math.round(100 * at / total) + "%";
      const t = ++token;
      // meaning first, then the Arabic — the same order as on screen
      w.textContent = s.en;
      sub.textContent = pass === 1 ? "how would you say it?" : "say it with me";
      speak(s.en, 1.0, () => {
        if (t !== token || paused) return;
        later(() => {
          w.textContent = s.ar;
          speak(s.ar, 0.85, () => {
            if (t !== token || paused) return;
            i++; later(step, 400);
          });
        }, pass === 1 ? 2600 : 900);
      });
    }
    step();
  }

  function finish(right, total, how, stopped) {
    if (!stopped) logEvent({ e: "chunk-done", chunk: chunk.id, lesson: lesson.id, milestone: ms.id, mode: how, right, total });
    try { if (typeof syncSoon === "function") syncSoon(); } catch (e) {}
    app.innerHTML = `
      <h1>${stopped ? "Stopped" : "Lesson done"}</h1>
      <div class="card">
        ${total ? `<p style="font-size:16px;margin-top:0">${right} of ${total} without help.</p>` : ""}
        <p style="font-size:14.5px;color:var(--muted)">${esc(ms.name)} · ${esc(lesson.title)}</p>
        <p style="font-size:15px">${how === "hands"
          ? "That was a listening pass — it doesn't prove the lesson on its own. The 3-minute test does."
          : "Now prove it: the test takes about three minutes and marks the lesson done at 80."}</p>
        <div class="row" style="justify-content:flex-start">
          <a href="learn.html?test=1&lesson=${encodeURIComponent(lesson.id)}"><button class="primary">Take the test · ~3 min</button></a>
          <a href="index.html"><button>Back</button></a>
        </div>
      </div>`;
  }
}

/* ======================= A TEST — one engine, three scopes =======================
   One lesson (~3 min), a week's seven (~7 min), or a milestone. Scoring is per
   lesson at 80 in every case, so clearing a lesson clears it everywhere. */
async function runTest(lessonIds, ctx, state, label) {
  const attempts = (ctx.log || []).filter(e => e && e.e === "exam-done").length;
  const all = state.milestones.flatMap(m => m.lessons);
  const open = lessonIds.filter(id => { const l = all.find(x => x.id === id); return l && !l.mastered; });
  const use = open.length ? open : lessonIds;
  const ex = Curriculum.examForLessons(use, ctx, { attempt: attempts + 1, state, seed: use.length + (label ? label.length : 3) });
  if (!ex.items.length) {
    app.innerHTML = `<h1>Nothing left to prove</h1><p>Everything here is already proved and still fresh.</p>
      <div class="row" style="justify-content:flex-start"><a href="index.html"><button class="primary">Back</button></a></div>`;
    return;
  }
  const resolved = await resolveCards(ex.items.map(i => i.key));
  /* HE IS TESTED IN SENTENCES (his rule, 2026-08-30: "you have to maintain a
     vocab list for me which you test and get me to repeat in sentence format").
     The exam still SELECTS words — they are what a lesson owns and what gets
     scheduled — but a production question asks for the whole sentence the word
     lives in, and the question is marked on whether that word landed. Short
     sentences only: a nine-word ayah is a fair thing to study and an unfair
     thing to make him type. */
  const qs = ex.items.map((it, i) => {
    const q = Object.assign({}, it, { v: resolved[i] && resolved[i].v });
    if (q.form === "prod") {
      const s = Curriculum.sentencesFor([q.key], ctx, { limit: 1 })[0];
      if (s && (s.words || []).length >= 2 && (s.words || []).length <= 6) q.sentence = s;
    }
    return q;
  }).filter(q => q.v && q.v.ar);

  const title = label || (use.length === 1 ? (all.find(l => l.id === use[0]) || {}).title : "The test");
  const scope = Curriculum.scopeKey(use);
  const prior = Curriculum.scopeHistory(ctx.log, use);
  primeSpeak();
  logEvent({ e: "exam-start", lessons: use, scope, total: qs.length, attempt: attempts + 1 });
  const answers = [];
  let i = 0;

  const priorLine = prior
    ? `<span class="pill">last time: ${prior.last}${prior.attempts > 1 ? ` · ${prior.scores.join(" → ")}` : ""}</span>`
    : "";
  const head = `<div class="crumb">Test</div><h1 style="margin-top:0">${esc(title)}</h1>
    <p class="sub">${qs.length} questions, about ${ex.minutes} minute${ex.minutes === 1 ? "" : "s"}. Pass mark ${Curriculum.PASS}.
    ${ex.sampled ? `A sample across ${use.length} lessons${ex.clearable ? "" : " — too few each to clear a lesson, so this one is a check"}.` : "Each lesson is scored on its own."}
    ${priorLine}</p>`;

  ask();
  function ask() {
    if (i >= qs.length) return done();
    const q = qs[i];
    const n = `<div class="crumb">${i + 1} of ${qs.length} · ${esc(q.lessonTitle)}${q.form === "ear" ? " · by ear" : ""}</div>
      <div class="prog"><i style="width:${Math.round(100 * i / qs.length)}%"></i></div>`;
    if (q.form === "ear") {
      app.innerHTML = head + `<div class="card">${n}
        <p style="text-align:center;font-size:15px;margin-top:14px">Listen. What does it mean?</p>
        <div class="row"><button class="primary" id="play" style="font-size:17px">🔊 play</button></div>
        <div class="row"><button id="rev">show the answer</button></div></div>`;
      document.getElementById("play").onclick = () => speak(q.v.ar, 0.85);
      speak(q.v.ar, 0.85);
      document.getElementById("rev").onclick = reveal;
    } else if (q.form === "mean") {
      app.innerHTML = head + `<div class="card">${n}
        <div class="q-ar arabic">${esc(q.v.ar)}</div>
        <p style="text-align:center;font-size:15px;color:var(--muted)">What does it mean?</p>
        <div class="row"><button id="rev">show the answer</button></div></div>`;
      document.getElementById("rev").onclick = reveal;
    } else {
      const sent = q.sentence;
      const target = sent ? sent.ar : q.v.ar;
      app.innerHTML = head + `<div class="card">${n}
        <div class="q-en">${esc(sent ? sent.en : q.v.en)}</div>
        <p style="text-align:center;font-size:13px;color:var(--muted)">${sent
          ? `Write the whole sentence — it is marked on <span class="arabic" style="font-size:16px">${esc(q.v.ar)}</span>`
          : "Type it the way it sounds — it turns into Arabic as you go"}</p>
        <input id="ans" dir="rtl" style="width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:10px;font-size:22px;text-align:center">
        <div class="row"><button class="primary" id="chk">Check</button><button id="skip">skip</button><button class="small" id="ansKb">⌨ keys</button></div>
        ${TYPING_HELP}</div>`;
      // a TEST excludes the answer's own words, so a chip can never give it away
      wireAnswer("ans", "chk", [target]);
      document.getElementById("chk").onclick = () => {
        const inp = document.getElementById("ans");
        const m = writeMatchAr(inp.value, target);
        if (!sent) return score(m.ok || arMatch(inp.value, q.v.ar), true);
        // the question is this WORD; the sentence is only how it was asked
        const j = (m.words || []).findIndex(t => normalizeAr(t) === normalizeAr(q.v.ar));
        const gotWord = j >= 0 ? m.hits[j] !== "miss" : m.ok;
        // the rest of the sentence still counts as revision, as it does in a lesson
        (sent.words || []).forEach(w => {
          const cards = w.keys && w.keys.length ? w.keys : (w.key ? [w.key] : []);
          if (!cards.length || normalizeAr(w.ar) === normalizeAr(q.v.ar)) return;
          const k = (m.words || []).findIndex(t => normalizeAr(t) === normalizeAr(w.ar));
          if (k >= 0) cards.forEach(c => gradeCard(c, m.hits[k] !== "miss" ? "good" : "again"));
        });
        score(gotWord, true);
      };
      document.getElementById("skip").onclick = () => score(false, true);
    }
    function reveal() {
      app.innerHTML = head + `<div class="card">${n}
        <div class="q-ar arabic">${esc(q.v.ar)}</div>
        <div class="q-en">${esc(q.v.en)}</div>
        ${q.v.tr ? `<p class="q-tr">${esc(q.v.tr)}</p>` : ""}
        <p style="text-align:center;font-size:14px;color:var(--muted)">Did you have it?</p>
        <div class="row">
          <button id="no" style="min-width:130px">✗ no</button>
          <button class="primary" id="yes" style="min-width:130px">✓ yes</button>
        </div></div>`;
      document.getElementById("yes").onclick = () => score(true);
      document.getElementById("no").onclick = () => score(false);
    }
    function score(ok, showAnswer) {
      answers.push({ key: q.key, lessonId: q.lessonId, lessonTitle: q.lessonTitle, form: q.form, ok: !!ok });
      gradeCard(q.key, ok ? "good" : "again");     // the test is also revision
      if (q.form === "ear") logEvent({ e: "alisten-grade", key: q.key, ok: !!ok, src: "test" });
      i++;
      if (showAnswer && !ok) {
        app.innerHTML = head + `<div class="card">${n}
          <p style="text-align:center;font-size:16px">✗ not quite</p>
          <div class="q-ar arabic">${esc(q.v.ar)}</div>
          <div class="q-en">${esc(q.v.en)}</div>
          <div class="row"><button class="primary" id="next">Next</button></div></div>`;
        document.getElementById("next").onclick = ask;
      } else ask();
    }
  }

  function done() {
    const r = Curriculum.milestoneScoreOf(answers);
    // a score from too few questions reports but must not clear a lesson
    const lessons = ex.clearable ? r.lessons : {};
    logEvent({ e: "exam-done", lessons: lessons, reported: r.lessons, scope, attempt: attempts + 1,
               score: r.score, correct: r.correct, total: r.total, sections: r.sections });
    try { if (typeof syncSoon === "function") syncSoon(); } catch (e) {}

    const cleared = Object.keys(r.lessons).filter(id => r.lessons[id] >= Curriculum.PASS);
    const stillOpen = Object.keys(r.lessons).filter(id => r.lessons[id] < Curriculum.PASS);
    const band = Curriculum.examBand(r.score);
    app.innerHTML = `
      <h1 style="margin-bottom:4px">${esc(title)}</h1>
      <div class="card" style="border-color:var(--accent)">
        <div style="text-align:center">
          <div class="big">${r.score}</div>
          <div style="font-size:15px;font-weight:600;text-transform:capitalize">${esc(band.band)}</div>
          ${prior ? `<div style="font-size:13.5px;color:${r.score > prior.last ? "var(--accent)" : "var(--muted)"};font-weight:600">
              ${r.score > prior.last ? `up from ${prior.last} (+${r.score - prior.last})`
                : r.score === prior.last ? `same as last time (${prior.last})`
                : `down from ${prior.last} (${r.score - prior.last})`}</div>
            <div style="font-size:12.5px;color:var(--muted)">${prior.scores.concat([r.score]).join(" → ")}</div>` : ""}
          ${r.sections.ear !== null ? `<div style="font-size:13px;color:var(--muted)">by ear: ${r.sections.ear}%</div>` : ""}
        </div>
        <div style="margin-top:16px">
          ${Object.keys(r.lessons).map(id => `
            <div class="lrow">
              <span>${r.lessons[id] >= Curriculum.PASS && ex.clearable ? "✓ " : ""}${esc(r.lessonTitles[id])}</span>
              <strong style="color:${r.lessons[id] >= Curriculum.PASS ? "var(--accent)" : "var(--muted)"}">${r.lessons[id]}</strong>
            </div>`).join("")}
        </div>
        <p style="font-size:14.5px;margin-top:14px">
          ${!ex.clearable ? `This was a spread across ${use.length} lessons — enough to show where you stand, not enough per lesson to mark them done. Take a lesson's own 3-minute test to clear it.`
            : cleared.length ? `<strong>Proved:</strong> ${esc(cleared.map(id => r.lessonTitles[id]).join(", "))}.${stillOpen.length ? ` Still open: ${esc(stillOpen.map(id => r.lessonTitles[id]).join(", "))} — those come back, the rest won't.` : ""}`
            : `Nothing cleared this time — 80 is the bar. Those lessons come back; anything you've already proved won't.`}
        </p>
        <div class="row" style="justify-content:flex-start">
          <a href="index.html"><button class="primary">Back to your lessons</button></a>
          <a href="${use.length === 1 ? `learn.html?test=1&lesson=${encodeURIComponent(use[0])}` : `learn.html?lessons=${encodeURIComponent(use.join(","))}&label=${encodeURIComponent(title)}`}"><button>Take it again</button></a>
        </div>
      </div>`;
  }
}
</script>
</body>
</html>
