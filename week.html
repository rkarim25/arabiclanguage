<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0d7a5f">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>This week — Arabic Through Stories</title>
  <link rel="stylesheet" href="css/fonts.css?v=mtep6zor">
  <link rel="stylesheet" href="css/style.css?v=mtep6zor">
  <style>
    .lvl { display:flex; gap:12px; flex-wrap:wrap; }
    .lvl-chip { flex:1 1 260px; background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px; }
    .lvl-badge { display:inline-block; font-size:22px; font-weight:700; color:var(--accent); letter-spacing:.5px; }
    .lvl-can { font-size:14px; line-height:1.55; margin:4px 0 0; }
    .bar { height:8px; background:var(--border); border-radius:99px; overflow:hidden; margin:8px 0 0; }
    .bar > i { display:block; height:100%; background:var(--accent); border-radius:99px; }
    .crit { font-size:13px; line-height:1.7; color:var(--muted); margin:8px 0 0; padding:0; list-style:none; }
    .crit li.met { color:var(--text); }
    .obj { border:1px solid var(--border); border-radius:12px; padding:12px 14px; margin-bottom:10px; }
    .obj.done { border-color:var(--accent); background:var(--accent-soft); }
    .obj h3 { margin:0 0 4px; font-size:15.5px; }
    .obj .meta { font-size:13px; color:var(--muted); }
    .wk-tbl { width:100%; border-collapse:collapse; font-size:14px; }
    .wk-tbl th, .wk-tbl td { text-align:left; padding:7px 8px; border-bottom:1px solid var(--border); }
    .wk-tbl th { font-size:12.5px; color:var(--muted); font-weight:600; }
    .score { font-weight:700; }
    .traj { font-size:13px; color:var(--muted); }
    .q-ar { font-size:30px; line-height:1.7; text-align:center; margin:14px 0; }
    .q-en { font-size:19px; text-align:center; margin:14px 0; }
    .q-row { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:14px; }
    .big { font-size:42px; font-weight:700; color:var(--accent); line-height:1; }
  </style>
</head>
<body>
<main>
  <h1>This week</h1>
  <p class="sub">One target, clearly described: <strong>master these things</strong>. How long it takes is up to you —
  there's no clock, and nothing here is ever marked late.</p>

  <div class="card" id="levelCard"><h2>Where you are</h2><div id="levels">Working it out…</div></div>
  <div class="card" id="weekCard"><h2>Your target</h2><div id="weekBody">Loading…</div></div>
  <div class="card" id="testCard" style="border-color:var(--accent)"><h2>📝 The test</h2><div id="testBody">Loading…</div></div>
  <div class="card" id="histCard" style="display:none"><h2>Every week so far</h2><div id="histBody"></div></div>
</main>

<script src="js/progress-model.js?v=mtep6zor"></script>
<script src="js/curriculum.js?v=mtep6zor"></script>
<script src="js/app.js?v=mtep6zor"></script>
<script src="js/tracker.js?v=mtep6zor"></script>
<script src="js/plan.js?v=mtep6zor"></script>
<script>
renderNav("week");
trackPage("week");

const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let WEEK = null, CTX = null;

/* ---------- where you are: the ladder ---------- */
function paintLevels(ctx) {
  const L = Curriculum.levels(ctx);
  document.getElementById("levels").innerHTML = `<div class="lvl">` + Object.values(L).map(t => {
    const cur = t.current
      ? `<span class="lvl-badge">${esc(t.current.label)}</span> <span style="font-size:13px;color:var(--muted)">${esc(t.icon)} ${esc(t.name)}</span>
         <p class="lvl-can">${esc(t.current.can)}</p>`
      : `<span class="lvl-badge" style="color:var(--muted)">—</span> <span style="font-size:13px;color:var(--muted)">${esc(t.icon)} ${esc(t.name)}</span>
         <p class="lvl-can" style="color:var(--muted)">Not yet at a level — ${esc(t.next.label)} is the first one.</p>`;
    const nx = t.next ? `
      <div style="margin-top:10px;border-top:1px dashed var(--border);padding-top:9px">
        <div style="font-size:13.5px"><strong>Next — ${esc(t.next.label)}:</strong> ${esc(t.next.can)}</div>
        <div class="bar"><i style="width:${Math.round(t.nextPct * 100)}%"></i></div>
        <ul class="crit">${t.next.criteria.map(c =>
          `<li class="${c.met ? "met" : ""}">${c.met ? "✓" : "·"} ${esc(c.label)} — ${esc(c.have)}/${esc(c.need)} ${esc(c.unit)}</li>`).join("")}</ul>
      </div>` : `<p class="lvl-can" style="margin-top:10px">Every level earned.</p>`;
    return `<div class="lvl-chip">${cur}${nx}</div>`;
  }).join("") + `</div>`;
}

/* ---------- your target: objectives, not minutes ---------- */
function paintWeek(week, ctx) {
  const p = Curriculum.weekProgress(week, ctx.srs, Date.now());
  const left = weekDaysLeft(week);
  const el = document.getElementById("weekBody");
  el.innerHTML = `
    <p style="margin-top:0;font-size:15px"><strong>${esc(week.title)}</strong>
      ${week.lesson ? ` · <span style="color:var(--muted)">${esc(week.lesson)}</span>` : ""}</p>
    ${week.why ? `<p style="font-size:13.5px;color:var(--muted);margin-top:-6px">${esc(week.why)}</p>` : ""}
    <p style="font-size:14px">
      <strong>${p.mastered} of ${p.objectiveCount}</strong> mastered${p.extra ? ` · <span style="color:var(--accent)">+${p.extra} extra learnt beyond the target</span>` : ""}
      ${left !== null && left >= 0 ? ` · <span style="color:var(--muted)">${left === 0 ? "last day of the week" : left + " day" + (left === 1 ? "" : "s") + " left in the week"}</span>` : ""}
    </p>
    ${p.objectives.map(o => `
      <div class="obj ${o.mastered ? "done" : ""}">
        <h3>${o.mastered ? "✓ " : ""}${esc(o.title)}</h3>
        <div class="meta">${o.solid} of ${o.total} solid${o.why ? " · " + esc(o.why) : ""}</div>
        <div class="bar"><i style="width:${Math.round(o.pct * 100)}%"></i></div>
      </div>`).join("")}
    ${p.complete ? `<p style="font-size:14px;color:var(--accent);font-weight:600">Every objective mastered. Anything more this week is a bonus — and it still counts in the test.</p>` : ""}
    <div class="q-row" style="justify-content:flex-start">
      <a class="primary" href="index.html" style="text-decoration:none;padding:10px 18px;border-radius:10px;display:inline-block">▶ Do a lesson chunk</a>
      <a href="audio.html?commute=1" style="text-decoration:none;padding:10px 18px;border-radius:10px;display:inline-block;border:1px solid var(--border)">🚗 Commute version</a>
    </div>`;
}

/* ---------- the record ---------- */
function paintHistory(ctx) {
  const hist = Curriculum.weekHistory(ctx.log).filter(w => w.title);
  if (hist.length < 1) return;
  document.getElementById("histCard").style.display = "block";
  document.getElementById("histBody").innerHTML = `
    <table class="wk-tbl">
      <thead><tr><th>Week</th><th>What it covered</th><th>Score</th></tr></thead>
      <tbody>${hist.slice().reverse().map(w => {
        const tr = Curriculum.examTrajectory(ctx.log, w.n);
        return `<tr>
          <td>${w.n}</td>
          <td>${esc(w.title)}<br><span class="traj">${w.from ? esc(w.from) + " → " + esc(w.to) : ""}</span></td>
          <td>${typeof w.score === "number"
            ? `<span class="score">${w.score}</span> <span class="traj">${Curriculum.examBand(w.score).band}</span>` +
              (tr && tr.attempts > 1 ? `<br><span class="traj">${tr.attempts} attempts: ${tr.scores.join(" → ")}</span>` : "")
            : `<span class="traj">not tested</span>`}</td>
        </tr>`;
      }).join("")}</tbody>
    </table>`;
}

/* ============================ THE TEST ============================
   Always open, unlimited retakes. Every attempt grades real SRS cards, so
   taking it IS studying (retrieval practice) — not only measuring.
   Only the LATEST attempt of a week goes on the record. */
function paintTestIntro(week, ctx) {
  const tr = Curriculum.examTrajectory(ctx.log, week.n);
  const kind = Curriculum.examKind(week.n);
  const scope = Curriculum.examScope(kind);
  document.getElementById("testBody").innerHTML = `
    <p style="margin-top:0;font-size:14.5px">${esc(scope.label)} — take it as often as you like.
    Each go is also revision: every answer updates the real deck, so testing yourself teaches you too.</p>
    ${tr ? `<p style="font-size:14px">So far this week: <strong>${tr.scores.join(" → ")}</strong>
        ${tr.gain > 0 ? `<span style="color:var(--accent)">(+${tr.gain} since your first go)</span>` : ""}
        <br><span class="traj">Your latest, ${tr.latest}, is what goes on the record.</span></p>`
      : `<p style="font-size:14px;color:var(--muted)">You haven't tested yourself on this week yet.</p>`}
    <div class="q-row" style="justify-content:flex-start">
      <button class="primary" id="btnTest">${tr ? "Take it again" : "Start the test"}</button>
    </div>`;
  document.getElementById("btnTest").onclick = () => runTest(week, ctx);
}

async function runTest(week, ctx) {
  const body = document.getElementById("testBody");
  body.innerHTML = `<p>Building your test…</p>`;
  const attempt = weekAttemptsSoFar(week) + 1;
  const ex = Curriculum.examBuild(week, ctx, { attempt });
  const resolved = await resolveCards(ex.items.map(i => i.key));
  const qs = ex.items.map((it, i) => ({ ...it, v: resolved[i] && resolved[i].v })).filter(q => q.v && q.v.ar);
  if (!qs.length) { body.innerHTML = `<p>There's nothing to test yet — do a lesson chunk first.</p>`; paintTestIntro(week, ctx); return; }

  logEvent({ e: "exam-start", n: week.n, kind: ex.kind, total: qs.length, attempt });
  const answers = [];
  let i = 0;
  primeSpeak();

  function ask() {
    if (i >= qs.length) return finish();
    const q = qs[i];
    const head = `<p style="font-size:13px;color:var(--muted);margin-top:0">Question ${i + 1} of ${qs.length}
      · ${q.section === "carry" ? "from an earlier week" : "this week"}${q.form === "ear" ? " · by ear" : ""}</p>`;

    if (q.form === "ear") {
      body.innerHTML = `${head}
        <p style="text-align:center;font-size:15px">Listen. What does it mean?</p>
        <div class="q-row"><button class="primary" id="play" style="font-size:17px">🔊 play</button></div>
        <div class="q-row"><button id="rev">show the answer</button></div>`;
      document.getElementById("play").onclick = () => speak(q.v.ar, 0.85);
      speak(q.v.ar, 0.85);
      document.getElementById("rev").onclick = () => reveal(q, true);
    } else if (q.form === "mean") {
      body.innerHTML = `${head}
        <div class="q-ar arabic">${esc(q.v.ar)}</div>
        <p style="text-align:center;font-size:15px;color:var(--muted)">What does it mean?</p>
        <div class="q-row"><button id="rev">show the answer</button></div>`;
      document.getElementById("rev").onclick = () => reveal(q, true);
    } else {
      body.innerHTML = `${head}
        <div class="q-en">${esc(q.v.en)}</div>
        <p style="text-align:center;font-size:14px;color:var(--muted)">Write it in Arabic (typing in English letters works too)</p>
        <input id="ans" style="width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:10px;font-size:20px;text-align:center" dir="rtl">
        <div class="q-row"><button class="primary" id="chk">Check</button><button id="skip">skip</button></div>`;
      const inp = document.getElementById("ans");
      inp.focus();
      inp.onkeydown = e => { if (e.key === "Enter") document.getElementById("chk").click(); };
      document.getElementById("chk").onclick = () => {
        const m = writeMatchAr(inp.value, q.v.ar);
        const got = m.ok || arMatch(inp.value, q.v.ar);
        score(q, got, `<p style="text-align:center;font-size:15px">${got ? "✓ right" : "✗ not quite"} — the answer is <span class="arabic" style="font-size:22px">${esc(q.v.ar)}</span></p>`);
      };
      document.getElementById("skip").onclick = () => score(q, false, `<p style="text-align:center">The answer is <span class="arabic" style="font-size:22px">${esc(q.v.ar)}</span></p>`);
    }
  }

  function reveal(q, selfGrade) {
    body.innerHTML = `
      <div class="q-ar arabic">${esc(q.v.ar)}</div>
      <div class="q-en">${esc(q.v.en)}</div>
      ${q.v.tr ? `<p style="text-align:center;color:var(--muted);font-size:14px">${esc(q.v.tr)}</p>` : ""}
      <p style="text-align:center;font-size:14px;color:var(--muted)">Did you have it?</p>
      <div class="q-row">
        <button id="no" style="min-width:130px">✗ no</button>
        <button class="primary" id="yes" style="min-width:130px">✓ yes</button>
      </div>`;
    document.getElementById("yes").onclick = () => score(q, true);
    document.getElementById("no").onclick = () => score(q, false);
  }

  function score(q, got, feedbackHTML) {
    answers.push({ key: q.key, ok: !!got, section: q.section, form: q.form });
    // the test teaches: every answer moves the real card
    gradeCard(q.key, got ? "good" : "again");
    if (q.form === "ear") logEvent({ e: "alisten-grade", key: q.key, ok: !!got, src: "exam" });
    i++;
    if (feedbackHTML) {
      body.innerHTML = feedbackHTML + `<div class="q-row"><button class="primary" id="next">Next</button></div>`;
      document.getElementById("next").onclick = ask;
    } else ask();
  }

  function finish() {
    const r = Curriculum.examScoreOf(answers);
    const v = Curriculum.examVerdict(r, answers, { nameFor: curNameFor });
    logEvent({ e: "exam-done", n: week.n, kind: ex.kind, attempt, score: r.score, correct: r.correct, total: r.total, sections: r.sections });

    // levels are recomputed AFTER the grades land, so a level can be won by the test
    const after = Object.assign({}, ctx, { log: store.get("ats-log", []), srs: getSrs() });
    const summary = Curriculum.levelSummary(after);
    const tr = Curriculum.examTrajectory(after.log, week.n);
    (Curriculum.levels(after).quran.earned || []).forEach(() => {});

    body.innerHTML = `
      <div style="text-align:center;margin-bottom:6px">
        <div class="big">${r.score}</div>
        <div style="font-size:15px;font-weight:600;text-transform:capitalize">${esc(v.band)}</div>
        ${tr && tr.attempts > 1 ? `<div class="traj">attempt ${tr.attempts} this week · ${tr.scores.join(" → ")}${tr.gain > 0 ? ` (+${tr.gain})` : ""}</div>` : ""}
      </div>
      <div style="background:var(--accent-soft);border-radius:12px;padding:12px 14px;font-size:14.5px;line-height:1.7">
        ${v.lines.map(l => `<p style="margin:0 0 6px">${esc(l)}</p>`).join("")}
        <p style="margin:8px 0 0;font-weight:600">${esc(v.nextWeek)}</p>
      </div>
      <div style="margin-top:12px;font-size:14px">
        ${summary.map(s => `<p style="margin:0 0 4px">${esc(s.line)}</p>`).join("")}
      </div>
      <div class="q-row" style="justify-content:flex-start">
        <button class="primary" id="again">Take it again</button>
        <a href="index.html" style="text-decoration:none;padding:10px 18px;border:1px solid var(--border);border-radius:10px">Back to home</a>
      </div>`;
    document.getElementById("again").onclick = async () => {
      const fresh = await curCtx();
      paintLevels(fresh); paintWeek(week, fresh); paintHistory(fresh);
      runTest(week, fresh);
    };
    // the rest of the page reflects the new grades immediately
    curCtx().then(fresh => { if (fresh) { paintLevels(fresh); paintWeek(week, fresh); paintHistory(fresh); } });
    try { if (typeof syncSoon === "function") syncSoon(); } catch (e) {}
  }

  ask();
}

(async () => {
  const got = await weekGet();
  if (!got) { document.getElementById("weekBody").textContent = "Couldn't load the curriculum data."; return; }
  WEEK = got.week; CTX = got.ctx;
  paintLevels(CTX);
  paintWeek(WEEK, CTX);
  paintTestIntro(WEEK, CTX);
  paintHistory(CTX);
})();
</script>
</body>
</html>
